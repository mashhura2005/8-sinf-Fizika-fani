3:[["Jismlar orasidagi masofa ularning o'lchamidan ancha katta bo'lsa, ularni nuqtaviy zaryad deb olamiz. Masofa katta (30 sm) bo'lganda ta'sir kuchsiz.",{q1:3,q2:3,r:30}],["Kuch zaryadlar ko'paytmasiga to'g'ri, masofa kvadratiga teskari. Masofa 8 sm ga kamaydi: kuch keskin ortdi.",{q1:4,q2:4,r:8}],["Zaryadlardan birini 2 marta oshirsangiz kuch 2 marta, masofani 2 marta kamaytirsangiz 4 marta ortadi.",{q1:8,q2:4,r:12}],["Zaryad kulonda, masofa metrda o'lchanadi: 1 µC = 10⁻⁶ C, 1 sm = 10⁻² m, k = 9·10⁹ N·m²/C².",{q1:1,q2:1,r:10}]],
17:[["Zanjirda kuchlanishni o'zgartirib tokni o'lchaymiz. Qarshilik 6 Ω, kuchlanish oshib bormoqda.",{u:6,r:6}],["Tok kuchlanishga to'g'ri, qarshilikka teskari: 12 V va 4 Ω da I = 3 A.",{u:12,r:4}],["Qarshilik o'zgarmasa, kuchlanish 2 marta oshganda tok ham 2 marta ortadi: I(U) to'g'ri chiziq.",{u:24,r:6}],["Om qonuni metallarda, harorat o'zgarmaganda to'g'ri. Qarshilik katta bo'lsa tok deyarli kichik.",{u:12,r:20}]],

27:[["Kondensator dielektrik bilan ajratilgan ikki qoplamadan iborat; manbaga ulansa zaryadlanadi.",{s:50,d:3,u:10}],["C = q/U. Kuchlanishni oshiring: zaryad ortadi, sig'im o'zgarmaydi.",{s:50,d:3,u:40}],["C = ε₀S/d. Qoplamalarni yaqinlashtirib, yuzani oshiring: sig'im ortadi.",{s:90,d:1,u:10}],["W = CU²/2. Kuchlanish 2 marta ortsa, energiya 4 marta ortadi.",{s:50,d:3,u:30}]],
31:[["Quvvat — vaqt birligida bajarilgan ish. Qarshilik kichik bo'lsa quvvat ortadi va rezistor qiziydi.",{u:12,r:4,s:10}],["P = U·I = U²/R. 12 V va 6 Ω da tok 2 A, quvvat 24 W.",{u:12,r:6,s:10}],["Quvvat vattda o'lchanadi: 1 W = 1 J/s. Ish A = P·t (vaqt sekundda).",{u:12,r:6,s:60}],["Kuchlanish 2 marta oshsa quvvat 4 marta oshadi: 24 V va 6 Ω da 96 W.",{u:24,r:6,s:10}]],

1:[["Ishqalanganda elektronlar bir jismdan ikkinchisiga o'tadi (chapdan kelayotgan nuqtalar).",{n:4}],["Elektron olgan jism manfiy, yo'qotgan jism musbat zaryadlanadi.",{n:10}],["Zaryad ko'p bo'lsa, bir xil ishorali zaryadlar bir-birini kuchli itaradi va uchqun chiqishi mumkin.",{n:16}],["Zaryad yo'qolmaydi, faqat bir jismdan boshqasiga o'tadi.",{n:8}]],
11:[["Maydon zaryadni ko'chirishda ish bajaradi; ish katta bo'lsa, kuchlanish ham katta.",{u:6,r:6}],["U = A/q; birligi volt: 1 V = 1 J/C. Kuchlanishni 24 V ga oshirdik.",{u:24,r:6}],["Voltmetr kuchlanishni o'lchaydi, iste'molchiga parallel ulanadi, uning qarshiligi juda katta.",{u:12,r:6}],["Qarshilik o'zgarmasa, kuchlanish ortganda tok ham ortadi (nuqtalar tezlashadi).",{u:20,r:10}]],

15:[["Elektronlar kristall panjara ionlari bilan to'qnashadi va harakati sekinlashadi.",{u:12,r:15}],["R = ρl/S: uzun va ingichka sim qarshiligi katta. Qarshilik oshdi, tok kamaydi.",{u:12,r:20}],["Metall qizisa, ionlar kuchliroq tebranib qarshilik ortadi.",{u:12,r:12}],["Mis va kumush qarshiligi kichik (yaxshi o'tkazgich), nixrom qarshiligi katta.",{u:12,r:2}]],
40:[["Metallda valent elektronlar atomlardan ajralib erkin harakatlanadi.",{u:6,r:6}],["Maydon elektronlarni bir yo'nalishda sekin siljitadi: tok shundan hosil bo'ladi.",{u:12,r:6}],["To'qnashuvlar sabab qarshilik paydo bo'ladi: qarshilik katta bo'lsa elektronlar sekin.",{u:12,r:20}],["Juda past haroratda ba'zi metallarda R = 0 bo'ladi; tok yo'qotishsiz oqadi.",{u:12,r:1}]],
46:[["Vakuumda zarralar deyarli yo'q, tok tashuvchilar tashqaridan beriladi. Kuchlanish kichik: elektronlar sekin.",{u:20}],["Qizigan katod elektron chiqaradi; ular anod tomon yuradi.",{u:80}],["Elektronlar faqat katoddan anodga yuradi: vakuum diod tokni bir tomonga o'tkazadi.",{u:150}],["Kuchlanish oshganda elektronlar tezlashadi: v = √(2eU/m).",{u:280}]],

52:[["Tok o'tgan o'tkazgich atrofida magnit maydon hosil bo'ladi: chapda aylanalar ko'rinadi.",{i:2,b:1}],["Parma tok bo'ylab burilsa, uning aylanishi maydon chiziqlari yo'nalishini bildiradi (nuqtalar aylanadi).",{i:5,b:1}],["G'altak o'ramlarining maydonlari qo'shilib, ichida bir jinsli maydon hosil qiladi.",{i:6,b:3}],["Tok kuchi oshsa, maydon kuchayadi: nuqtalar tezroq aylanadi.",{i:10,b:3}]],

2:[["Zaryad — jismning elektr o'zaro ta'sirga kirishish xossasi. Zaryadlarni orttirsangiz, ta'sir kuchi ortadi.",{q1:8,q2:8,r:15}],["Eng kichik zaryad — elektron zaryadi e = 1,6·10⁻¹⁹ C. Har qanday zaryad unga karrali: q = N·e.",{q1:1,q2:1,r:15}],["Yopiq tizimda zaryadlarning algebraik yig'indisi o'zgarmaydi. Zaryad faqat bir jismdan ikkinchisiga o'tadi.",{q1:5,q2:5,r:10}],["Zaryad uzluksiz emas: u butun sondagi elektron zaryadlari ko'rinishida mavjud.",{q1:3,q2:3,r:20}]],
5:[["Har bir zaryad atrofida elektr maydon bor; boshqa zaryadlarga u orqali ta'sir qiladi (kengayuvchi doiralar).",{q1:6,q2:2,r:20}],["E = F/q — sinov zaryadiga ta'sir etuvchi kuchning zaryadga nisbati. Uzoqlashgan sari maydon kuchsizlanadi.",{q1:6,q2:2,r:28}],["Maydon chiziqlari musbat zaryaddan chiqadi; zich joyda maydon kuchli. Zaryadlar yaqinlashsa maydon kuchayadi.",{q1:6,q2:6,r:7}],["Bir necha zaryad maydoni har birining maydonlari vektor yig'indisiga teng (superpozitsiya).",{q1:10,q2:10,r:15}]],
6:[["O'tkazgichda zaryadlar erkin harakatlana oladi; ular bir-birini itarib joylashadi.",{n:6}],["Zaryad o'tkazgichning tashqi sirtida taqsimlanadi, ichida zaryad bo'lmaydi.",{n:10}],["O'tkazgich ichida maydon nolga teng, shuning uchun metall g'ilof ichidagi asboblarni himoya qiladi.",{n:12}],["Dielektrikda erkin zaryadlar yo'q: zaryad harakatlanmaydi, faqat qutblanadi.",{n:3}]],
8:[["Bulutlarda ishqalanish natijasida zaryadlar to'planadi: pastki qismi manfiy, yuqorisi musbat.",{n:8}],["Zaryad yetarlicha katta bo'lsa, havo teshiladi va uchqun — chaqmoq paydo bo'ladi.",{n:18}],["Bino tepasidagi o'tkazgich zaryadni yerga o'tkazib, binoni himoya qiladi.",{n:14}],["Momaqaldiroqda ochiq joyda va yakka daraxt tagida turmang; xonada oynalarni yoping.",{n:5}]],
9:[["Elektr toki — zaryadli zarralarning tartibli harakati. Nuqtalar shu harakatni ko'rsatadi.",{u:12,r:6}],["Tok uchun erkin zaryadlar va ularni harakatlantiruvchi elektr maydon (manba) kerak.",{u:24,r:6}],["Zanjir manba, iste'molchi, o'tkazgichlar va kalitdan iborat. Zanjir yopiq bo'lsa tok oqadi.",{u:12,r:10}],["Tok issiqlik, kimyoviy va magnit ta'sir ko'rsatadi.",{u:20,r:5}]],
10:[["Manba zaryadlarni ajratib, qutblar orasida kuchlanish hosil qiladi va tokni ushlab turadi.",{u:12,r:6}],["Galvanik elementda kimyoviy energiya elektr energiyaga aylanadi; kuchlanishi kichik.",{u:2,r:6}],["Akkumulyator qayta zaryadlanadi, generator mexanik energiyani elektr energiyaga aylantiradi.",{u:12,r:4}],["EYUK — tashqi kuchlar ishining zaryadga nisbati: ℰ = A/q, birligi volt.",{u:24,r:8}]],
14:[["Ish uchun manba, kalit, rezistor, ampermetr va voltmetr kerak bo'ladi.",{u:6,r:6}],["Sxemada ampermetr ketma-ket, voltmetr parallel ulanadi. Avval sxema chiziladi.",{u:6,r:10}],["Elementlar sxema bo'yicha ulanadi, kalit oxirida yopiladi (tok boshlanadi).",{u:12,r:6}],["U va I ni yozib R = U/I ni hisoblang: natija qarshilikka mos chiqadi.",{u:12,r:4}]],
16:[["Rezistor — qarshiligi ma'lum element; zanjirda tokni cheklaydi.",{u:12,r:8}],["Reostat — simli g'altak va sirpanuvchi kontaktdan iborat; kontakt surilsa ishchi uzunlik o'zgaradi.",{u:12,r:15}],["Potensiometr kuchlanishni bo'luvchi sifatida ishlaydi va uni silliq rostlaydi.",{u:12,r:3}],["Reostat radio va ovozni rostlashda qo'llanadi. R oshsa tok kamayadi.",{u:12,r:20}]],
19:[["Manba, ampermetr, rezistor va kalitni ketma-ket ulang, voltmetrni rezistorga parallel qiling.",{u:6,r:6}],["Kuchlanishni bir necha qiymatga o'zgartirib, har safar tokni yozing.",{u:12,r:6}],["(U; I) nuqtalaridan I(U) grafigi chiziladi: u to'g'ri chiziq bo'ladi.",{u:24,r:6}],["Qarshilik o'zgarmasa tok kuchlanishga to'g'ri proporsional: Om qonuni tasdiqlandi.",{u:18,r:6}]],

Object.assign(B,{17:[
["1827-yilda nemis fizigi Georg Om zanjirning bir qismida tok kuchi, kuchlanish va qarshilik orasidagi bog'lanishni tajribada aniqladi. Tajriba uchun manba, rezistor, ampermetr va voltmetr ulangan zanjir yig'iladi. Qarshilik o'zgarmaganda kuchlanishni bosqichma-bosqich oshirib, har safar tok kuchini o'lchaydilar. Kuchlanish necha marta oshsa, tok ham shuncha marta oshishi aniqlanadi. Animatsiyada kuchlanish o'zgarganda zaryadlar (nuqtalar) tezligi ham o'zgaradi.",

(g,t,K)=>{const R=8+6*Math.sin(t*.8),U=12,I=U/R,bar=(y,l,v,max,c)=>{g.fillStyle=K.m;g.globalAlpha=.25;g.fillRect(120,y,420,22);g.globalAlpha=1;g.fillStyle=c;g.fillRect(120,y,420*v/max,22);g.fillStyle=K.c;g.textAlign='right';g.font='14px sans-serif';g.fillText(l,110,y+16)};bar(30,'U',U,24,K.a);bar(80,'R',R,20,K.m);bar(130,'I',I,6,K.h);g.textAlign='left';g.fillText('I = U/R = '+U+' / '+R.toFixed(1)+' = '+I.toFixed(2)+' A',120,185)}],

(g,t,K)=>{gx(g,K);const X=u=>60+u/24*480,Y=i=>170-i*18;[[6,K.a],[3,K.m]].forEach(([R,c])=>{g.strokeStyle=c;g.lineWidth=3;g.beginPath();g.moveTo(X(0),Y(0));g.lineTo(X(24),Y(24/R));g.stroke()});const u=(t*3)%24;g.fillStyle=K.h;g.beginPath();g.arc(X(u),Y(u/6),7,0,7);g.fill();g.fillStyle=K.c;g.font='13px sans-serif';g.textAlign='center';g.fillText('U (V)',530,190);g.fillText('I (A)',40,20);g.fillText('R = 3 Ω',X(16),Y(16/3)-10);g.fillText('R = 6 Ω',X(20),Y(20/6)+18)}],
["Om qonuni haroratni o'zgarmas deb olganda metallar va elektrolit eritmalari uchun to'g'ri. Tok o'tganda o'tkazgich qizisa, qarshiligi ortadi va grafik to'g'ri chiziqdan chetga chiqadi (masalan, cho'g'lanma lampada). Yarimo'tkazgichli diodlar va gazlar Om qonuniga bo'ysunmaydi. Shuning uchun qonunni qo'llashdan oldin sharoit (harorat, material) hisobga olinishi kerak.",
(g,t,K)=>{gx(g,K);const X=u=>60+u/24*480,Y=i=>170-i*36,f=u=>u/(6+.012*u*u);g.strokeStyle=K.m;g.setLineDash([5,5]);g.lineWidth=2;g.beginPath();g.moveTo(X(0),Y(0));g.lineTo(X(24),Y(4));g.stroke();g.setLineDash([]);g.strokeStyle=K.a;g.lineWidth=3;g.beginPath();for(let u=0;u<=24;u+=.5)g.lineTo(X(u),Y(f(u)));g.stroke();const u=(t*3)%24;g.fillStyle=K.h;g.beginPath();g.arc(X(u),Y(f(u)),7,0,7);g.fill();g.fillStyle=K.c;g.font='13px sans-serif';g.textAlign='center';g.fillText("Qizigan o'tkazgichda R ortadi: grafik egiladi",330,30)}]],
21:[
["Iste'molchilar ketma-ket ulanganda ular bitta zanjirga, shoxlanishsiz navbat bilan ulanadi: bir iste'molchining oxiri ikkinchisining boshiga tutashadi. Zaryadlar uchun faqat bitta yo'l bor. Shu sababli tok hamma iste'molchilardan o'tadi va bittasi uzilsa, butun zanjir to'xtaydi. Masalan, eski yangi yil gulchambarlarida bitta lampa kuyib qolsa, hammasi o'chadi.",

(g,t,K)=>{const R2=8+6*Math.sin(t*.8),I=12/(4+R2),U1=I*4,U2=I*R2,w=480/12;g.fillStyle=K.a;g.fillRect(60,70,U1*w,40);g.fillStyle=K.h;g.fillRect(60+U1*w,70,U2*w,40);g.fillStyle=K.c;g.font='14px sans-serif';g.textAlign='center';g.fillText('U₁ = '+U1.toFixed(1)+' V',60+U1*w/2,95);g.fillText('U₂ = '+U2.toFixed(1)+' V',60+U1*w+U2*w/2,95);g.fillText('U = U₁ + U₂ = 12 V,   I = '+I.toFixed(2)+' A (ikkalasida bir xil)',300,150)}],
["Ketma-ket ulangan iste'molchilarning umumiy qarshiligi qarshiliklar yig'indisiga teng: R = R₁ + R₂ (+ R₃ + ...). Bu o'tkazgich uzunligi oshgani kabi: qarshilik uzunlikka to'g'ri proporsional. Shuning uchun umumiy qarshilik har bir qarshilikdan katta. n ta bir xil R li rezistor ulansa, umumiy qarshilik n·R bo'ladi. Qarshilik oshgan sari bir xil kuchlanishda tok kamayadi.",
(g,t,K)=>{const R2=8+6*Math.sin(t*.8),w=26;g.fillStyle=K.a;g.fillRect(60,50,4*w,30);g.fillStyle=K.h;g.fillRect(60+4*w,50,R2*w,30);g.fillStyle=K.c;g.font='14px sans-serif';g.textAlign='left';g.fillText('R₁ = 4 Ω    R₂ = '+R2.toFixed(1)+' Ω',60,40);g.fillStyle=K.m;g.fillRect(60,110,(4+R2)*w,30);g.fillStyle=K.c;g.fillText('R = R₁ + R₂ = '+(4+R2).toFixed(1)+' Ω',60,160)}],
["Misol: R₁ = 4 Ω, R₂ = 6 Ω, U = 12 V. Umumiy qarshilik R = 4 + 6 = 10 Ω. Tok I = U/R = 12/10 = 1,2 A, u ikkala rezistordan o'tadi. Kuchlanishlar: U₁ = I·R₁ = 4,8 V va U₂ = I·R₂ = 7,2 V; ularning yig'indisi 12 V ga teng. Hisobni shu yig'indi bilan tekshiring: u manba kuchlanishiga teng bo'lishi kerak.",
seq(['R = 4 + 6 = 10 Ω','I = U/R = 12/10 = 1,2 A','U₁ = 1,2·4 = 4,8 V','U₂ = 1,2·6 = 7,2 V','U₁ + U₂ = 12 V ✓'])]]});

Object.assign(B,{22:[
