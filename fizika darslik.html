[`Eng oddiy elektr zanjir to'rt qismdan iborat: tok manbai (energiya beradi), iste'molchi (energiyani boshqa turga aylantiradi: lampa, isitgich), ulovchi o'tkazgichlar va kalit (zanjirni ulaydi va uzadi). Tok faqat yopiq zanjirda oqadi: kalit ochilsa, zanjir uziladi va tok to'xtaydi. Zanjirni sxema shaklida shartli belgilar bilan tasvirlash qulay: har bir qurilma o'z belgisiga ega.`,
(g,t,K)=>{const on=Math.floor(t/3)%2==1,P=1240,pt=s=>{s%=P;if(s<480)return[60+s,30];s-=480;if(s<140)return[540,30+s];s-=140;if(s<480)return[540-s,170];s-=480;return[60,170-s]};g.strokeStyle=K.m;g.lineWidth=3;g.beginPath();g.moveTo(60,170);g.lineTo(60,30);g.lineTo(220,30);g.moveTo(300,30);g.lineTo(540,30);g.lineTo(540,170);g.lineTo(60,170);g.stroke();g.strokeStyle=K.c;g.lineWidth=4;g.beginPath();g.moveTo(220,30);g.lineTo(on?300:290,on?30:10);g.stroke();g.fillStyle=K.h;g.fillRect(48,90,24,6);g.fillRect(52,104,16,6);g.fillStyle=on?'#ffd43b':K.m;g.globalAlpha=on?1:.3;g.beginPath();g.arc(540,100,20,0,7);g.fill();g.globalAlpha=1;if(on){g.fillStyle=K.h;for(let i=0;i<22;i++){const[x,y]=pt(i*P/22+t*60);g.beginPath();g.arc(x,y,3.5,0,7);g.fill()}}g.fillStyle=K.c;g.font='13px sans-serif';g.textAlign='center';g.fillText('kalit',260,55);g.fillText('manba',105,100);g.fillText('lampa',480,100);g.font='14px sans-serif';g.fillText(on?'zanjir yopiq: tok oqmoqda':`zanjir ochiq: tok yo'q`,300,194)}],
[`Tok uch xil ta'sir ko'rsatadi. Issiqlik ta'siri: o'tkazgich qiziydi (isitgich, lampa). Kimyoviy ta'siri: elektrolitlarda elektrodlarda moddalar ajraladi (elektroliz). Magnit ta'siri: tok o'tgan o'tkazgich atrofida magnit maydon hosil bo'ladi va magnit strelkaga ta'sir qiladi. Magnit ta'sir tokning barcha hollarida kuzatiladi, shuning uchun tok mavjudligini aynan shu ta'sir bo'yicha aniqlaydilar.`,
(g,t,K)=>{const sc=Math.floor(t/3)%3,ph=(t%3)/3;g.textAlign='center';g.font='14px sans-serif';if(sc==0){const a=Math.min(1,ph*1.5);g.shadowColor='#ff6b00';g.shadowBlur=40*a;g.fillStyle=`rgb(${100+155*a},${90-60*a},${90-70*a})`;g.fillRect(200,80,200,36);g.shadowBlur=0;g.fillStyle=K.c;g.fillText(`issiqlik ta'siri: o'tkazgich qiziydi`,300,170)}else if(sc==1){g.strokeStyle=K.m;g.lineWidth=3;g.strokeRect(170,40,260,110);g.fillStyle=K.c;g.fillRect(210,25,8,95);g.fillRect(382,25,8,95);g.fillStyle=K.h;g.fillRect(210-ph*10,40,ph*10,80);g.fillStyle=K.c;g.fillText(`kimyoviy ta'sir: elektrodda modda ajraladi`,300,175)}else{const f=-Math.PI/2+Math.min(1,ph*2)*Math.PI/2;g.strokeStyle=K.m;g.lineWidth=5;g.beginPath();g.moveTo(80,60);g.lineTo(520,60);g.stroke();g.lineWidth=2;g.beginPath();g.arc(300,125,32,0,7);g.stroke();g.lineWidth=5;g.strokeStyle='#e03131';g.beginPath();g.moveTo(300,125);g.lineTo(300+26*Math.cos(f),125+26*Math.sin(f));g.stroke();g.strokeStyle='#1c7ed6';g.beginPath();g.moveTo(300,125);g.lineTo(300-26*Math.cos(f),125-26*Math.sin(f));g.stroke();g.fillStyle=K.c;g.fillText(`magnit ta'sir: strelka buriladi`,300,185)}}]],
10:[
[`Tok manbai — zanjirda tok hosil qiluvchi va uni doimiy ushlab turuvchi qurilma. Manbada tashqi (elektr bo'lmagan) kuchlar zaryadlarni ajratadi: bir qutbda ortiqcha musbat, ikkinchisida manfiy zaryadlar to'planadi va qutblar orasida kuchlanish hosil bo'ladi. Zanjir yopilsa, zaryadlar tashqi zanjir bo'ylab harakatlanadi, manba ichida esa tashqi kuchlar ularni qaytib ajratadi.`,
(g,t,K)=>lp(g,t,K,2,[[300,`iste'molchi`]],`manba zaryadlarni ajratib, tokni ushlab turadi`)],
[`Galvanik element — kimyoviy energiyani elektr energiyasiga aylantiruvchi manba. U eritmaga (elektrolitga) tushirilgan ikki xil metall elektroddan iborat. Masalan, rux va mis elektrodli Volta elementida rux eritmaga ionlar holida o'tadi va elektronlarini elektrodda qoldiradi, shuning uchun rux manfiy qutb bo'ladi, mis esa musbat. Elektronlar tashqi simdan ruxdan misga o'tadi. Quruq batareyalar ham shu printsipda ishlaydi.`,
(g,t,K)=>{g.strokeStyle=K.m;g.lineWidth=3;g.strokeRect(150,90,300,90);g.fillStyle=K.a;g.globalAlpha=.2;g.fillRect(151,110,298,69);g.globalAlpha=1;g.fillStyle=K.c;g.fillRect(200,50,14,110);g.fillRect(386,50,14,110);g.font='13px sans-serif';g.textAlign='center';g.fillText('Zn (−)',207,14);g.fillText('Cu (+)',393,14);g.strokeStyle=K.m;g.lineWidth=2;g.beginPath();g.moveTo(207,50);g.lineTo(207,25);g.lineTo(393,25);g.lineTo(393,50);g.stroke();g.fillStyle=K.h;for(let i=0;i<6;i++){const x=207+((i*31+t*60)%186);g.beginPath();g.arc(x,25,3.5,0,7);g.fill()}g.fillStyle=K.a;for(let i=0;i<6;i++){const p=(t*.6+i/6)%1;g.beginPath();g.arc(214+p*100,120+(i%3)*18,4,0,7);g.fill()}g.fillStyle=K.c;g.font='14px sans-serif';g.fillText(`Zn ionlari eritmaga o'tadi, elektronlar simdan Cu ga oqadi`,300,198)}],
[`Akkumulyator — qayta zaryadlanadigan kimyoviy tok manbai: zaryadlashda elektr energiyasi kimyoviy energiyaga aylanib saqlanadi, ishlatishda esa qayta elektr energiyaga aylanadi. Avtomobil va telefonlarda ishlatiladi. Generator — mexanik energiyani elektr energiyaga aylantiruvchi manba: magnit maydonda aylanayotgan ramkada tok induksiyalanadi. Elektr stansiyalardagi generatorlarni suv, bug' yoki shamol aylantiradi. Quyosh batareyasi yorug'lik energiyasini elektr energiyaga aylantiradi.`,
(g,t,K)=>{const sc=Math.floor(t/4)%2;g.textAlign='center';g.font='14px sans-serif';if(sc==0){const a=t*3;g.fillStyle='#e03131';g.fillRect(60,50,40,100);g.fillStyle='#1c7ed6';g.fillRect(500,50,40,100);const w=Math.abs(Math.cos(a))*140;g.strokeStyle=K.h;g.lineWidth=5;g.strokeRect(300-w/2,45,w,110);g.fillStyle=K.c;g.fillText(`generator: ramka aylanadi, mexanik energiya elektrga aylanadi`,300,185);const e=Math.sin(a);g.fillStyle=K.a;g.fillRect(300+(e>0?0:e*100),12,Math.abs(e)*100,10)}else{const p=(t%4)/4;g.strokeStyle=K.m;g.lineWidth=3;g.strokeRect(220,50,160,90);g.fillStyle=K.m;g.fillRect(380,80,10,30);g.fillStyle=K.a;g.fillRect(224,54,152*p,82);g.fillStyle=K.c;g.fillText('akkumulyator: zaryadlanmoqda '+Math.round(p*100)+'%',300,175)}}],
[`Elektr yurituvchi kuch (EYUK) — manba ichida tashqi kuchlarning zaryadni ko'chirishda bajargan ishining shu zaryadga nisbati: ℰ = A_tashqi/q. Birligi — volt (V). EYUK manbaning energetik xarakteristikasi. Manba qutblaridagi kuchlanish U = ℰ − I·r, bunda r — manbaning ichki qarshiligi. Yuklama kam (zanjir deyarli ochiq) bo'lsa, U ≈ ℰ; tok ortgan sari U kamayadi. Shuning uchun voltmetr ochiq manba qutblarida EYUK ga yaqin qiymat ko'rsatadi.`,
(g,t,K)=>{const R=8+6*Math.sin(t*.7),E=12,U=E*R/(R+1),bar=(y,l,v,c)=>{g.fillStyle=c;g.fillRect(120,y,420*v/12,22);g.fillStyle=K.c;g.textAlign='right';g.font='14px sans-serif';g.fillText(l,110,y+16)};bar(40,'ℰ',E,K.a);bar(90,'U',U,K.h);g.textAlign='left';g.fillText('R = '+R.toFixed(1)+' Ω,  r = 1 Ω:  U = ℰR/(R+r) = '+U.toFixed(1)+' V',120,150);g.fillText(`yuklama kam bo'lsa, U → ℰ`,120,180)}]]});
Object.assign(B,{16:[
[`Rezistor — ma'lum qarshilikka ega bo'lgan elektr zanjir elementi. U zanjirda tok kuchini cheklash, kuchlanishni bo'lish va elektr energiyasini issiqlikka aylantirish uchun ishlatiladi. Rezistor sxemada to'g'ri to'rtburchak bilan belgilanadi. Bir xil kuchlanishda qarshilik qancha katta bo'lsa, tok shuncha kichik bo'ladi: I = U/R. Animatsiyada 2 Ω va 10 Ω qarshilikli rezistorlarda tok tezligi taqqoslangan.`,
(g,t,K)=>{const R=Math.floor(t/3)%2?10:2;lp(g,t,K,12/R,[[300,'R = '+R+' Ω']],'U = 12 V:  I = U/R = '+(12/R).toFixed(1)+' A')}],
[`Reostat — qarshiligini o'zgartirish mumkin bo'lgan qurilma. U izolyatsiyalangan silindrga o'ralgan yuqori solishtirma qarshilikli sim (nixrom, konstantan) va sim bo'ylab sirpanadigan kontaktdan iborat. Kontakt surilganda zanjirga ulangan sim uzunligi o'zgaradi, shuning uchun R = ρl/S ga ko'ra qarshilik ham o'zgaradi. Reostat zanjirga iste'molchi bilan ketma-ket ulanadi va tok kuchini silliq rostlash uchun ishlatiladi.`,
(g,t,K)=>{const s=.5+.5*Math.sin(t*.8),x=100+400*s;for(let i=0;i<20;i++){const xx=100+i*20;g.strokeStyle=xx<=x?K.h:K.m;g.lineWidth=3;g.beginPath();g.ellipse(xx,110,5,24,0,0,7);g.stroke()}g.strokeStyle=K.c;g.lineWidth=3;g.beginPath();g.moveTo(x,60);g.lineTo(x,86);g.moveTo(100,60);g.lineTo(500,60);g.stroke();g.fillStyle=K.c;g.beginPath();g.moveTo(x,90);g.lineTo(x-7,76);g.lineTo(x+7,76);g.fill();g.font='14px sans-serif';g.textAlign='center';g.fillText('ishchi uzunlik ~ '+Math.round(s*100)+'%:  R = '+(20*s).toFixed(1)+' Ω',300,180)}],
[`Potensiometr — kuchlanishni silliq rostlash uchun ishlatiladigan o'zgaruvchan rezistor. Manba reostatning chetki uchlariga ulanadi (kuchlanish bo'luvchi), iste'molchi esa sirpanuvchi kontakt va bir chetki uch orasiga ulanadi. Kontaktni surib, iste'molchidagi kuchlanishni nol qiymatdan to manba kuchlanishigacha o'zgartirish mumkin. Reostatdan farqli, potensiometr tokni emas, asosan kuchlanishni rostlaydi.`,
(g,t,K)=>{const s=.5+.5*Math.sin(t*.8),x=100+400*s;g.fillStyle=K.a;g.fillRect(100,100,400,22);g.fillStyle=K.c;g.beginPath();g.moveTo(x,96);g.lineTo(x-8,76);g.lineTo(x+8,76);g.fill();g.strokeStyle=K.m;g.lineWidth=2;g.beginPath();g.moveTo(x,76);g.lineTo(x,50);g.lineTo(560,50);g.stroke();g.fillStyle=K.h;g.fillRect(100,150,400*s,12);g.fillStyle=K.c;g.font='14px sans-serif';g.textAlign='center';g.fillText('U = 12 V,  chiqish kuchlanishi U₁ = '+(12*s).toFixed(1)+' V',300,190);g.fillText('A',100,142);g.fillText('B',500,142)}],
[`Reostat va potensiometrlar kundalik texnikada keng qo'llaniladi: radio va televizorlarning ovoz balandligi, yoritgichlarning yorqinligi, elektr plita va fen quvvati, o'quv laboratoriyalarida tok va kuchlanishni rostlash. Dastani burganda sirpanuvchi kontakt siljib, qarshilik o'zgaradi: qarshilik oshsa, tok va ovoz balandligi kamayadi. Rezistorlar qarshiligi rangli halqalar yoki raqamlar yordamida belgilanadi.`,
(g,t,K)=>{const s=.5+.5*Math.sin(t*.7),a=-2.35+s*4.7;g.strokeStyle=K.m;g.lineWidth=4;g.beginPath();g.arc(120,100,46,0,7);g.stroke();g.strokeStyle=K.h;g.lineWidth=5;g.beginPath();g.moveTo(120,100);g.lineTo(120+38*Math.sin(a),100-38*Math.cos(a));g.stroke();g.strokeStyle=K.a;g.lineWidth=3;g.beginPath();for(let x=220;x<=560;x+=4){const y=100+s*70*Math.sin((x-t*160)/14);if(x==220)g.moveTo(x,y);else g.lineTo(x,y)}g.stroke();g.fillStyle=K.c;g.font='14px sans-serif';g.textAlign='center';g.fillText(`dasta burilsa, tok va ovoz balandligi o'zgaradi`,300,192)}]],
28:[
[`Kondensatorlar parallel ulanganda ularning bir xil nomli qoplamalari umumiy tuguna ulanadi. Hamma kondensatorlardagi kuchlanish bir xil: U = U₁ = U₂, umumiy zaryad esa zaryadlar yig'indisiga teng: q = q₁ + q₂. Parallel ulash qoplamalarning umumiy yuzasini oshirgandek ta'sir qiladi, shuning uchun sig'im ortadi. Sxemada kondensatorlar manbaga bir-biriga parallel shoxlar bilan ulanadi.`,
(g,t,K)=>{const p=(t*.3)%1,cp=(x,C)=>{const h=C*20;g.fillStyle=K.a;g.fillRect(x-12,110-h/2,5,h);g.fillRect(x+7,110-h/2,5,h);const n=Math.round(C*3*p);for(let i=0;i<n;i++){const y=110-h/2+(i+.5)*h/Math.max(n,1);g.fillStyle=K.h;g.beginPath();g.arc(x-18,y,2.5,0,7);g.fill();g.fillStyle=K.c;g.beginPath();g.arc(x+18,y,2.5,0,7);g.fill()}g.fillStyle=K.c;g.font='13px sans-serif';g.textAlign='center';g.fillText(C+' µF',x,170)};cp(120,2);cp(240,3);cp(430,5);g.font='16px sans-serif';g.fillText('+',180,114);g.fillText('=',340,114);g.font='14px sans-serif';g.fillText(`parallel ulashda sig'imlar qo'shiladi: C = C₁ + C₂`,300,196)}],
[`Kondensatorlar ketma-ket ulanganda ular zanjirda navbat bilan joylashadi. Hamma kondensatorlarda zaryad bir xil: q = q₁ = q₂. Umumiy kuchlanish kuchlanishlar yig'indisiga teng: U = U₁ + U₂, va sig'imi kichik kondensatorga ko'proq kuchlanish tushadi (U = q/C). Ketma-ket ulash qoplamalar orasidagi masofani kattalashtirgandek ta'sir qiladi, shuning uchun umumiy sig'im kamayadi. Bu usul kuchlanishi chegaralangan kondensatorlarni yuqori kuchlanishda ishlatish uchun qo'llaniladi.`,
(g,t,K)=>{const U=10+5*Math.sin(t*.8),q=1.2*U,U1=q/2,U2=q/3,w=480/15;g.fillStyle=K.a;g.fillRect(60,70,U1*w,40);g.fillStyle=K.h;g.fillRect(60+U1*w,70,U2*w,40);g.fillStyle=K.c;g.font='14px sans-serif';g.textAlign='center';g.fillText('U₁ = '+U1.toFixed(1)+' V',60+U1*w/2,95);g.fillText('U₂ = '+U2.toFixed(1)+' V',60+U1*w+U2*w/2,95);g.fillText('C₁ = 2 µF, C₂ = 3 µF:  q₁ = q₂ = '+q.toFixed(1)+' µC',300,145);g.fillText('U = U₁ + U₂ = '+U.toFixed(1)+' V',300,175)}],
[`Parallel ulashda umumiy sig'im sig'imlar yig'indisiga teng: C = C₁ + C₂ + ...; u har bir sig'imdan katta. Ketma-ket ulashda teskari sig'imlar qo'shiladi: 1/C = 1/C₁ + 1/C₂ + ...; ikki kondensator uchun C = C₁C₂/(C₁ + C₂); umumiy sig'im eng kichik sig'imdan ham kichik. E'tibor bering: bu formulalar rezistorlarga nisbatan teskari: kondensatorlar parallel ulanganda sig'imlar qo'shiladi, rezistorlar ketma-ket ulanganda qarshiliklar qo'shiladi.`,
(g,t,K)=>{const C2=3.5+2.5*Math.sin(t*.8),C1=2,bar=(y,l,v,c)=>{g.fillStyle=c;g.fillRect(150,y,380*v/8,22);g.fillStyle=K.c;g.textAlign='right';g.font='14px sans-serif';g.fillText(l,142,y+16)};bar(20,'C₁',C1,K.m);bar(55,'C₂',C2,K.m);bar(100,'parallel',C1+C2,K.a);bar(135,'ketma-ket',C1*C2/(C1+C2),K.h);g.textAlign='left';g.fillText('C₂ = '+C2.toFixed(1)+' µF:  parallel '+(C1+C2).toFixed(1)+',  ketma-ket '+(C1*C2/(C1+C2)).toFixed(2)+' µF',150,190)}],
[`Misol: C₁ = 2 µF va C₂ = 3 µF kondensatorlar U = 10 V manbaga ulangan. Parallel ulashda C = 2 + 3 = 5 µF, umumiy zaryad q = C·U = 50 µC. Ketma-ket ulashda 1/C = 1/2 + 1/3 = 5/6, demak C = 1,2 µF; zaryad q = 1,2 · 10 = 12 µC har bir kondensatorda; kuchlanishlar U₁ = q/C₁ = 6 V va U₂ = q/C₂ = 4 V, ularning yig'indisi 10 V.`,
seq(['C₁ = 2 µF, C₂ = 3 µF, U = 10 V','Parallel: C = 2 + 3 = 5 µF,  q = 50 µC','Ketma-ket: 1/C = 1/2 + 1/3,  C = 1,2 µF','q = 1,2 · 10 = 12 µC;  U₁ = 6 V,  U₂ = 4 V'])]]});
Object.assign(B,{30:[
[`Elektr tokining ishi — zanjir qismida elektr maydon kuchlari zaryadlarni ko'chirishda bajargan ish. Bu ish iste'molchida boshqa turdagi energiyaga aylanadi: lampada — yorug'lik va issiqlikka, isitgichda — issiqlikka, dvigatelda — mexanik ishga. Shunday qilib, tokning ishi iste'molchi sarflagan elektr energiyasiga teng. Kuchlanish katta, tok katta va tok uzoq o'tsa, ish ko'p bo'ladi.`,
(g,t,K)=>{lp(g,t,K,2,[[300,'lampa']],`tok ishi yorug'lik va issiqlikka aylanadi`);g.fillStyle=K.h;g.fillRect(60,182,480*((t*.2)%1),8)}],
[`Kuchlanish U = A/q ekanidan A = q·U, tok kuchi I = q/t dan esa q = I·t. Bularni birlashtirib, tok ishi formulasini olamiz: A = U·I·t. Bu yerda U — kuchlanish (V), I — tok kuchi (A), t — vaqt (s). Om qonunidan foydalanib, boshqa ko'rinishlarni yozish mumkin: A = I²·R·t va A = U²·t/R. Masalan, U = 12 V, I = 2 A, t = 10 s bo'lsa, A = 12·2·10 = 240 J.`,
(g,t,K)=>{const I=2+1.5*Math.sin(t*.8),A=12*I*10,bar=(y,l,v,max,c)=>{g.fillStyle=c;g.fillRect(120,y,420*v/max,22);g.fillStyle=K.c;g.textAlign='right';g.font='14px sans-serif';g.fillText(l,110,y+16)};bar(30,'U (V)',12,24,K.a);bar(75,'I (A)',I,4,K.m);bar(120,'A (J)',A,480,K.h);g.textAlign='left';g.fillText('A = U·I·t = 12 · '+I.toFixed(1)+' · 10 = '+A.toFixed(0)+' J   (t = 10 s)',120,180)}],
[`Ishning SI dagi birligi — joul (J): 1 J = 1 V·A·s. Katta energiyalar uchun kilojoul (1 kJ = 1000 J) va megajoul ishlatiladi. Maishiy hisoblarda elektr energiyasi kilovatt-soatda o'lchanadi: 1 kVt·soat = 1000 W · 3600 s = 3,6·10⁶ J. Masalan, U = 220 V, I = 2 A, t = 10 s da tok ishi A = 220·2·10 = 4400 J = 4,4 kJ.`,
seq(['A = U·I·t','U = 220 V,  I = 2 A,  t = 10 s','A = 220·2·10 = 4400 J = 4,4 kJ','1 kVt·soat = 3,6·10⁶ J'])],
[`Sarflangan elektr energiyasini elektr hisoblagich o'lchaydi: u kilovatt-soatlarda ko'rsatadi. Hisoblagich ichidagi disk iste'mol qilinayotgan quvvatga proporsional tezlikda aylanadi va hisob mexanizmini harakatga keltiradi. Iste'mol uchun to'lov ikki ko'rsatish (oy boshi va oxiri) farqini tarifga ko'paytirib topiladi. Quvvati katta asboblar (choynak, isitgich) hisobni tezroq oshiradi.`,
(g,t,K)=>{const P=Math.floor(t/4)%2?1.5:.5,ang=(t*P*4)%6.28,rd=(1234.5+t*P*.05).toFixed(1);g.strokeStyle=K.m;g.lineWidth=3;g.strokeRect(180,25,240,145);g.fillStyle=K.a;g.fillRect(200,45,200,34);g.fillStyle='#fff';g.font='bold 20px monospace';g.textAlign='center';g.fillText(rd+' kVt·s',300,70);g.strokeStyle=K.c;g.lineWidth=2;g.beginPath();g.arc(300,125,28,0,7);g.stroke();g.strokeStyle=K.h;g.lineWidth=5;g.beginPath();g.moveTo(300-26*Math.cos(ang),125-26*Math.sin(ang));g.lineTo(300+26*Math.cos(ang),125+26*Math.sin(ang));g.stroke();g.fillStyle=K.c;g.font='14px sans-serif';g.fillText('quvvat '+P+' kVt: disk '+(P>1?'tez':'sekin')+' aylanadi',300,194)}]],
32:[
[`Masalalarda ish va quvvat bir-biriga bog'liq: A = P·t, bunda P — quvvat, t — vaqt. Quvvat vaqt birligidagi ishni ko'rsatsa, ish quvvatning vaqt bo'yicha yig'indisidir. Quvvati katta asbob bir xil vaqtda ko'proq energiya sarflaydi. Animatsiyada choynak (2000 W), dazmol (1000 W) va lampa (60 W) bir soatda qancha energiya iste'mol qilishi taqqoslangan.`,

[`Formulani berilgan va topiladigan kattaliklarga qarab tanlang. U, I, t berilgan bo'lsa: A = U·I·t. I, R, t berilgan bo'lsa: Q = I²Rt (yoki P = I²R). U, R, t berilgan bo'lsa: Q = U²t/R (yoki P = U²/R). Ish va vaqt berilgan bo'lsa: P = A/t. Barcha kattaliklarni SI birliklariga o'tkazishni unutmang: minut → sekund (×60), soat → sekund (×3600), kVt → W (×1000).`,
seq(['U, I, t berilgan:  A = U·I·t','I, R, t berilgan:  Q = I²·R·t','U, R, t berilgan:  Q = U²·t/R','A va t berilgan:  P = A/t'])],
[`Masala yechish tartibi: 1) berilganlarni yozing; 2) birliklarni SI ga o'tkazing; 3) mos formulani tanlang; 4) hisoblang. Misol: choynak 220 V kuchlanishda 5 A tok iste'mol qiladi. 10 minutda tok qancha ish bajaradi? t = 10 min = 600 s. A = U·I·t = 220·5·600 = 660 000 J = 660 kJ. Javob: 660 kJ.`,
seq(['U = 220 V,  I = 5 A,  t = 10 min','SI: t = 10·60 = 600 s','A = U·I·t = 220·5·600','A = 660 000 J = 660 kJ'])],
[`Natijani tekshirish: birliklar to'g'ri chiqdimi (V·A·s = J), son mantiqiymi? Misolda quvvat P = U·I = 220·5 = 1100 W, bu choynak uchun real qiymat (1–2 kVt). P = A/t = 660 000/600 = 1100 W: ikkala usul mos keldi. Energiyani kVt·soatda ham hisoblash mumkin: 660 000 J / 3,6·10⁶ ≈ 0,18 kVt·soat. Natijani teskari hisob orqali tekshirish yaxshi odat.`,
seq(['Birlik: V·A·s = J ✓','P = A/t = 660000/600 = 1100 W ✓','Choynak quvvati 1–2 kVt: mantiqiy ✓','A ≈ 0,18 kVt·soat ✓'])]]});

(g,t,K)=>{const L=['manba','kalit','lampochka','ampermetr','voltmetr'],S=['+−','/','⊙','A','V'],k=Math.min(5,Math.floor((t*.8)%6));L.forEach((n,i)=>{const x=60+i*100;g.globalAlpha=i<k?1:.15;g.fillStyle=i==2?'#ffd43b':i>2?K.a:K.h;g.fillRect(x,70,70,60);g.fillStyle=i==2?'#222':'#fff';g.font='bold 20px sans-serif';g.textAlign='center';g.fillText(S[i],x+35,108);g.fillStyle=K.c;g.font='13px sans-serif';g.fillText(n,x+35,150)});g.globalAlpha=1;g.font='14px sans-serif';g.fillText('kerakli asboblar: '+k+' / 5',300,40)}],

[`Xonadonning elektr hisoblagichi sarflangan energiyani kilovatt-soatda hisoblaydi. Hisob P va t bo'yicha olinadi: W = P·t. Masalan, 2 kVt li choynak 0,5 soat ishlasa 1 kVt·soat, 60 W lampa 10 soat yonsa 0,6 kVt·soat sarflaydi. Oy davomida sarf ikki ko'rsatish farqidan topiladi va tarifga ko'paytirilib to'lov hisoblanadi. Energiyani tejash uchun ishlatilmayotgan asboblarni o'chirish kerak.`,

Object.assign(B,{38:[
[`Elektr toki inson uchun xavfli. Xavf manbalari: izolyatsiyasi shikastlangan simlar va asboblar; nam muhit va ho'l qo'llar (suv tokni yaxshi o'tkazadi); zaryadlangan qismlarga bevosita tegish; yuqori kuchlanishli liniyalarga yaqinlashish; nosoz yoki ko'p asboblar ulangan rozetkalar. 50 mA dan yuqori tok yurak faoliyatini buzishi mumkin. Xavfsizlik uchun asboblarni to'g'ri ishlatish va tekshirib turish kerak.`,
(g,t,K)=>{const sc=Math.floor(t/3)%3;g.textAlign='center';g.font='14px sans-serif';if(sc==0){g.strokeStyle=K.m;g.lineWidth=8;g.beginPath();g.moveTo(60,100);g.lineTo(540,100);g.stroke();g.strokeStyle=K.h;g.lineWidth=3;g.beginPath();g.moveTo(280,100);g.lineTo(320,100);g.stroke();if(Math.sin(t*30)>0){g.fillStyle='#ffd43b';g.beginPath();g.arc(300,92,6,0,7);g.fill()}g.fillStyle=K.c;g.fillText(`izolyatsiyasi shikastlangan sim: tok urishi va yong'in xavfi`,300,170)}else if(sc==1){g.fillStyle=K.m;g.fillRect(260,60,80,80);g.fillStyle=K.c;g.fillRect(278,90,8,20);g.fillRect(314,90,8,20);g.fillStyle=K.a;for(let i=0;i<8;i++){const y=10+((t*80+i*25)%130);g.beginPath();g.arc(250+i*14,y,4,0,7);g.fill()}g.fillStyle=K.c;g.fillText(`nam muhit va ho'l qo'l: suv tok o'tkazadi, xavf ortadi`,300,170)}else{g.strokeStyle=K.c;g.lineWidth=4;g.beginPath();g.moveTo(260,170);g.lineTo(300,40);g.lineTo(340,170);g.moveTo(270,130);g.lineTo(330,130);g.moveTo(240,70);g.lineTo(360,70);g.stroke();g.strokeStyle=K.m;g.lineWidth=2;g.beginPath();g.moveTo(40,80);g.lineTo(240,70);g.moveTo(360,70);g.lineTo(560,80);g.stroke();if(Math.sin(t*25)>0){g.strokeStyle='#8ecbff';g.lineWidth=3;g.beginPath();g.moveTo(240,70);g.lineTo(215,95);g.lineTo(240,110);g.lineTo(215,140);g.stroke()}g.fillStyle=K.c;g.fillText('yuqori kuchlanishli liniyaga yaqinlashish xavfli',300,192)}}],
[`Qisqa tutashuv — faza va nol simlari orasida iste'molchisiz bevosita ulanish. Qarshilik juda kichik bo'lgani uchun I = U/R tok keskin oshadi: 220 V da 1 Ω qarshilikda 220 A. Bunday tok Q = I²Rt ga ko'ra simlarni bir lahzada qizdirib, izolyatsiyani yondiradi. Qisqa tutashuv sabablari: izolyatsiyaning shikastlanishi, nam, simlarning sinishi. Himoya: avtomat saqlagichlar va simlarni nominaliga mos tanlash.`,
(g,t,K)=>{const X=r=>60+(50-r)/49*480,Y=r=>170-Math.min(150,220/r*.65);g.strokeStyle=K.m;g.lineWidth=1;g.beginPath();g.moveTo(60,10);g.lineTo(60,170);g.lineTo(560,170);g.stroke();g.strokeStyle=K.a;g.lineWidth=3;g.beginPath();for(let r=50;r>=1;r-=.5)g.lineTo(X(r),Y(r));g.stroke();const r=50-((t*10)%49);g.fillStyle=K.h;g.beginPath();g.arc(X(r),Y(r),7,0,7);g.fill();g.fillStyle=K.c;g.font='13px sans-serif';g.textAlign='center';g.fillText('R kamayadi →',500,190);g.fillText('I',44,20);g.fillText('R = '+r.toFixed(0)+' Ω:  I = U/R = '+(220/r).toFixed(1)+' A  (U = 220 V)',300,40)}],
[`Elektr xavfsizlik vositalari: izolyatsiya (simlar va asboblarning plastik qoplamasi); yerga ulash (metall korpusli asboblar uchun); saqlagichlar va avtomatlar (ortiqcha tokda zanjirni uzadi); qoldiq tok qurilmasi (UZO), u tokning sizib chiqishida o'chadi; dielektrik qo'lqop, poyabzal va gilamchalar. Ishlashdan oldin asbobni tarmoqdan uzing, ho'l qo'l bilan rozetka va vilkaga tegmang, nosoz asbobni ishlatmang.`,
seq([`Izolyatsiya: simlar va asboblarning plastik qoplamasi`,`Yerga ulash: korpusni yer bilan tutashtirish`,`Avtomat va saqlagich: ortiqcha tokda uzadi`,`Dielektrik qo'lqop va poyabzal: xavfsiz ishlash`])],
[`Tok urganda birinchi navbatda zanjirni uzing: rubilnikni o'chiring yoki vilkani rozetkadan chiqaring. Zaryadlangan simdan jabrlanuvchini quruq yog'och, plastik kabi tok o'tkazmaydigan narsa bilan uzoqlashtiring; yalang qo'l bilan unga tegmang. Zudlik bilan tez yordamga (103) qo'ng'iroq qiling. Jabrlanuvchining nafasi va yurak urishini tekshiring; kerak bo'lsa, tez yordam kelguncha sun'iy nafas va ko'krak qafasini bosishni boshlang.`,
seq([`1. Avval tok manbaini o'chiring`,`2. Simni quruq yog'och yoki plastik bilan uzoqlashtiring`,`3. Tez yordamga (103) qo'ng'iroq qiling`,`4. Nafas va yurak urishini tekshiring, yordam bering`])]],
39:[
[`Elektr toki ishi, quvvati va issiqlik ta'siri bilan bog'liq masalalarda uchta asosiy formula ishlatiladi: A = U·I·t (tok ishi), P = A/t = U·I (quvvat) va Q = I²·R·t (ajralgan issiqlik). Rezistorda tok ishi to'liq issiqlikka aylanadi (Q = A), shuning uchun bu kattaliklar o'zaro bog'liq. Animatsiyada I o'zgarganda A va Q ustunlari bir xil bo'lib qolishi ko'rsatilgan.`,
(g,t,K)=>{const I=2+1.2*Math.sin(t*.8),R=10,U=I*R,s=30,A=U*I*s,P=U*I,Q=I*I*R*s,bar=(y,l,v,max,c)=>{g.fillStyle=c;g.fillRect(120,y,420*v/max,22);g.fillStyle=K.c;g.textAlign='right';g.font='14px sans-serif';g.fillText(l,110,y+16)};bar(25,'A (J)',A,3500,K.a);bar(65,'Q (J)',Q,3500,K.h);bar(105,'P (W)',P,120,K.m);g.textAlign='left';g.fillText('I = '+I.toFixed(1)+' A, R = 10 Ω, t = 30 s:  A = Q = '+A.toFixed(0)+' J',120,160);g.fillText(`rezistorda tok ishi to'liq issiqlikka aylanadi`,120,185)}],
[`Qaysi formulani tanlash berilganlarga bog'liq: U, I va t berilgan — A = U·I·t; I, R va t berilgan — Q = I²Rt; U, R va t berilgan — Q = U²t/R. Ketma-ket ulangan qismlarda tok bir xil bo'lgani uchun I²R qulay; parallel ulangan qismlarda kuchlanish bir xil bo'lgani uchun U²/R qulay. Hamma kattaliklarni SI birliklarida yozing: vaqt — sekundda, quvvat — vattda.`,
seq(['U, I, t berilgan:  A = U·I·t','I, R, t berilgan:  Q = I²·R·t','U, R, t berilgan:  Q = U²·t/R',`Ketma-ket: I bir xil; parallel: U bir xil`])],
[`Masala: R₁ = 4 Ω va R₂ = 12 Ω rezistorlar ketma-ket ulangan va U = 16 V manbaga 10 s ga ulangan. Har bir rezistorda qancha issiqlik ajraladi? Yechish: R = R₁ + R₂ = 16 Ω; I = U/R = 1 A (ikkalasida bir xil). Q₁ = I²R₁t = 1·4·10 = 40 J; Q₂ = I²R₂t = 1·12·10 = 120 J. Javob: 40 J va 120 J.`,
seq(['R₁ = 4 Ω,  R₂ = 12 Ω (ketma-ket),  U = 16 V,  t = 10 s','R = 4 + 12 = 16 Ω,  I = 16/16 = 1 A','Q₁ = I²R₁t = 1·4·10 = 40 J','Q₂ = I²R₂t = 1·12·10 = 120 J'])],
[`Tekshirish: umumiy issiqlik Q₁ + Q₂ = 160 J tok ishi A = U·I·t = 16·1·10 = 160 J ga teng: energiya saqlanish qonuni bajarildi. Ketma-ket ulanganda issiqlik qarshilikka proporsional: Q₂/Q₁ = R₂/R₁ = 3, bu natijaga mos. Birliklar ham to'g'ri: A²·Ω·s = J. Natija mantiqiy bo'lishi uchun qarshiligi katta rezistor ko'proq issiqlik berishi kerak edi — shunday bo'ldi.`,
seq(['Q₁ + Q₂ = 160 J','A = U·I·t = 16·1·10 = 160 J ✓','Q₂/Q₁ = R₂/R₁ = 3 ✓','Birlik: A²·Ω·s = J ✓'])]]});
Object.assign(B,{41:[
[`Elektrolitlar — suvli eritmasi yoki suyuqlanmasi tok o'tkazadigan moddalar: tuzlar, kislotalar va ishqorlar. Toza (distillangan) suv va shakar, spirt kabi ko'p organik moddalarning eritmalari tok o'tkazmaydi. Elektrolitlarda tokni erkin elektronlar emas, ionlar — zaryadli atomlar yoki atom guruhlari hosil qiladi. Shuning uchun elektrolitda tok o'tganda modda ham ko'chadi, bu metallardan farq qiladi.`,
(g,t,K)=>{const sc=Math.floor(t/3)%3,on=sc==1,N=[`distillangan suv: tok yo'q (elektrolit emas)`,`tuz eritmasi: tok bor (elektrolit)`,`shakar eritmasi: tok yo'q (elektrolit emas)`];g.strokeStyle=K.m;g.lineWidth=3;g.strokeRect(150,60,240,100);g.fillStyle=K.a;g.globalAlpha=.2;g.fillRect(151,85,238,74);g.globalAlpha=1;g.fillStyle=K.c;g.fillRect(190,40,8,90);g.fillRect(342,40,8,90);g.fillStyle=on?'#ffd43b':K.m;g.globalAlpha=on?1:.3;g.beginPath();g.arc(480,100,22,0,7);g.fill();g.globalAlpha=1;if(on){for(let i=0;i<8;i++){g.fillStyle=i%2?K.h:K.a;const x=200+((((i*19+t*(i%2?-1:1)*40)%140)+140)%140);g.beginPath();g.arc(x,100+(i*13%50),4,0,7);g.fill()}}else if(sc==2){g.fillStyle=K.c;for(let i=0;i<8;i++){g.beginPath();g.arc(215+i*17+Math.sin(t*2+i)*3,110+(i*11%40),5,0,7);g.fill()}}g.fillStyle=K.c;g.font='14px sans-serif';g.textAlign='center';g.fillText(N[sc],300,190)}],
[`Tuzlar, kislotalar va ishqorlarning molekulalari suvda erib, musbat va manfiy ionlarga ajraladi: bu elektrolitik dissotsiatsiya deyiladi. Masalan, NaCl → Na⁺ + Cl⁻. Suv molekulalari qutbli bo'lgani uchun ionlarni bir-biridan ajratib, ularni o'rab oladi. Natijada eritmada tok tashuvchi erkin ionlar paydo bo'ladi. Dissotsiatsiya tok mavjud bo'lishidan oldin ham sodir bo'ladi: tok ionlarni hosil qilmaydi, faqat ularni yo'naltiradi.`,
(g,t,K)=>{const s=Math.min(1,(t%5)/2.5);g.fillStyle=K.a;g.globalAlpha=.15;g.fillRect(60,30,480,140);g.globalAlpha=1;for(let i=0;i<5;i++)for(let j=0;j<2;j++){const x=100+i*100,y=65+j*70,d=8+s*(18+((i+j)%3)*6);g.fillStyle=K.h;g.beginPath();g.arc(x-d,y-d*.5,9,0,7);g.fill();g.fillStyle=K.a;g.beginPath();g.arc(x+d,y+d*.5,11,0,7);g.fill();g.fillStyle='#fff';g.font='bold 11px sans-serif';g.textAlign='center';g.fillText('+',x-d,y-d*.5+4);g.fillText('−',x+d,y+d*.5+4)}g.fillStyle=K.c;g.font='14px sans-serif';g.fillText(s<1?'NaCl molekulalari suvda Na⁺ va Cl⁻ ionlariga ajralmoqda':'dissotsiatsiya tugadi: eritmada erkin ionlar bor',300,192)}],
[`Elektrolitga tushirilgan elektrodlarga kuchlanish berilsa, eritmada elektr maydon hosil bo'ladi. Musbat ionlar (kationlar) manfiy elektrod — katodga, manfiy ionlar (anionlar) musbat elektrod — anodga qarab harakatlanadi. Elektrodlarga yetgan ionlar neytral atomlarga aylanadi. Kuchlanish oshsa, ionlarning tartibli harakat tezligi ortadi, ya'ni tok kuchi ortadi. Ionlar og'ir bo'lgani uchun ularning harakati elektronlarnikidan ancha sekin.`,
(g,t,K)=>{const U=.6+.4*Math.sin(t*.7);g.strokeStyle=K.m;g.lineWidth=3;g.strokeRect(120,50,360,110);g.fillStyle=K.c;g.fillRect(150,35,10,100);g.fillRect(440,35,10,100);g.font='13px sans-serif';g.textAlign='center';g.fillText('katod (−)',155,28);g.fillText('anod (+)',445,28);for(let i=0;i<8;i++){const y=65+(i*13%80),p=(i*45+t*60*U)%280;g.fillStyle=K.h;g.beginPath();g.arc(430-p,y,5,0,7);g.fill();g.fillStyle=K.a;g.beginPath();g.arc(170+p,y+6,5,0,7);g.fill()}g.fillStyle=K.c;g.font='14px sans-serif';g.fillText('kuchlanish oshsa, ionlar tezlashadi: U = '+(U*12).toFixed(1)+' V',300,190)}],
[`Elektrolitdagi tok kuchi eritmadagi ionlar soniga, ularning zaryadiga va harakat tezligiga bog'liq. Konsentratsiya oshganda erkin ionlar soni ortadi, shuning uchun eritmaning qarshiligi kamayadi, tok kuchi ortadi. Eritma qizdirilsa, ionlarning harakatchanligi ortib, qarshilik kamayadi (metallarga teskari). Elektrolitlar uchun ham Om qonuni bajariladi: I = U/R, bunda R eritmaning qarshiligi.`,
(g,t,K)=>{const n=Math.round(6+5*Math.sin(t*.6));g.strokeStyle=K.m;g.lineWidth=3;g.strokeRect(120,40,300,100);g.fillStyle=K.c;g.fillRect(150,30,8,90);g.fillRect(380,30,8,90);for(let i=0;i<n;i++){const y=55+(i*17%70),p=(i*31+t*60)%220;g.fillStyle=i%2?K.h:K.a;g.beginPath();g.arc(i%2?380-p:160+p,y,4,0,7);g.fill()}g.fillStyle=K.a;g.fillRect(450,150-n*8,24,n*8);g.fillStyle=K.c;g.font='14px sans-serif';g.textAlign='center';g.fillText('I',462,166);g.fillText('konsentratsiya ortsa ('+n+' ta ion), tok ortadi',300,190)}]],
43:[
[`Faradeyning ikkinchi qonuni: moddaning elektrokimyoviy ekvivalenti k uning kimyoviy ekvivalentiga, ya'ni molyar massaning valentlikka nisbatiga to'g'ri proporsional: k = (1/F)·(M/n). Bu yerda M — molyar massa (g/mol), n — valentlik, F — Faradey doimiysi. Molyar massasi katta, valentligi kichik moddalarning k qiymati katta bo'ladi: bir xil zaryad o'tganda ularning ko'proq massasi ajraladi.`,
(g,t,K)=>{const p=Math.min(1,(t*.5)%1.6);[['Al',27,3],['Cu',63.5,2],['Zn',65.4,2],['Ag',107.9,1]].forEach(([n,M,z],i)=>{const y=14+i*44,k=M/z/96500*1000,w=Math.max(4,300*(M/z)/108)*p;g.fillStyle=K.h;g.fillRect(100,y,w,26);g.fillStyle=K.c;g.font='14px sans-serif';g.textAlign='right';g.fillText(n,92,y+18);g.textAlign='left';g.fillText((k*p).toFixed(3)+' mg/C  (M/n = '+(M/z).toFixed(1)+')',108+w,y+18)})}],
[`Valentlik n ion qancha elementar zaryad tashishini ko'rsatadi: Ag⁺ — bitta, Cu²⁺ — ikkita, Al³⁺ — uchta elektron zaryadi. Katodga bitta atom ajralishi uchun n ta elektron kerak. Shuning uchun bir xil zaryad o'tganda valentligi katta ionlardan kamroq atom ajraladi: N = q/(n·e). Masalan, q ning bir xil qiymatida kumush atomlari mis atomlaridan 2 marta, alyuminiy atomlaridan 3 marta ko'p ajraladi.`,
(g,t,K)=>{const p=(t*.25)%1;[['Ag⁺ (n = 1)',1],['Cu²⁺ (n = 2)',2],['Al³⁺ (n = 3)',3]].forEach(([nm,z],i)=>{const y=25+i*55,N=Math.floor(12*p/z);g.fillStyle=K.c;g.font='14px sans-serif';g.textAlign='right';g.fillText(nm,150,y+14);for(let j=0;j<N;j++){g.fillStyle=K.h;g.beginPath();g.arc(170+j*30,y+8,10,0,7);g.fill()}});g.textAlign='center';g.fillStyle=K.c;g.fillText(`bir xil zaryadda valentlik katta bo'lsa, atomlar kamroq ajraladi`,300,194)}],
[`Faradey doimiysi F — bir mol bir valentli ionning zaryadi: F = N_A·e = 6,02·10²³·1,6·10⁻¹⁹ ≈ 96 500 C/mol. Demak, 96 500 C zaryad o'tganda 1 mol bir valentli moddaning (masalan, 107,9 g kumushning) elektrolizi sodir bo'ladi. F ni bilgan holda ekvivalent k ni hisoblab chiqarish mumkin, shu orqali Faradeyning ikkala qonunini bitta formulada birlashtirib yozamiz: m = M·I·t/(F·n).`,
(g,t,K)=>{const p=(t*.2)%1;g.fillStyle=K.m;g.globalAlpha=.25;g.fillRect(60,50,480,28);g.fillRect(60,110,480,28);g.globalAlpha=1;g.fillStyle=K.a;g.fillRect(60,50,480*p,28);g.fillStyle=K.h;g.fillRect(60,110,480*p,28);g.fillStyle=K.c;g.font='14px sans-serif';g.textAlign='left';g.fillText('q = '+(p*96500).toFixed(0)+' C',70,40);g.fillText('m(Ag) = '+(p*107.9).toFixed(1)+' g',70,100);g.textAlign='center';g.fillText('F = 96 500 C/mol: 1 mol Ag (107,9 g) uchun',300,170)}],
[`Misol: mis sulfat eritmasidan I = 2 A tok t = 30 min davomida o'tdi. Katodda qancha mis ajraladi? Mis uchun M = 63,5 g/mol, n = 2. k = M/(F·n) = 63,5/(96 500·2) ≈ 3,3·10⁻⁴ g/C = 0,33 mg/C. t = 30 min = 1800 s, q = I·t = 3600 C. m = k·q ≈ 0,33·3600 ≈ 1190 mg ≈ 1,2 g. Javob: taxminan 1,2 g mis.`,
seq(['M = 63,5 g/mol,  n = 2  (Cu)','k = M/(F·n) = 63,5/(96500·2) ≈ 0,33 mg/C','I = 2 A,  t = 30 min = 1800 s  →  q = 3600 C','m = k·q ≈ 0,33·3600 ≈ 1190 mg ≈ 1,2 g'])]]});
Object.assign(B,{44:[
[`Elektroliz masalalarida ikki qonun ishlatiladi. Faradeyning birinchi qonuni: elektrodda ajralgan massa o'tgan zaryadga to'g'ri proporsional, m = k·q = k·I·t. Ikkinchi qonun: k = M/(F·n). Ikkalasini birlashtirib, m = M·I·t/(F·n) ni olamiz. Demak, massa tok, vaqt va molyar massaga to'g'ri, valentlikka teskari proporsional. Masalada qaysi kattalik berilganini aniqlab, mos formulani tanlang.`,
seq(['I qonun:  m = k·q = k·I·t','II qonun:  k = M/(F·n)','Birlashtirilgan:  m = M·I·t/(F·n)','m ~ I, t, M   va   m ~ 1/n'])],
[`Birliklarga e'tibor bering. Zaryad q = I·t kulonda (A·s). k odatda mg/C yoki kg/C da beriladi. Molyar massa M — g/mol, F — C/mol. Vaqt masalada ko'pincha minut yoki soatda beriladi: uni sekundga o'tkazing (1 min = 60 s, 1 soat = 3600 s). Natija massasi mg yoki g bo'lishi mumkin: 1 g = 1000 mg. Birliklar mos kelmasa, javob 1000 yoki 60 marta xato chiqadi.`,
seq(['q = I·t:  A·s = C','k:  mg/C  (yoki kg/C)','M:  g/mol,   F:  C/mol',`t: minut → sekund (×60),  m: mg → g (÷1000)`])],
[`Masala: kumush qoplash vannasidan I = 0,5 A tok t = 40 min davomida o'tdi. Kumush uchun k = 1,118 mg/C. Katodda qancha kumush ajraladi? Yechish: t = 40·60 = 2400 s; q = I·t = 0,5·2400 = 1200 C; m = k·q = 1,118·1200 ≈ 1342 mg ≈ 1,34 g. Javob: taxminan 1,34 g kumush.`,
seq(['I = 0,5 A,  t = 40 min = 2400 s,  k = 1,118 mg/C','q = I·t = 0,5·2400 = 1200 C','m = k·q = 1,118·1200 ≈ 1342 mg','m ≈ 1,34 g kumush'])],
[`Natijani boshqa formula bilan tekshiring: m = M·q/(F·n) = 107,9·1200/(96 500·1) ≈ 1,34 g — mos keldi. Atomlar soni ham tekshiruv bo'ladi: N = (m/M)·N_A = (1,342/107,9)·6,02·10²³ ≈ 7,5·10²¹. Ularning zaryadi N·e = 7,5·10²¹·1,6·10⁻¹⁹ ≈ 1200 C — o'tgan zaryadga teng. Demak, hisob to'g'ri.`,
seq(['m = M·q/(F·n) = 107,9·1200/96500 ≈ 1,34 g ✓','N = (m/M)·N_A ≈ 7,5·10²¹ ta atom','N·e = 7,5·10²¹·1,6·10⁻¹⁹ ≈ 1200 C ✓',`mg → g to'g'ri o'tkazilgan ✓`])]],
45:[
[`Galvanostegiya — buyum sirtini elektroliz yordamida boshqa metallning yupqa qatlami bilan qoplash. Qoplanadigan buyum katod sifatida, qoplovchi metall esa anod sifatida elektrolit vannasiga tushiriladi. Tok o'tganda anod eriydi, metall ionlari katodga yetib borib, buyum ustida zich qatlam hosil qiladi. Shu tarzda nikellash, xromlash, kumushlash va tillalash amalga oshiriladi. Qoplam buyumni zanglashdan saqlaydi va chiroyli ko'rinish beradi.`,
(g,t,K)=>{const p=(t*.2)%1,lw=1+8*p;g.strokeStyle=K.m;g.lineWidth=3;g.strokeRect(100,40,400,120);g.fillStyle=K.a;g.globalAlpha=.2;g.fillRect(101,70,398,89);g.globalAlpha=1;g.fillStyle=K.c;g.fillRect(140,60,14*(1-.4*p)+6,80);g.fillStyle=K.m;g.fillRect(380,70,40,60);g.strokeStyle=K.h;g.lineWidth=lw;g.strokeRect(380-lw/2,70-lw/2,40+lw,60+lw);g.fillStyle=K.h;for(let i=0;i<6;i++){const q=(t*.5+i/6)%1;g.beginPath();g.arc(170+q*190,90+(i*9%40),4,0,7);g.fill()}g.fillStyle=K.c;g.font='13px sans-serif';g.textAlign='center';g.fillText('anod (eriydi)',150,32);g.fillText('buyum (katod)',400,32);g.font='14px sans-serif';g.fillText('qoplam qalinligi: '+(p*20).toFixed(0)+' mkm',300,190)}],
[`Galvanoplastika — rel'efli buyumlarning aniq metall nusxalarini elektroliz yordamida olish. Buyumdan mum yoki gips qolip olinadi, uning sirti grafit bilan elektr o'tkazuvchan qilinadi va katod sifatida vannaga tushiriladi. Metall qatlam qolipning har bir burmasini aniq takrorlaydi. Qalin qatlam hosil bo'lgach, qolipdan ajratiladi. Bu usulni rus fizigi B. Yakobi 1837-yilda kashf etgan; u bosmaxona klishelari, medallar va haykal nusxalarini yasashda ishlatiladi.`,
(g,t,K)=>{const p=(t*.2)%1,f=x=>110+10*Math.sin(x/14)+6*Math.sin(x/5);g.fillStyle=K.m;g.beginPath();g.moveTo(60,196);for(let x=60;x<=540;x+=4)g.lineTo(x,f(x)+30);g.lineTo(540,196);g.closePath();g.fill();const n=Math.round(p*10);g.strokeStyle=K.h;g.lineWidth=2;for(let k=1;k<=n;k++){g.beginPath();for(let x=60;x<=540;x+=4)g.lineTo(x,f(x)+30-k*3);g.stroke()}g.fillStyle=K.c;g.font='14px sans-serif';g.textAlign='center';g.fillText(`metall qatlami rel'ef shaklini aniq takrorlaydi`,300,18)}],
[`Elektroliz yordamida metallarni nopokliklardan tozalash (rafinirlash) amalga oshiriladi. Nopok mis anod qilinadi, toza mis katod vazifasini bajaradi, elektrolit — mis sulfat eritmasi. Anodning mis atomlari ionlarga aylanib eritmaga o'tadi, katodda esa toza mis ajraladi. Oltin, kumush kabi qimmatbaho qo'shimchalar eritmaga o'tmay, vannaning tubiga loy (shlam) ko'rinishida cho'kadi va alohida ajratib olinadi. Shu yo'l bilan 99,99% toza mis olinadi.`,
(g,t,K)=>{const p=(t*.15)%1;g.strokeStyle=K.m;g.lineWidth=3;g.strokeRect(100,40,400,120);g.fillStyle=K.a;g.globalAlpha=.2;g.fillRect(101,65,398,94);g.globalAlpha=1;g.fillStyle=K.m;g.fillRect(150,40,30*(1-.5*p),90);g.fillStyle=K.h;g.fillRect(420,40,14+16*p,90);g.fillStyle=K.c;for(let i=0;i<6;i++){const y=Math.min(152,130+((t*20+i*13)%26));g.beginPath();g.arc(155+i*8,y,2.5,0,7);g.fill()}g.font='13px sans-serif';g.textAlign='center';g.fillText('nopok mis (anod)',165,30);g.fillText('toza mis (katod)',430,30);g.fillText(`qo'shimchalar (Au, Ag) pastga cho'kadi`,260,178);g.font='14px sans-serif';g.fillText('toza mis qatlami qalinlashmoqda',300,196)}],
[`Alyuminiy sanoatda Al₂O₃ (boksitdan olingan alumina) ning kriolit bilan aralashmasi suyuqlanmasi elektrolizi orqali olinadi. Jarayon taxminan 950 °C da, ulkan toklarda o'tadi. Katodda (vannaning tubi) suyuq alyuminiy to'planadi, grafit anodda esa kislorod ajraladi va anodni yondirib, CO₂ hosil qiladi. 1 kg alyuminiy olishga taxminan 13–15 kVt·soat elektr energiya sarflanadi, shuning uchun alyuminiy zavodlari arzon elektr energiya yaqinida quriladi.`,
(g,t,K)=>{const p=(t*.12)%1;g.strokeStyle=K.m;g.lineWidth=4;g.strokeRect(100,50,400,110);g.fillStyle='#ff922b';g.globalAlpha=.45;g.fillRect(102,70,396,88);g.globalAlpha=1;g.fillStyle=K.c;g.fillRect(180,30,14,90);g.fillRect(406,30,14,90);g.fillStyle=K.a;g.fillRect(102,152-30*p,396,6+30*p);g.fillStyle='#ffe8cc';for(let i=0;i<8;i++){const y=118-((t*30+i*14)%60);g.beginPath();g.arc(187+(i%3)*6-6,y,3,0,7);g.fill()}g.fillStyle=K.c;g.font='13px sans-serif';g.textAlign='center';g.fillText('grafit anod',187,22);g.fillText('katod',413,22);g.font='14px sans-serif';g.fillText(`Al₂O₃ suyuqlanmasi (≈ 950 °C): pastda suyuq alyuminiy to'planadi`,300,192)}]]});
Object.assign(B,{46:[
[`Vakuum — gaz molekulalari juda siyraklashtirilgan bo'shliq. Molekulalar orasidagi masofa idish o'lchamidan katta, shuning uchun molekulalar bir-biri bilan deyarli to'qnashmaydi. Vakuumni nasos yordamida havosi so'rib olingan idishda hosil qilishadi. Vakuumda zaryadli zarralar deyarli yo'q, shuning uchun u tok o'tkazmaydi. Vakuumda tok olish uchun zaryadli zarralarning (elektronlarning) tashqi manbasi kerak.`,
(g,t,K)=>{const p=Math.min(1,(t%7)/5),n=Math.max(0,Math.round(30*(1-p)));g.strokeStyle=K.m;g.lineWidth=3;g.strokeRect(150,40,300,120);g.fillStyle=K.h;for(let i=0;i<n;i++){const x=165+((i*53+Math.sin(t*(1+i*.07)+i)*130+130)%270),y=55+((i*29+Math.cos(t*(1.1+i*.05)+i*2)*50+50)%90);g.beginPath();g.arc(x,y,3.5,0,7);g.fill()}g.fillStyle=K.c;g.font='14px sans-serif';g.textAlign='center';g.fillText('molekulalar: '+n+(n==0?' — vakuum':''),300,185)}],
[`Metallarda erkin elektronlar bor, ammo odatda ular metalldan chiqib keta olmaydi. Metall qizdirilganda esa ba'zi elektronlarning energiyasi shu qadar ortadiki, ular metall sirtidan chiqib ketadi. Qizdirilgan jismdan elektron chiqish hodisasi termoelektron emissiya deyiladi. Harorat qancha yuqori bo'lsa, chiqayotgan elektronlar soni shuncha ko'p. Shuning uchun vakuum lampalarda katod cho'g'lanma tola yordamida qizdiriladi.`,
(g,t,K)=>{const p=(t%6)/6;g.shadowColor='#ff6b00';g.shadowBlur=30*p;g.fillStyle=`rgb(${100+155*p},${90-50*p},${80-60*p})`;g.fillRect(110,60,18,80);g.shadowBlur=0;const n=Math.round(14*p*p);g.fillStyle=K.a;for(let i=0;i<n;i++){g.beginPath();g.arc(130+((i*37+t*50)%380),70+(i*17%60),4,0,7);g.fill()}g.fillStyle=K.c;g.font='14px sans-serif';g.textAlign='center';g.fillText('katod ≈ '+Math.round(300+2200*p)+' °C: chiqayotgan elektronlar soni ortadi',300,185)}],
[`Vakuum diod — ichidan havosi so'rilgan va ikkita elektrodi (qizdiriladigan katod va anod) bor idish. Anod musbat bo'lsa, katoddan chiqqan elektronlar anodga uchib boradi va zanjirda tok paydo bo'ladi. Anod manfiy bo'lsa, elektronlar anoddan itariladi va tok bo'lmaydi. Demak, diod tokni faqat bir yo'nalishda o'tkazadi: bu bir tomonlama o'tkazuvchanlik o'zgaruvchan tokni to'g'rilashda ishlatiladi.`,
(g,t,K)=>{const fw=Math.floor(t/3)%2==0;g.strokeStyle=K.m;g.lineWidth=3;g.strokeRect(100,50,400,100);g.fillStyle=K.h;g.fillRect(120,70,12,60);g.fillStyle=K.c;g.fillRect(468,70,12,60);g.font='13px sans-serif';g.textAlign='center';g.fillText(fw?'katod (−)':'katod (+)',126,40);g.fillText(fw?'anod (+)':'anod (−)',474,40);g.fillStyle=K.a;if(fw){for(let i=0;i<10;i++){g.beginPath();g.arc(135+((i*36+t*120)%330),75+(i*13%50),4,0,7);g.fill()}}else{for(let i=0;i<5;i++){g.beginPath();g.arc(135+Math.min(30,(t*30+i*10)%40),75+i*10,4,0,7);g.fill()}}g.fillStyle=K.c;g.font='14px sans-serif';g.fillText(fw?'anod musbat: tok bor':`anod manfiy: elektronlar itariladi, tok yo'q`,300,190)}],
[`Elektron-nur trubkasi (kineskop, osilloskop) — vakuum asbobi: elektron quroli ingichka elektronlar dastasini hosil qiladi, og'dirish plastinkalari yoki magnit g'altaklar uni og'diradi, ekran esa elektronlar tushganda yorishadi. Plastinkalarga berilgan kuchlanish dastani og'diradi. Elektronlar tezligi v = √(2eU/m) kuchlanishga bog'liq. Hozir ular yassi LED va LCD ekranlar bilan almashtirilgan, lekin osilloskop va rentgen trubkalarida ishlatiladi.`,
(g,t,K)=>{const y=100+60*Math.sin(t*2);g.fillStyle=K.h;g.fillRect(90,85,30,30);g.fillStyle=K.m;g.fillRect(250,60,70,6);g.fillRect(250,134,70,6);g.fillStyle=K.c;g.fillRect(490,30,12,140);g.strokeStyle=K.a;g.lineWidth=3;g.beginPath();g.moveTo(120,100);g.lineTo(250,100);g.lineTo(320,100+(y-100)*.3);g.lineTo(490,y);g.stroke();g.shadowColor='#8ecbff';g.shadowBlur=20;g.fillStyle='#e7f5ff';g.beginPath();g.arc(493,y,6,0,7);g.fill();g.shadowBlur=0;g.fillStyle=K.c;g.font='13px sans-serif';g.textAlign='center';g.fillText('elektron quroli',105,75);g.fillText(`og'dirish plastinalari`,285,50);g.fillText('ekran',496,22);g.font='14px sans-serif';g.fillText(`plastinalardagi kuchlanish nurni og'diradi`,300,192)}]],
47:[
[`Oddiy sharoitda gazlar dielektrik: ularda erkin zaryadlar deyarli yo'q, chunki molekulalar va atomlar neytral. Shuning uchun oddiy havo tok o'tkazmaydi. Lekin elektr tarmoqlari, kondensatorlar va boshqa qurilmalarda havo izolyator vazifasini bajaradi. Gazlarda tok bo'lishi uchun neytral molekulalarni ionlash, ya'ni ularning bir qismini zaryadlangan zarralarga aylantirish kerak.`,
(g,t,K)=>{g.strokeStyle=K.m;g.lineWidth=3;g.strokeRect(150,40,300,110);g.fillStyle=K.c;g.fillRect(165,50,8,90);g.fillRect(427,50,8,90);g.fillStyle=K.m;for(let i=0;i<22;i++){const x=185+((i*47+Math.sin(t*(1+i*.05)+i)*100+100)%230),y=55+((i*31+Math.cos(t*1.2+i)*40+40)%80);g.beginPath();g.arc(x,y,4,0,7);g.fill()}g.globalAlpha=.3;g.beginPath();g.arc(520,100,22,0,7);g.fill();g.globalAlpha=1;g.fillStyle=K.c;g.font='14px sans-serif';g.textAlign='center';g.fillText(`neytral molekulalar: erkin zaryad yo'q, lampa o'chiq`,300,185)}],
[`Gazning ionlanishi — neytral atom yoki molekuladan elektronni ajratib olish. Uni yuqori harorat, rentgen, ultrabinafsha va radioaktiv nurlar (ionlagichlar) amalga oshiradi. Elektr maydon ta'sirida tezlashgan elektron neytral molekulaga urilib, undan yana elektron urib chiqaradi (zarbali ionlanish). Natijada zaryadli zarralar ko'chkisimon ko'payadi: 1 → 2 → 4 → 8 ... Shu tariqa gaz o'tkazuvchan bo'ladi.`,
(g,t,K)=>{const k=Math.min(5,Math.floor((t*.8)%6)),n=1<<k;g.strokeStyle=K.m;g.lineWidth=3;g.strokeRect(100,40,400,110);for(let i=0;i<n;i++){g.fillStyle=K.a;g.beginPath();g.arc(120+(i*37)%360,55+(i*23)%80,3.5,0,7);g.fill()}for(let i=0;i<n-1;i++){g.fillStyle=K.h;g.beginPath();g.arc(125+(i*53)%350,60+(i*31)%75,4,0,7);g.fill()}g.fillStyle=K.c;g.font='14px sans-serif';g.textAlign='center';g.fillText('elektronlar: '+n+',  hosil bo\u2018lgan ionlar: '+(n-1)+'  (ko\u2018chkisimon ko\u2018payish)',300,185)}],
[`Gazdagi tok razryad deyiladi. Agar tok faqat tashqi ionlagich mavjud bo'lgandagina davom etsa, bu nomustaqil razryad: tashqi ionlagich olib tashlansa, tok to'xtaydi. Kuchlanish yetarlicha oshganda zarbali ionlanish o'zi yangi zaryadlar hosil qiladi va razryad tashqi ionlagichsiz davom etadi: bu mustaqil razryad. Kuchlanish oshganda tok avval ortadi, to'yinishga yetadi, so'ng teshilishda keskin ko'tariladi.`,
(g,t,K)=>{const f=u=>u<3?u:u<7?3+.1*(u-3):3.4+3*(u-7)**2,X=u=>60+u/10*480,Y=u=>170-Math.min(150,f(u)*10);g.strokeStyle=K.m;g.lineWidth=1;g.beginPath();g.moveTo(60,10);g.lineTo(60,170);g.lineTo(560,170);g.stroke();g.strokeStyle=K.a;g.lineWidth=3;g.beginPath();for(let u=0;u<=10;u+=.1)g.lineTo(X(u),Y(u));g.stroke();const u=(t*1.2)%10;g.fillStyle=K.h;g.beginPath();g.arc(X(u),Y(u),7,0,7);g.fill();g.fillStyle=K.c;g.font='13px sans-serif';g.textAlign='center';g.fillText('U',540,190);g.fillText('I',44,20);g.fillText(u<3?`nomustaqil razryad: tok U bilan o'sadi`:u<7?`to'yinish: tok ionlagich kuchiga bog'liq`:'mustaqil razryad: zarbali ionlanish',320,35)}],
[`Gaz razryadi turli sohalarda qo'llanadi: neon va lyuminessent lampalarda yorug'lik manbai sifatida; elektr yoyi bilan payvandlash va metallarni eritishda; gaz sanoq asboblarida (Geyger hisoblagichi) radioaktiv nurlanishni aniqlashda; ozon olishda. Tabiatdagi gaz razryadlariga chaqmoq va qutb shafaqlari kiradi. Gaz razryadi tok o'tkazishdan tashqari, atomlarning nurlanishi hisobiga yorug'lik ham beradi.`,
(g,t,K)=>{g.fillStyle=K.c;g.fillRect(70,85,14,30);g.fillRect(516,85,14,30);const a=.6+.4*Math.sin(t*20);g.shadowColor='#ff6b9d';g.shadowBlur=30*a;g.fillStyle=`rgba(255,120,170,${.35+.4*a})`;g.fillRect(84,88,432,24);g.shadowBlur=0;g.fillStyle='#fff';for(let i=0;i<10;i++){g.beginPath();g.arc(90+((i*43+t*200)%420),100+Math.sin(t*9+i)*8,2.5,0,7);g.fill()}g.fillStyle=K.c;g.font='14px sans-serif';g.textAlign='center';g.fillText('gaz razryadi nuri: neon reklama, lyuminessent lampa',300,160)}]]});
Object.assign(B,{48:[
[`Uchqunli razryad — kuchlanish katta bo'lganda ikki jism orasidagi havo qatlamining teshilishi natijasida paydo bo'ladigan qisqa muddatli yorqin razryad. U shovqin (chirsillash) bilan birga keladi. Havoda uchqunli razryad bo'lishi uchun elektr maydon kuchlanganligi taxminan 3 MV/m ga yetishi kerak. Uchqunli razryadning katta shakli — chaqmoq. Texnikada u ichki yonuv dvigatellarida aralashmani yondirish uchun (svecha) ishlatiladi.`,
(g,t,K)=>{const p=(t%3)/3,sp=p>.85;g.fillStyle=K.c;g.beginPath();g.arc(150,100,26,0,7);g.fill();g.beginPath();g.arc(450,100,26,0,7);g.fill();g.fillStyle=K.a;g.fillRect(60,170,480*p,8);if(sp){g.strokeStyle='#ffd43b';g.lineWidth=4;g.shadowColor='#ffd43b';g.shadowBlur=25;g.beginPath();g.moveTo(176,100);const sd=Math.floor(t);for(let x=176;x<424;x+=22)g.lineTo(x+22,100+Math.sin(x*3+sd*9)*14);g.stroke();g.shadowBlur=0}g.fillStyle=K.c;g.font='14px sans-serif';g.textAlign='center';g.fillText(sp?'havo teshildi: uchqun!':'kuchlanish oshmoqda: U = '+Math.round(p*30)+' kV',300,150)}],
[`Toj razryadi — o'tkazgichning uchli yoki yupqa joylari yaqinida kuchli notekis maydon bo'lganda hosil bo'ladigan sust nurlanish. Uchli joyda maydon kuchli, shuning uchun havoning faqat shu atrofdagi qismi ionlanadi va toj shaklida yorishadi. Toj razryadi yuqori kuchlanishli liniyalarda energiya yo'qotilishiga olib keladi, shuning uchun simlar yo'g'on va silliq qilinadi. Kemalar ustunlaridagi «Avliyo Elm o'tlari» ham toj razryadidir.`,
(g,t,K)=>{g.strokeStyle=K.c;g.lineWidth=4;g.beginPath();g.moveTo(300,170);g.lineTo(300,82);g.stroke();g.fillStyle=K.c;g.beginPath();g.moveTo(300,60);g.lineTo(294,82);g.lineTo(306,82);g.fill();for(let k=0;k<4;k++){const r=10+k*14+((t*20)%14);g.strokeStyle='#b197fc';g.globalAlpha=Math.max(0,.5-.1*k);g.lineWidth=3;g.beginPath();g.arc(300,66,r,0,7);g.stroke()}g.globalAlpha=1;g.fillStyle='#d0bfff';for(let i=0;i<10;i++){const a=i*.63,r=14+((t*35+i*9)%55);g.beginPath();g.arc(300+r*Math.cos(a),66+r*Math.sin(a),2.5,0,7);g.fill()}g.fillStyle=K.c;g.font='14px sans-serif';g.textAlign='center';g.fillText(`uchli joyda maydon kuchli: sust yorug' toj hosil bo'ladi`,300,192)}],
[`Yoyli razryad — katta tok (o'nlab va yuzlab amper) va nisbatan kichik kuchlanishda hosil bo'ladigan juda yorqin razryad. Uni birinchi marta V. Petrov 1802-yilda ko'mir elektrodlar orasida kuzatgan. Yoyning harorati 4000 °C va undan yuqori. Elektrodlar uchlari qiziydi va elektronlarni kuchli chiqaradi, shuning uchun razryad o'zi ushlanib turadi. Qo'llanilishi: elektr yoyli payvandlash, proyektor lampalari, yoy pechlari.`,
(g,t,K)=>{const f=.7+.3*Math.sin(t*35);g.fillStyle=K.c;g.save();g.translate(260,100);g.rotate(.15);g.fillRect(-120,-8,120,16);g.restore();g.save();g.translate(340,100);g.rotate(-.15);g.fillRect(0,-8,120,16);g.restore();g.shadowColor='#e7f5ff';g.shadowBlur=60*f;g.fillStyle='#fff';g.beginPath();g.ellipse(300,100,30,10+4*f,0,0,7);g.fill();g.shadowBlur=0;g.strokeStyle='#8ecbff';g.lineWidth=3;g.globalAlpha=.8;g.beginPath();g.moveTo(262,100);for(let x=262;x<340;x+=8)g.lineTo(x+8,100+Math.sin(x*2+t*40)*6);g.stroke();g.globalAlpha=1;g.fillStyle=K.c;g.font='14px sans-serif';g.textAlign='center';g.fillText('elektr yoyi: katta tok, juda yorqin nur, ≈ 4000 °C',300,175)}],
[`Yaltiroq razryad — bosimi kam (taxminan 0,1–10 mm sim. ust.) gazda, nisbatan kichik tokda hosil bo'ladigan razryad. Naychada katod yaqinida nur, so'ng qorong'i oraliq va anodgacha cho'zilgan musbat ustun ko'rinadi. Nurlanish rangi gaz turiga bog'liq: neon — qizil-to'q sariq, argon — ko'k-binafsha. Qo'llanilishi: neon reklamalar, lyuminessent (kunduzgi) lampalar, gaz lazerlari.`,

[`Magnit maydonning kuch xarakteristikasi — magnit induksiya B (vektor kattalik). Magnit maydonga perpendikulyar joylashtirilgan tokli o'tkazgich uchun induksiya moduli B = F/(I·l), bunda F — o'tkazgichga ta'sir etuvchi maksimal kuch, I — tok kuchi, l — o'tkazgich uzunligi. Induksiya qancha katta bo'lsa, maydon shuncha kuchli ta'sir qiladi va magnit chiziqlari shuncha zich joylashadi. Animatsiyada B oshganda bir xil tokka ta'sir etuvchi kuch ham ortishi ko'rsatilgan.`,

[`Magnit induksiyaning SI dagi birligi — tesla (T): 1 T = 1 N/(A·m), ya'ni 1 m uzunlikdagi, 1 A tokli o'tkazgichga maydon 1 N kuch bilan ta'sir qilsa, induksiya 1 T. Birlik serbiyalik-amerikalik olim N. Tesla nomi bilan atalgan. 1 T juda katta qiymat: Yer magnit maydoni ≈ 50 µT, muzlatkich magniti ≈ 5 mT, tibbiyotdagi MRT apparatlari 1,5–3 T. Kichik qiymatlar millitesla (10⁻³ T) va mikrotesla (10⁻⁶ T) da o'lchanadi.`,

[`Magnit oqim Φ — biror yuzani kesib o'tuvchi magnit induksiya chiziqlarining miqdorini ko'rsatadi: Φ = B·S·cosα, bunda S — yuza, α — induksiya vektori va yuzaga normal orasidagi burchak. Birligi — veber (Vb): 1 Vb = 1 T·m². Ramka maydonga perpendikulyar (α = 0°) bo'lganda oqim eng katta, parallel (α = 90°) bo'lganda nolga teng. Masalan, B = 0,5 T, S = 0,02 m² da Φ_maks = 0,01 Vb.`,

[`Magnit induksiya vektorining yo'nalishi sifatida shu nuqtaga qo'yilgan magnit strelkaning shimoliy qutbi ko'rsatgan yo'nalish qabul qilingan. Magnit tashqarisida chiziqlar shimoliy qutbdan chiqib, janubiy qutbga kiradi; har bir nuqtada B vektori chiziqqa urinma bo'ylab yo'nalgan. Tokning magnit maydonida yo'nalish parma qoidasi bilan topiladi. Maydonning ixtiyoriy nuqtasida B vektorini kompas yordamida tajribada aniqlash mumkin.`,
(g,t,K)=>{g.fillStyle='#e03131';g.fillRect(250,90,50,20);g.fillStyle='#1c7ed6';g.fillRect(300,90,50,20);const A=(x,y,dx,dy,c)=>{const L=Math.hypot(dx,dy),ux=dx/L,uy=dy/L;g.strokeStyle=c;g.lineWidth=2;g.beginPath();g.moveTo(x-ux*9,y-uy*9);g.lineTo(x+ux*9,y+uy*9);g.stroke();g.beginPath();g.moveTo(x+ux*9,y+uy*9);g.lineTo(x+ux*3-uy*4,y+uy*3+ux*4);g.lineTo(x+ux*3+uy*4,y+uy*3-ux*4);g.fillStyle=c;g.fill()};for(let gx=80;gx<=520;gx+=60)for(let gy=30;gy<=170;gy+=35){const x=gx-300,sy=gy-100,r2=x*x+sy*sy;if(r2<3600)continue;const pulse=Math.abs(Math.sin(t*2+gx*.02))>.8;A(gx,gy,r2-3*x*x,-3*x*sy,pulse?K.h:K.a)}g.fillStyle=K.c;g.font='14px sans-serif';g.textAlign='center';g.fillText(`B vektori: N dan chiqib S ga qaytadi, chiziqqa urinma bo'ylab`,300,196)}]]});
Object.assign(B,{51:[
[`Yer ulkan magnitga o'xshaydi: uning atrofida magnit maydon bor. Magnit maydonning asosiy manbai — Yerning suyuq tashqi yadrosidagi tok oqimlari. Maydon taxminan magnit dipol maydonidek: chiziqlar Yerdan geografik janubiy yarim sharda chiqib, shimoliy yarim sharda kiradi. Magnit maydon induksiyasi qutblarda ≈ 60 µT, ekvatorda ≈ 30 µT. Yer magnit maydoni uni tashqi fazodagi zaryadli zarralardan himoya qiladi.`,
(g,t,K)=>{g.fillStyle=K.a;g.globalAlpha=.35;g.beginPath();g.arc(300,100,38,0,7);g.fill();g.globalAlpha=1;g.strokeStyle=K.m;g.lineWidth=1;for(let k=1;k<4;k++){const rx=40+k*34,ry=50+k*14,s=((t*.3+k*.2)%1)*Math.PI;g.beginPath();g.ellipse(300,100,rx,ry,0,0,7);g.stroke();[-1,1].forEach(sg=>{g.fillStyle=K.h;g.beginPath();g.arc(300+sg*rx*Math.sin(s),100+ry*Math.cos(s),4,0,7);g.fill()})}g.fillStyle=K.c;g.font='bold 14px sans-serif';g.textAlign='center';g.fillText('shimol',300,16);g.fillText('janub',300,186);g.font='13px sans-serif';g.fillText(`maydon chiziqlari janubdan shimolga yo'nalgan`,300,199)}],
[`Yerning magnit qutblari geografik qutblar bilan mos kelmaydi: magnit o'q aylanish o'qiga nisbatan taxminan 11° ga og'gan. Geografik shimol yaqinidagi qutb fizik jihatdan magnit janub (S) qutbi hisoblanadi, shuning uchun kompasning shimoliy (N) uchi unga tortiladi. Magnit qutblar joyida turmaydi: yadro oqimlari o'zgarishi tufayli ular yiliga o'nlab kilometr siljiydi. Magnit va geografik meridian orasidagi burchak magnit og'ish deyiladi.`,
(g,t,K)=>{const d=.19+.04*Math.sin(t*.5);g.strokeStyle=K.m;g.lineWidth=2;g.beginPath();g.arc(300,100,70,0,7);g.stroke();g.setLineDash([5,5]);g.beginPath();g.moveTo(300,15);g.lineTo(300,185);g.stroke();g.setLineDash([]);g.strokeStyle=K.h;g.lineWidth=4;g.beginPath();g.moveTo(300-90*Math.sin(d),100+90*Math.cos(d));g.lineTo(300+90*Math.sin(d),100-90*Math.cos(d));g.stroke();g.fillStyle=K.a;g.beginPath();g.arc(300,30,5,0,7);g.fill();g.fillStyle=K.h;g.beginPath();g.arc(300+70*Math.sin(d),100-70*Math.cos(d),6,0,7);g.fill();g.fillStyle=K.c;g.font='13px sans-serif';g.textAlign='left';g.fillText('geografik qutb',150,22);g.fillText('magnit qutb (≈ 11° farq)',400,45);g.textAlign='center';g.font='14px sans-serif';g.fillText('magnit qutblar geografik qutblarga mos kelmaydi va siljib turadi',300,198)}],
[`Kompas — erkin aylana oladigan magnit strelkali asbob. Strelka Yer magnit maydonining chiziqlari bo'ylab joylashadi va uning shimoliy uchi taxminan geografik shimolni ko'rsatadi. Dastlab XI asrda Xitoyda ixtiro qilingan. Kompas bilan yo'nalishni aniqlash uchun limb (shkala)ni shimolga moslang. Temir buyumlar, magnitlar va tok o'tayotgan simlar strelkani og'dirishi mumkin, shuning uchun ulardan uzoqroq turing.`,
(g,t,K)=>{const a=t*.6;g.strokeStyle=K.m;g.lineWidth=3;g.beginPath();g.arc(300,100,75,0,7);g.stroke();g.fillStyle=K.c;g.font='bold 15px sans-serif';g.textAlign='center';[['Sh',0],['Sq',1.57],['J',3.14],['G',4.71]].forEach(([l,o])=>{g.fillText(l,300+60*Math.sin(o+a),105-60*Math.cos(o+a))});const d=.19;g.lineWidth=6;g.strokeStyle='#e03131';g.beginPath();g.moveTo(300,100);g.lineTo(300+45*Math.sin(d),100-45*Math.cos(d));g.stroke();g.strokeStyle='#1c7ed6';g.beginPath();g.moveTo(300,100);g.lineTo(300-45*Math.sin(d),100+45*Math.cos(d));g.stroke();g.font='14px sans-serif';g.fillText(`strelka magnit meridian bo'ylab turadi, limb esa aylanadi`,300,198)}],
[`Quyoshdan doimiy zaryadli zarralar oqimi — quyosh shamoli esiladi. Yerning magnit maydoni uni chetga buradi va magnitosferani hosil qiladi. Quyoshda kuchli portlashlar bo'lganda zarralar oqimi keskin ortadi va magnit bo'ronlari yuz beradi: kompas strelkasi og'adi, radioaloqa va sun'iy yo'ldoshlar ishiga halaqit beradi. Qutb mintaqalarida zarralar atmosfera bilan to'qnashib, qutb shafaqlarini hosil qiladi.`,
(g,t,K)=>{const cx=400,cy=100,R=80;g.strokeStyle=K.m;g.lineWidth=1;g.setLineDash([4,4]);g.beginPath();g.arc(cx,cy,R,0,7);g.stroke();g.setLineDash([]);g.fillStyle=K.a;g.beginPath();g.arc(cx,cy,22,0,7);g.fill();const a=.5+.5*Math.sin(t*4);g.strokeStyle='#69db7c';g.globalAlpha=a;g.lineWidth=4;g.beginPath();g.arc(cx,cy,28,-1.9,-1.2);g.stroke();g.beginPath();g.arc(cx,cy,28,1.2,1.9);g.stroke();g.globalAlpha=1;g.fillStyle=K.h;for(let i=0;i<14;i++){const y0=20+(i*13)%160,x=40+((i*61+t*90)%420),dx=x-cx;let y=y0;if(Math.abs(dx)<R&&Math.abs(y0-cy)<R){const s=Math.sign(y0-cy)||1;y=cy+s*Math.max(Math.abs(y0-cy),Math.sqrt(R*R-dx*dx))}if(x<cx+R*.95||Math.abs(y0-cy)>=R){g.beginPath();g.arc(x,y,3,0,7);g.fill()}}g.fillStyle=K.c;g.font='14px sans-serif';g.textAlign='center';g.fillText('Quyosh shamoli zarralari',110,20);g.fillText(`maydon zarralarni chetga buradi, qutblarda shafaq hosil bo'ladi`,300,198)}]],
54:[
[`Amper kuchi va Lorens kuchi bir-biri bilan bog'liq: Amper kuchi — tokli o'tkazgichdagi barcha harakatlanuvchi zaryadlarga ta'sir qiluvchi Lorens kuchlarining yig'indisi. Bitta zaryadga F = q·v·B·sinα, o'tkazgichga F = B·I·l·sinα ta'sir qiladi. Ikkala holda ham kuch tezlik (tok)ga va B ga perpendikulyar. Masalalarda zaryad sim ichida harakatlansa — Amper, erkin zarra bo'lsa — Lorens kuchidan foydalaning.`,

[`Kuch yo'nalishi chap qo'l qoidasi bilan aniqlanadi: chap qo'lni shunday joylashtiringki, B chiziqlari kaftga kirsin, to'rt barmoq tok (musbat zaryad harakati) yo'nalishini ko'rsatsin; bosh barmoq kuch yo'nalishini ko'rsatadi. Manfiy zaryad (masalan, elektron) uchun to'rt barmoq tezlikka teskari yo'naltiriladi yoki natija teskariga o'zgartiriladi. I yoki B yo'nalishi o'zgarsa, kuch ham o'zgaradi.`,
seq([`Chap qo'l: B chiziqlari kaftga kiradi`,`4 barmoq: tok (musbat zaryad harakati) yo'nalishi`,`Bosh barmoq: kuch yo'nalishi`,`Manfiy zaryad yoki I (B) teskari: kuch teskari`])],
[`Masala: B = 0,6 T bir jinsli maydonda maydonga perpendikulyar joylashgan l = 0,4 m uzunlikdagi simdan I = 5 A tok o'tmoqda. Amper kuchi: F = B·I·l = 0,6·5·0,4 = 1,2 N. Ikkinchi masala: elektron v = 2·10⁶ m/s tezlik bilan B = 0,01 T maydonga perpendikulyar uchmoqda. Lorens kuchi: F = e·v·B = 1,6·10⁻¹⁹·2·10⁶·0,01 = 3,2·10⁻¹⁵ N.`,

[`Tekshirish. Elektron aylana bo'ylab harakatlanadi, radiusi r = mv/(eB) = 9,1·10⁻³¹·2·10⁶/(1,6·10⁻¹⁹·0,01) ≈ 1,14 mm. Markazga intilma kuch F = mv²/r = 9,1·10⁻³¹·4·10¹²/1,14·10⁻³ ≈ 3,2·10⁻¹⁵ N Lorens kuchiga teng. Birlik: T·A·m = N. Elektronning og'irligi (≈ 9·10⁻³⁰ N) Lorens kuchidan ancha kichik, shuning uchun uni hisobga olmaymiz.`,

Object.assign(B,{58:[
[`Laboratoriya ishining maqsadi — eng oddiy elektromagnitni yig'ib, uning ishlashini o'rganish. Kerakli asboblar: temir mix (o'zak), izolyatsiyalangan mis sim, tok manbai (batareya), kalit, ulovchi simlar va mayda temir buyumlar (skrepkalar). Ishni boshlashdan oldin asboblarni tekshirib oling: sim izolyatsiyasi butun bo'lishi kerak. Zanjirni ulashda o'qituvchi ruxsatini kuting.`,

[`Mixga izolyatsiyalangan simni zich qilib, bir yo'nalishda 20–30 o'ram o'rang; sim uchlarini izolyatsiyadan tozalang. Uchlarini kalit orqali batareyaga ulang: manba, kalit va g'altak ketma-ket zanjir hosil qiladi. Kalit ochiq holatda yig'ilgan zanjirni o'qituvchiga ko'rsating. Sim uchlarining izolyatsiyasini to'liq olib tashlamasangiz, kontakt yomon bo'ladi va tok oqmaydi.`,

[`Kalitni yoping: g'altak magnitga aylanadi va mixga skrepkalarni tortadi. Kalitni oching: skrepkalar tushib ketadi, chunki yumshoq temir magnitligini yo'qotadi. Keyin tajribani takrorlang: o'ramlar sonini oshiring; ikkinchi batareyani ulab tokni oshiring; mixni olib tashlang (o'zaksiz). Har gal nechta skrepka tortilganini yozib oling. Kalitni uzoq vaqt yopiq ushlamang: sim va batareya qiziydi.`,

[`Natijalar jadvali bo'yicha xulosa qilamiz: o'ramlar soni oshganda ham, tok oshganda ham elektromagnit ko'proq skrepka tortadi (B ~ N·I); temir o'zak magnit maydonni bir necha o'n marta kuchaytiradi (o'zaksiz g'altak deyarli tortmaydi); tok o'chirilganda magnitlik yo'qoladi. Elektromagnit afzalligi: uni ulash-uzish va kuchini tok orqali boshqarish mumkin.`,

59:[
[`O'zgarmas tok elektr dvigateli elektr energiyani mexanik energiyaga aylantiradi. Uning asosiy qismlari: qo'zg'almas qism — stator (doimiy magnit yoki elektromagnit, magnit maydon hosil qiladi); aylanuvchi qism — rotor (g'altak yoki ramka, yakor); kollektor (ikki yarim halqa) va unga tegib turuvchi grafit cho'tkalar. Cho'tkalar tok manbaiga ulangan. Rotor o'qqa o'rnatilgan va erkin aylana oladi.`,
(g,t,K)=>{const k=Math.min(4,Math.floor((t*.7)%5));g.fillStyle='#e03131';g.fillRect(70,60,50,80);g.fillStyle='#1c7ed6';g.fillRect(480,60,50,80);g.strokeStyle=K.h;g.lineWidth=5;g.strokeRect(210,60,180,80);g.strokeStyle=K.a;g.lineWidth=7;g.beginPath();g.arc(300,160,12,.3,2.8);g.stroke();g.strokeStyle=K.c;g.beginPath();g.arc(300,160,12,3.5,6);g.stroke();g.fillStyle=K.m;g.fillRect(262,158,12,6);g.fillRect(326,158,12,6);const L=[['magnit (stator)',95,50],['rotor (ramka)',300,52],['kollektor',300,192],[`cho'tkalar`,196,166]];g.font='13px sans-serif';g.textAlign='center';g.fillStyle=K.c;L.forEach(([n,x,y],i)=>{g.globalAlpha=i<k?1:.1;g.fillText(n,x,y)});g.globalAlpha=1}],
[`Dvigatel ishlashi Amper kuchiga asoslangan: magnit maydondagi tokli ramkaning qarama-qarshi tomonlariga yo'nalishi qarama-qarshi kuchlar ta'sir qiladi va ramka buriladi. Aylantiruvchi moment M = N·B·I·S·sinα. Ramka muvozanat vaziyatidan (maydonga perpendikulyar) o'tganda moment nolga teng bo'ladi, inersiya ta'sirida ramka bu vaziyatdan o'tib ketadi va aylanishda davom etadi. Dvigatel aylanish tezligi kuchlanishga bog'liq.`,
(g,t,K)=>{const th=t*1.4;fr(g,K,th,45*Math.abs(Math.cos(th))+3,'Amper kuchlari juft kuch hosil qilib, ramkani aylantiradi')}],
[`Kollektor har yarim aylanishda ramkadagi tokning yo'nalishini teskariga o'zgartiradi. Cho'tkalar joyida turadi, yarim halqalar esa ramka bilan birga aylanadi: har yarim aylanishdan so'ng cho'tka boshqa yarim halqaga o'tadi va ramkaga tok boshqa uchidan kiradi. Natijada aylantiruvchi moment har doim bir yo'nalishda ta'sir qiladi va ramka tinimsiz bir tomonga aylanadi. Kollektorsiz ramka muvozanat vaziyatida tebranib to'xtab qolar edi.`,
(g,t,K)=>{const a=t*2,TP=2*Math.PI;g.lineWidth=14;g.strokeStyle=K.a;g.beginPath();g.arc(300,100,40,a+.08,a+Math.PI-.08);g.stroke();g.strokeStyle=K.h;g.beginPath();g.arc(300,100,40,a+Math.PI+.08,a+TP-.08);g.stroke();g.fillStyle=K.c;g.fillRect(238,95,16,10);g.fillRect(346,95,16,10);const seg=Math.floor((((Math.PI-a)%TP)+TP)%TP/Math.PI);g.font='14px sans-serif';g.textAlign='center';g.fillText(seg?'ramkadagi tok: soat strelkasi bo\u2018ylab':'ramkadagi tok: soat strelkasiga teskari',300,40);g.fillText(`cho'tkalar joyida, yarim halqalar aylanadi: har yarim aylanishda tok almashadi`,300,190)}],
[`O'zgarmas tok dvigatellari o'yinchoqlarda, ventilyatorlarda, elektr pichoq va drelda, avtomobil starterlarida, oynakso'rgichlarda, elektr transportda (tramvay, metro) ishlatiladi. Afzalligi: aylanish tezligini kuchlanish orqali silliq rostlash mumkin. Kamchiligi: kollektor va cho'tkalar yeyiladi, uchqun hosil qiladi. FIK katta: 80–95%. Dvigatelning teskari ishlashi generator hosil qiladi.`,
(g,t,K)=>{const ang=3*t-4*Math.cos(.5*t)+4;g.fillStyle=K.m;g.fillRect(295,100,10,70);g.fillRect(270,168,60,10);for(let i=0;i<3;i++){g.save();g.translate(300,100);g.rotate(ang+i*2.094);g.fillStyle=K.a;g.beginPath();g.ellipse(0,-35,14,35,0,0,7);g.fill();g.restore()}g.fillStyle=K.h;g.beginPath();g.arc(300,100,9,0,7);g.fill();g.fillStyle=K.c;g.font='14px sans-serif';g.textAlign='center';g.fillText(`tok oshsa, dvigatel tezroq aylanadi: ventilyator, drel, o'yinchoq`,300,198)}]]});
Object.assign(B,{4:[
[`Kulon qonuniga oid masalani yechishda avval hamma kattaliklarni SI birliklariga o'tkazing: mikrokulon (µC) → kulon (× 10⁻⁶), nanokulon (nC) → kulon (× 10⁻⁹), santimetr → metr (÷ 100). Masalan, q₁ = 5 µC = 5·10⁻⁶ C, q₂ = 3 µC = 3·10⁻⁶ C, r = 15 sm = 0,15 m. Koeffitsient k = 9·10⁹ N·m²/C². Birliklarni o'tkazmasdan hisoblash eng keng tarqalgan xato.`,
seq(['q₁ = 5 µC = 5·10⁻⁶ C','q₂ = 3 µC = 3·10⁻⁶ C','r = 15 sm = 0,15 m','k = 9·10⁹ N·m²/C²'])],
[`Qaysi formulani tanlash topiladigan kattalikka bog'liq. Kuch kerak bo'lsa: F = k·|q₁·q₂|/r². Maydon kuchlanganligi kerak bo'lsa: E = F/q yoki nuqtaviy zaryad uchun E = k·|q|/r². Masofa kerak bo'lsa: r = √(k·|q₁q₂|/F). Zaryad kerak bo'lsa: |q₁| = F·r²/(k·|q₂|). Formulani oldin harf ko'rinishida yozing, so'ng son qiymatlarni qo'ying.`,
seq(['Kuch kerak:  F = k·|q₁q₂|/r²','Maydon kerak:  E = F/q = kq/r²','Masofa kerak:  r = √(k·q₁q₂/F)','Zaryad kerak:  q₁ = F·r²/(k·q₂)'])],
[`Masala: q₁ = 5 µC va q₂ = 3 µC nuqtaviy zaryadlar r = 15 sm masofada joylashgan. O'zaro ta'sir kuchini toping. Yechish: F = k·q₁q₂/r² = 9·10⁹·5·10⁻⁶·3·10⁻⁶/0,15² = 0,135/0,0225 = 6 N. Zaryadlar bir xil ishorali bo'lgani uchun ular itarishadi. Javob: F = 6 N.`,
seq(['F = k·q₁q₂/r²','F = 9·10⁹·5·10⁻⁶·3·10⁻⁶ / 0,15²','F = 0,135 / 0,0225','F = 6 N  (itarishadi)'])],
[`Natijani tekshirish. Birlik: N·m²/C² · C²/m² = N, to'g'ri. Masofa 2 marta oshsa, kuch 4 marta kamayib 1,5 N bo'lishi kerak: proporsionallik tekshirildi. Kuch yo'nalishi ham mantiqiy: bir xil ishorali zaryadlar itarishadi. Natija «juda katta yoki juda kichik» emasligini baholang: bu zaryadlar va masofa uchun bir necha nyuton real qiymat.`,
seq(['Birlik: N·m²/C² · C²/m² = N ✓','r = 30 sm bo\u2018lsa:  F = 6/4 = 1,5 N ✓','Bir xil ishorali zaryadlar: itarishadi ✓','Bir necha nyuton: mantiqiy qiymat ✓'])]],
7:[
[`Ko'p masalalarda elektr maydon bir necha zaryad tomonidan hosil qilinadi va maydon kuchlanganligini superpozitsiya prinsipi bilan topish kerak. Masalan, ikkita bir xil ishorali zaryad orasidagi o'qda ularning maydonlari qarama-qarshi yo'nalgan va ayriladi; kichik zaryadga yaqin joyda natijaviy maydon nolga teng bo'lgan nuqta bo'ladi. Animatsiyada nuqta ikki zaryad orasida siljiganda natijaviy E o'zgarishi ko'rsatilgan.`,
(g,t,K)=>{const d=.3,x=.05+.2*(.5+.5*Math.sin(t*.6)),r2=d-x,E1=9e9*4e-6/(x*x),E2=9e9*1e-6/(r2*r2),E=E1-E2,X=m=>80+m/d*440;g.fillStyle=K.h;g.beginPath();g.arc(X(0),110,16,0,7);g.fill();g.beginPath();g.arc(X(d),110,10,0,7);g.fill();g.fillStyle=K.c;g.font='13px sans-serif';g.textAlign='center';g.fillText('4 µC',X(0),145);g.fillText('1 µC',X(d),140);g.fillStyle=K.a;g.beginPath();g.arc(X(x),110,6,0,7);g.fill();const L=Math.min(110,Math.abs(E)/8e4*10);ar(g,X(x),80,E>0?1:-1,Math.max(4,L),K.c);g.strokeStyle=K.m;g.lineWidth=1;g.setLineDash([3,3]);g.beginPath();g.moveTo(X(.2),60);g.lineTo(X(.2),170);g.stroke();g.setLineDash([]);g.font='14px sans-serif';g.fillText('E = E₁ − E₂ = '+(E/1e3).toFixed(0)+' kN/C',300,30);g.fillText('E = 0 nuqta: r₁ = 20 sm',X(.2),188)}],
[`Yechish tartibi: 1) chizma chizing: zaryadlar, maydon nuqtasi va E vektorlarni; 2) hamma kattaliklarni SI ga o'tkazing; 3) har bir zaryad maydonini E = k|q|/r² bilan hisoblang va yo'nalishini aniqlang (musbat zaryaddan tashqariga, manfiyga qarab); 4) vektorlarni qo'shing: bir to'g'ri chiziqda bo'lsa — qo'shish yoki ayirish, burchak bilan bo'lsa — parallelogramm qoidasi.`,
seq([`1) Chizma: zaryadlar va E vektorlar`,`2) SI ga o'tkazish`,`3) E₁ = kq₁/r₁²,  E₂ = kq₂/r₂²`,`4) Vektor yig'indi: E = E₁ + E₂`])],
[`Masala: q₁ = 4 µC va q₂ = 1 µC zaryadlar d = 30 sm masofada joylashgan. a) Ular o'rtasidagi nuqtada E nimaga teng? b) Maydon nolga teng nuqta qayerda? Yechish: a) r = 0,15 m: E₁ = 9·10⁹·4·10⁻⁶/0,15² = 1,6·10⁶ N/C, E₂ = 0,4·10⁶ N/C; E = E₁ − E₂ = 1,2·10⁶ N/C (q₂ tomonga). b) E₁ = E₂ da r₁/r₂ = √(q₁/q₂) = 2, r₁ + r₂ = 30 sm, demak r₁ = 20 sm.`,
seq(['q₁ = 4 µC,  q₂ = 1 µC,  d = 30 sm','O\u2018rtada: E₁ = 1,6·10⁶,  E₂ = 0,4·10⁶ N/C','E = E₁ − E₂ = 1,2·10⁶ N/C  (q₂ tomonga)','E = 0:  r₁/r₂ = √(q₁/q₂) = 2  →  r₁ = 20 sm'])],
[`Tekshirish: nol nuqtada ikkala maydon bir xil bo'lishi kerak: k·q₁/r₁² = 9·10⁹·4·10⁻⁶/0,2² = 9·10⁵ N/C va k·q₂/r₂² = 9·10⁹·10⁻⁶/0,1² = 9·10⁵ N/C: mos keldi. Nol nuqta kichik zaryadga yaqin va zaryadlar orasida bo'lishi kerak edi — shunday. Birlik: N/C = V/m.`,
seq(['kq₁/r₁² = 9·10⁵ N/C','kq₂/r₂² = 9·10⁵ N/C ✓',`Nol nuqta kichik zaryadga yaqin ✓`,'Birlik: N/C = V/m ✓'])]]});
Object.assign(B,{13:[
[`Tok kuchi, kuchlanish va qarshilik bilan bog'liq masalalarda asosiy formulalar: I = q/t (tok kuchi), U = A/q (kuchlanish) va Om qonuni I = U/R. Ularni qulay eslab qolish uchun «uchburchak qoidasi»dan foydalaning: uchburchakning yuqorisiga U, pastiga I va R yozilgan; topiladigan kattalikni yopsangiz, qolgani formulani ko'rsatadi. U yopilsa U = I·R, I yopilsa I = U/R, R yopilsa R = U/I.`,
(g,t,K)=>{const k=Math.floor(t/2.5)%3,P=[[300,40,'U'],[240,130,'I'],[360,130,'R']];g.strokeStyle=K.m;g.lineWidth=3;g.beginPath();g.moveTo(300,20);g.lineTo(190,170);g.lineTo(410,170);g.closePath();g.stroke();g.beginPath();g.moveTo(240,100);g.lineTo(360,100);g.moveTo(300,100);g.lineTo(300,170);g.stroke();g.font='bold 26px Georgia,serif';g.textAlign='center';P.forEach(([x,y,l],i)=>{g.fillStyle=i==k?K.h:K.c;g.globalAlpha=i==k?.25:1;g.fillText(l,x,y+14);g.globalAlpha=1});g.fillStyle=K.c;g.font='bold 18px Georgia,serif';g.fillText(['U topiladi:','I topiladi:','R topiladi:'][k],510,85);g.fillText(['U = I · R','I = U / R','R = U / I'][k],510,115)}],
[`Birliklarni bilish masalada xatoni oldini oladi: 1 A = 1 C/s, 1 V = 1 J/C, 1 Ω = 1 V/A. Ko'p ishlatiladigan qo'shimchalar: milli (10⁻³), mikro (10⁻⁶), kilo (10³), mega (10⁶). Masalan, 250 mA = 0,25 A, 2 kΩ = 2000 Ω, 0,5 kV = 500 V. Vaqtni sekundga o'tkazing: 1 min = 60 s, 1 soat = 3600 s. Hisoblashdan oldin hamma kattaliklarni SI ga keltiring.`,
seq(['1 A = 1 C/s','1 V = 1 J/C','1 Ω = 1 V/A','mA = 10⁻³ A,  kV = 10³ V,  kΩ = 10³ Ω'])],
[`Masala: R = 4 Ω rezistorga U = 12 V kuchlanish berildi. Tok kuchi qancha va t = 30 s da kesimdan qancha zaryad o'tadi? Yechish: I = U/R = 12/4 = 3 A. q = I·t = 3·30 = 90 C. Javob: I = 3 A, q = 90 C. Tartib: berilganlarni yozing, nimani topish kerakligini aniqlang, formulani harfda yozing, so'ng son qo'ying.`,
seq(['Berilgan: U = 12 V,  R = 4 Ω,  t = 30 s','Topish: I,  q','I = U/R = 12/4 = 3 A','q = I·t = 3·30 = 90 C'])],
[`Tekshirish: birlik V/Ω = A to'g'ri. Teskari hisob: U = I·R = 3·4 = 12 V — dastlabki qiymat tiklandi. Tok ishi ikki usulda mos kelishi kerak: A = q·U = 90·12 = 1080 J va A = U·I·t = 12·3·30 = 1080 J. Mantiqiy baho: qarshilik kichik bo'lsa tok katta bo'ladi — 4 Ω da 3 A real qiymat.`,
seq(['Birlik: V/Ω = A ✓','U = I·R = 3·4 = 12 V ✓','A = q·U = 90·12 = 1080 J = U·I·t ✓','Kichik R: katta tok ✓'])]],
18:[
[`Masalani yechishdan oldin berilganlarni yozing va SI ga o'tkazing. Misol: tok kuchi I = 250 mA = 0,25 A (milli = 10⁻³), qarshilik R = 2 kΩ = 2000 Ω (kilo = 10³), vaqt t = 2 min = 120 s. Topish kerak: kuchlanish U va o'tgan zaryad q. Berilganlarni qisqa yozish va nima topilishini belgilash mantiqiy yechimning birinchi qadami.`,
seq(['I = 250 mA = 0,25 A','R = 2 kΩ = 2000 Ω','t = 2 min = 120 s','Topish: U = ?,  q = ?'])],
[`Om qonunidan kerakli kattalikni ifodalaymiz: I = U/R dan U = I·R va R = U/I. Qaysi ko'rinish kerakligi masaladagi noma'lumga bog'liq. Masalada tok va qarshilik berilgan, kuchlanish noma'lum, shuning uchun U = I·R ni tanlaymiz. Animatsiyada tok o'zgarganda kuchlanish shu formula bo'yicha o'zgarishi ko'rsatilgan: qarshilik doimiy bo'lsa U ~ I.`,
(g,t,K)=>{const I=.25+.15*Math.sin(t*.8);lp(g,t,K,I*8,[[300,'R = 2000 Ω']],'I = '+I.toFixed(2)+' A  →  U = I·R = '+(I*2000).toFixed(0)+' V')}],
[`Hisoblash: U = I·R = 0,25·2000 = 500 V. Zaryad: q = I·t = 0,25·120 = 30 C. Javob: U = 500 V, q = 30 C. Hisoblashda birliklarni ham yozib boring: A·Ω = V, A·s = C. Birliklar masala oxirida kutilgan natija birligiga kelmasa, xato bor degani.`,
seq(['U = I·R','U = 0,25 A · 2000 Ω = 500 V','q = I·t = 0,25·120 = 30 C','Javob: U = 500 V,  q = 30 C'])],
[`Tekshirish: teskari hisob I = U/R = 500/2000 = 0,25 A dastlabki qiymatni tikladi. Birlik: A·Ω = V. Ishni ikki usulda hisoblash: A = q·U = 30·500 = 15 000 J va A = U·I·t = 500·0,25·120 = 15 000 J. Natija mantiqiy: 2 kΩ qarshilikdan 0,25 A tok o'tishi uchun yuqori kuchlanish kerak.`,

Object.assign(B,{14:[
