31:[
["Elektr tokining quvvati — tok bajargan ishning shu ish bajarilgan vaqtga nisbati: P = A/t. U tok vaqt birligida qancha energiya berayotganini ko'rsatadi. Quvvat katta bo'lgan asbob bir xil vaqtda ko'proq energiya sarflaydi: 100 W lampochka 40 W lampochkadan yorqinroq yonadi va ko'proq energiya iste'mol qiladi. Quvvat asbobning pasportida yozilgan bo'ladi.",
(g,t,K)=>{[[170,40],[430,100]].forEach(([x,P])=>{const a=P/100*(.75+.25*Math.sin(t*4));g.shadowColor='#ffd43b';g.shadowBlur=45*a;g.fillStyle=`rgba(255,212,59,${.25+.75*a})`;g.beginPath();g.arc(x,85,34,0,7);g.fill();g.shadowBlur=0;g.fillStyle=K.c;g.font='15px sans-serif';g.textAlign='center';g.fillText(P+' W',x,150);g.fillText('1 s da '+P+' J',x,175)})}],
["A = U·I·t bo'lgani uchun quvvat P = U·I. Om qonunidan foydalanib uni boshqa ko'rinishlarda yozish mumkin: P = I²R va P = U²/R. Qaysi formulani tanlash noma'lum kattalikka bog'liq: tok va qarshilik ma'lum bo'lsa I²R, kuchlanish va qarshilik ma'lum bo'lsa U²/R qulay. Kuchlanish yoki tok 2 marta oshsa, quvvat (R o'zgarmas bo'lsa) 4 marta ortadi.",
(g,t,K)=>{const U=12,I=3+2*Math.sin(t*.8),P=U*I,bar=(y,l,v,max,c)=>{g.fillStyle=c;g.fillRect(120,y,420*v/max,22);g.fillStyle=K.c;g.textAlign='right';g.font='14px sans-serif';g.fillText(l,110,y+16)};bar(30,'U',U,24,K.a);bar(75,'I',I,6,K.m);bar(120,'P',P,72,K.h);g.textAlign='left';g.fillText('P = U·I = '+U+' · '+I.toFixed(1)+' = '+P.toFixed(0)+' W',120,180)}],
["Quvvatning SI dagi birligi vatt (W): 1 W = 1 J/s = 1 V·A. Ko'p ishlatiladigan birliklar: kilovatt (1 kW = 1000 W) va megavatt. Sarflangan energiya A = P·t joulda o'lchanadi, lekin amalda hisoblagichlar energiyani kilovatt-soatda hisoblaydi: 1 kVt·soat = 1000 W · 3600 s = 3,6·10⁶ J. Hisoblashda vaqtni sekundga yoki soatga mos ravishda o'tkazishni unutmang.",
(g,t,K)=>{const s=(t*2)%10,A=60*s;g.fillStyle=K.m;g.globalAlpha=.25;g.fillRect(60,80,480,30);g.globalAlpha=1;g.fillStyle=K.h;g.fillRect(60,80,480*s/10,30);g.fillStyle=K.c;g.font='16px Georgia,serif';g.textAlign='center';g.fillText('P = 60 W = 60 J/s',300,40);g.fillText('t = '+s.toFixed(1)+' s  →  A = P·t = '+A.toFixed(0)+' J',300,150);g.fillText('1 kVt·soat = 3,6·10⁶ J',300,185)}],
["Masalalarni yechishda avval berilganlarni yozing va mos formulani tanlang. Misol 1: U = 12 V, R = 6 Ω bo'lsa, P = U²/R = 24 W; kuchlanish 24 V bo'lsa, P = 96 W, ya'ni 4 marta ortadi. Misol 2: I = 3 A, R = 10 Ω bo'lsa, P = I²R = 90 W. Misol 3: 60 W lampa 5 soat yonsa, 60 W · 5 soat = 300 W·soat = 0,3 kVt·soat energiya sarflaydi.",
seq(['U = 12 V, R = 6 Ω:  P = U²/R = 24 W',"U = 24 V bo'lsa: P = 96 W (4 marta ortdi)",'I = 3 A, R = 10 Ω:  P = I²R = 90 W','60 W lampa 5 soatda: 0,3 kVt·soat'])]]});
Object.assign(B,{27:[
[`Kondensator — dielektrik qatlami bilan ajratilgan ikki o'tkazgich (qoplama)dan iborat qurilma. Manbaga ulanganda qoplamalardan biri musbat, ikkinchisi manfiy zaryadlanadi; zaryadlar miqdori absolyut qiymat bo'yicha teng. Qoplamalar orasida elektr maydon hosil bo'ladi. Kondensator zaryadni va maydon energiyasini to'playdi: u fotoapparat chaqnog'i, radio va elektron sxemalarda ishlatiladi.`,
(g,t,K)=>{const p=(t*.25)%1,n=Math.round(p*12);g.fillStyle=K.a;g.fillRect(250,40,8,120);g.fillRect(342,40,8,120);for(let i=0;i<n;i++){const y=50+i*9.5;g.fillStyle=K.h;g.beginPath();g.arc(240,y,3,0,7);g.fill();g.fillStyle=K.c;g.beginPath();g.arc(360,y,3,0,7);g.fill();g.strokeStyle=K.m;g.lineWidth=1;g.beginPath();g.moveTo(258,y);g.lineTo(342,y);g.stroke()}g.fillStyle=K.c;g.font='14px sans-serif';g.textAlign='center';g.fillText('zaryadlanmoqda: q = '+n+' (shartli birlik)',300,185)}],
[`Kondensatorning zaryadi unga berilgan kuchlanishga to'g'ri proporsional: q = C·U. Proporsionallik koeffitsienti C kondensatorning elektr sig'imi deyiladi: C = q/U. Sig'im kondensatorning o'lchami va dielektrikka bog'liq, lekin zaryad yoki kuchlanishga bog'liq emas. Birligi farad (F): 1 F = 1 C/V. Amalda mikrofarad (10⁻⁶ F), nanofarad (10⁻⁹ F) va pikofarad (10⁻¹² F) ishlatiladi.`,
(g,t,K)=>{const U=15+10*Math.sin(t*.7),C=2,q=C*U,bar=(y,l,v,max,c)=>{g.fillStyle=c;g.fillRect(120,y,420*v/max,22);g.fillStyle=K.c;g.textAlign='right';g.font='14px sans-serif';g.fillText(l,110,y+16)};bar(30,'U',U,25,K.a);bar(75,'q',q,50,K.h);bar(120,'C',C,4,K.m);g.textAlign='left';g.fillText('C = q/U = '+q.toFixed(1)+' / '+U.toFixed(1)+' = '+C+" (o'zgarmas)",120,180)}],
[`Yassi kondensator sig'imi C = ε₀εS/d, bunda S — qoplama yuzasi, d — qoplamalar orasidagi masofa, ε — dielektrikning dielektrik singdiruvchanligi, ε₀ = 8,85·10⁻¹² F/m. Yuza oshsa sig'im ortadi, masofa oshsa kamayadi. Dielektrik qo'yilsa, sig'im ε marta ortadi. Animatsiyada qoplamalar uzoqlashganda sig'im kamayishini ko'ring.`,
(g,t,K)=>{const d=6+4*Math.sin(t*.7),C=.885*50/d,x1=300-d*8-4,x2=300+d*8;g.fillStyle=K.a;g.fillRect(x1,40,8,120);g.fillRect(x2,40,8,120);g.strokeStyle=K.m;g.lineWidth=1;for(let y=50;y<160;y+=14){g.beginPath();g.moveTo(x1+8,y);g.lineTo(x2,y);g.stroke()}g.fillStyle=K.c;g.font='14px sans-serif';g.textAlign='center';g.fillText('d = '+d.toFixed(1)+' mm,  C = ε₀S/d = '+C.toFixed(1)+' pF',300,185)}],
[`Zaryadlangan kondensator maydon energiyasiga ega: W = CU²/2 = qU/2 = q²/(2C). Bu energiyani kondensator zanjirga tez qaytara oladi, shuning uchun u chaqnoqlar va impulsli qurilmalarda ishlatiladi. Kuchlanish 2 marta oshsa, energiya 4 marta ortadi. Masalan, C = 2 µF va U = 20 V bo'lsa, W = 2·10⁻⁶ · 400 / 2 = 4·10⁻⁴ J = 400 µJ.`,
(g,t,K)=>{const U=(t*5)%20,W=U*U;g.fillStyle=K.a;g.fillRect(60,50,480*U/20,26);g.fillStyle=K.h;g.fillRect(60,110,480*W/400,26);g.fillStyle=K.c;g.font='14px sans-serif';g.textAlign='left';g.fillText('U = '+U.toFixed(1)+' V',60,42);g.fillText('W = CU²/2 = '+W.toFixed(0)+' µJ  (C = 2 µF)',60,102);g.textAlign='center';g.fillText("U ikki marta oshsa, W to'rt marta ortadi",300,175)}]],
42:[
[`Elektr toki elektrolitdan (tuz, kislota yoki ishqor eritmasidan) o'tganda elektrodlarda moddalar ajralib chiqadi: bu hodisa elektroliz deyiladi. Eritmada molekulalar suvda ionlarga ajraladi (elektrolitik dissotsiatsiya). Musbat ionlar (kationlar) manfiy elektrod — katodga, manfiy ionlar (anionlar) musbat elektrod — anodga qarab harakatlanadi. Elektrodlarga yetib kelgan ionlar neytral atomlarga aylanib, modda sifatida ajraladi.`,
(g,t,K)=>{g.strokeStyle=K.m;g.lineWidth=3;g.strokeRect(120,40,360,130);g.fillStyle=K.c;g.fillRect(170,25,10,110);g.fillRect(420,25,10,110);g.font='13px sans-serif';g.textAlign='center';g.fillText('katod (−)',175,18);g.fillText('anod (+)',425,18);for(let i=0;i<8;i++){const y=60+(i*17%90);g.fillStyle=K.h;g.beginPath();g.arc(420-((i*30+t*40)%240),y,5,0,7);g.fill();g.fillStyle=K.a;g.beginPath();g.arc(180+((i*30+t*40)%240),y+8,5,0,7);g.fill()}g.fillStyle=K.h;g.fillText('+ ionlar katodga',230,190);g.fillStyle=K.a;g.fillText('− ionlar anodga',370,190)}],
[`Faradeyning birinchi qonuni: elektrodda ajralgan modda massasi elektrolitdan o'tgan zaryadga to'g'ri proporsional: m = k·q. Zaryad q = I·t bo'lgani uchun m = k·I·t. Demak tok yoki vaqt 2 marta oshsa, ajralgan massa ham 2 marta oshadi. Animatsiyada vaqt o'tgan sari katodda qatlam qalinlashayotganini ko'ring.`,
(g,t,K)=>{const s=(t*5)%50,m=.33*3*s,w=Math.min(16,m/3);g.strokeStyle=K.m;g.lineWidth=3;g.strokeRect(120,40,360,130);g.fillStyle=K.c;g.fillRect(170,25,10,110);g.fillRect(420,25,10,110);g.fillStyle=K.h;g.fillRect(170-w,40,w,95);for(let i=0;i<6;i++){g.beginPath();g.arc(420-((i*40+t*60)%240),70+(i*17%60),4,0,7);g.fill()}g.fillStyle=K.c;g.font='14px sans-serif';g.textAlign='center';g.fillText('I = 3 A,  t = '+s.toFixed(0)+' s,  m = k·I·t = '+m.toFixed(0)+' mg',300,190)}],
[`k koeffitsienti moddaning elektrokimyoviy ekvivalenti deyiladi: u 1 C zaryad o'tganda ajralgan modda massasiga teng. Birligi kg/C. U moddaning turiga bog'liq: mis uchun 0,33 mg/C, kumush uchun 1,12 mg/C, alyuminiy uchun 0,093 mg/C. Faradeyning ikkinchi qonuniga ko'ra k = M/(F·n), bunda M — molyar massa, n — valentlik, F = 96 500 C/mol.`,
(g,t,K)=>{const p=Math.min(1,(t*.4)%1.5);[['Ag',1.118],['Cu',.33],['Al',.093]].forEach(([n,k],i)=>{const y=40+i*45,w=300*k/1.118*p;g.fillStyle=K.h;g.fillRect(100,y,w,26);g.fillStyle=K.c;g.font='14px sans-serif';g.textAlign='right';g.fillText(n,92,y+18);g.textAlign='left';g.fillText((k*100*p).toFixed(0)+' mg  (q = 100 C)',108+w,y+18)})}],
[`Misol: mis sulfat eritmasidan I = 3 A tok t = 20 min davomida o'tdi. Vaqtni sekundga o'tkazamiz: 20 min = 1200 s. O'tgan zaryad q = I·t = 3 · 1200 = 3600 C. Mis uchun k = 0,33 mg/C bo'lgani uchun m = k·q = 0,33 · 3600 ≈ 1188 mg ≈ 1,2 g. Shuncha mis katodda ajraladi.`,
seq(['I = 3 A,  t = 20 min = 1200 s','q = I·t = 3 · 1200 = 3600 C','m = k·q = 0,33 mg/C · 3600 C','m ≈ 1188 mg ≈ 1,2 g'])]]});
Object.assign(B,{49:[
[`Doimiy magnit — uzoq vaqt magnit xossasini saqlaydigan jism. U temir, nikel, kobalt va ularning qotishmalaridan yasalgan jismlarni o'ziga tortadi. Magnit atrofidagi fazoda magnit maydon bo'ladi: magnit kuchlari shu maydon orqali ta'sir qiladi. Temir qirindilari magnit yaqiniga qo'yilsa, ular magnitga tortilib, maydonning kuchli joylarida to'planadi.`,
(g,t,K)=>{g.fillStyle='#e03131';g.fillRect(240,85,60,30);g.fillStyle='#1c7ed6';g.fillRect(300,85,60,30);g.fillStyle='#fff';g.font='bold 16px sans-serif';g.textAlign='center';g.fillText('N',270,106);g.fillText('S',330,106);g.fillStyle=K.c;for(let i=0;i<14;i++){const a=i*.45,r=150-((t*35+i*17)%110);g.beginPath();g.arc(300+Math.cos(a)*(r+30)*1.2,100+Math.sin(a)*r*.7,3,0,7);g.fill()}g.font='14px sans-serif';g.fillText('temir qirindilari magnitga tortiladi',300,190)}],
[`Har bir magnitning ikki qutbi bor: shimoliy (N) va janubiy (S). Magnitning ta'siri eng kuchli bo'lgan joylar qutblar hisoblanadi. Bir xil qutblar bir-birini itaradi, har xil qutblar tortadi. Magnitni ikkiga bo'lsak, bitta qutbli magnit hosil bo'lmaydi: har bir bo'lak yana ikki qutbli to'liq magnit bo'ladi. Elektr zaryaddan farqli, alohida magnit qutb topilmagan.`,
(g,t,K)=>{const mode=Math.floor(t/4)%2,p=(t%4)/4,gap=mode?20+100*p:120-100*p,x1=300-gap/2-120,x2=300+gap/2,c=['#1c7ed6','#e03131'];const mg=(x,a,b)=>{g.fillStyle=a;g.fillRect(x,85,60,30);g.fillStyle=b;g.fillRect(x+60,85,60,30);g.fillStyle='#fff';g.font='bold 16px sans-serif';g.textAlign='center';g.fillText(a==c[1]?'N':'S',x+30,106);g.fillText(b==c[1]?'N':'S',x+90,106)};mg(x1,c[0],c[1]);mg(x2,mode?c[1]:c[0],mode?c[0]:c[1]);g.fillStyle=K.h;g.font='15px sans-serif';g.fillText(mode?'bir xil qutblar itarishadi':'har xil qutblar tortishadi',300,170)}],
[`Magnit maydonni ko'rinadigan qilish uchun magnit maydon chiziqlaridan foydalaniladi. Ularning yo'nalishi sifatida magnit strelkaning shimoliy qutbi ko'rsatgan yo'nalish qabul qilingan. Magnit tashqarisida chiziqlar N qutbdan chiqib S qutbga kiradi, magnit ichida esa S dan N ga o'tadi: ular yopiq chiziqlar. Chiziqlar zich joyda maydon kuchli: qutblar yaqinida chiziqlar eng zich bo'ladi.`,
(g,t,K)=>{g.fillStyle='#e03131';g.fillRect(240,88,60,24);g.fillStyle='#1c7ed6';g.fillRect(300,88,60,24);g.strokeStyle=K.m;g.lineWidth=1;for(let k=1;k<4;k++){const rx=60+k*45,ry=15+k*22;g.beginPath();g.ellipse(300,100,rx,ry,0,0,7);g.stroke();[-1,1].forEach(sg=>{const th=Math.PI-((t*.25+k*.2)%1)*Math.PI;g.fillStyle=K.h;g.beginPath();g.arc(300+rx*Math.cos(th),100-sg*ry*Math.sin(th),4,0,7);g.fill()})}g.fillStyle=K.c;g.font='14px sans-serif';g.textAlign='center';g.fillText('chiziqlar N dan chiqib S ga kiradi (yopiq)',300,192)}],
[`Kompas — maydon yo'nalishini aniqlaydigan asbob; uning asosiy qismi erkin aylana oladigan kichik magnit strelka. Strelka magnit maydon chizig'i bo'ylab joylashadi: Yer maydonida uning shimoliy uchi taxminan geografik shimolni ko'rsatadi. Yaqinga boshqa magnit keltirilsa, strelka o'sha magnit maydoniga ko'ra buriladi. Shuning uchun kompasni temir buyumlar va magnitlardan uzoqda ishlatish kerak.`,
(g,t,K)=>{const a=t*.7,mx=300+Math.cos(a)*150,my=100+Math.sin(a)*70;g.strokeStyle=K.m;g.lineWidth=2;g.beginPath();g.arc(300,100,40,0,7);g.stroke();g.fillStyle='#1c7ed6';g.fillRect(mx-18,my-8,18,16);g.fillStyle='#e03131';g.fillRect(mx,my-8,18,16);const f=Math.atan2(my-100,mx-300);g.lineWidth=5;g.strokeStyle='#e03131';g.beginPath();g.moveTo(300,100);g.lineTo(300+30*Math.cos(f),100+30*Math.sin(f));g.stroke();g.strokeStyle='#1c7ed6';g.beginPath();g.moveTo(300,100);g.lineTo(300-30*Math.cos(f),100-30*Math.sin(f));g.stroke();g.fillStyle=K.c;g.font='14px sans-serif';g.textAlign='center';g.fillText('magnit siljisa, kompas strelkasi ham buriladi',300,192)}]],
52:[
[`1820-yilda daniyalik fizik Xans Kristian Oersted tajribada tok o'tayotgan sim yaqiniga qo'yilgan magnit strelka burilishini kuzatdi. Tok o'chirilganda strelka avvalgi holatiga qaytdi. Bundan tok atrofida magnit maydon hosil bo'ladi degan xulosa chiqdi: elektr va magnit hodisalar o'zaro bog'liq. Ma'lum bo'ldiki, magnit maydonni harakatdagi zaryadlar, ya'ni elektr toki hosil qiladi.`,
(g,t,K)=>{const on=Math.floor(t/3)%2==1,q=Math.min(1,(t%3)/.8),f=-Math.PI/2+(on?q:1-q)*Math.PI/2;g.strokeStyle=K.m;g.lineWidth=5;g.beginPath();g.moveTo(80,60);g.lineTo(520,60);g.stroke();if(on){g.fillStyle=K.h;for(let i=0;i<12;i++){g.beginPath();g.arc(80+((i*40+t*120)%440),60,4,0,7);g.fill()}}g.strokeStyle=K.m;g.lineWidth=2;g.beginPath();g.arc(300,125,32,0,7);g.stroke();g.lineWidth=5;g.strokeStyle='#e03131';g.beginPath();g.moveTo(300,125);g.lineTo(300+26*Math.cos(f),125+26*Math.sin(f));g.stroke();g.strokeStyle='#1c7ed6';g.beginPath();g.moveTo(300,125);g.lineTo(300-26*Math.cos(f),125-26*Math.sin(f));g.stroke();g.fillStyle=K.c;g.font='14px sans-serif';g.textAlign='center';g.fillText(on?'tok yoqildi: strelka burildi':`tok o'chirildi: strelka avvalgi holatda`,300,185)}],
[`To'g'ri tokning magnit maydon chiziqlari simni o'rab olgan konsentrik aylanalardan iborat. Yo'nalishi parma (o'ng vint) qoidasi bilan aniqlanadi: parmaning ilgarilanma harakati tok yo'nalishi bo'lsa, uning dastasining aylanish yo'nalishi maydon chiziqlari yo'nalishini ko'rsatadi. Tok yo'nalishi o'zgarsa, maydon yo'nalishi ham teskari bo'ladi. Simdan uzoqlashgan sari chiziqlar siyrak, ya'ni maydon kuchsiz bo'ladi.`,
(g,t,K)=>{const out=Math.floor(t/4)%2==0,s=out?-1:1;g.fillStyle=K.a;g.beginPath();g.arc(300,100,12,0,7);g.fill();g.fillStyle='#fff';g.font='bold 16px sans-serif';g.textAlign='center';g.fillText(out?'•':'×',300,106);g.lineWidth=1;g.strokeStyle=K.m;for(let k=1;k<4;k++){const r=k*24+10;g.beginPath();g.arc(300,100,r,0,7);g.stroke();for(let j=0;j<4;j++){const a=s*t*1.2+j*1.57+k;g.fillStyle=K.h;g.beginPath();g.arc(300+r*Math.cos(a),100+r*Math.sin(a),4,0,7);g.fill()}}g.fillStyle=K.c;g.font='14px sans-serif';g.fillText(out?`tok bizga qarab: maydon soat strelkasiga teskari`:`tok bizdan uzoqqa: maydon soat strelkasi bo'ylab`,300,192)}],
[`Solenoid — silindrga o'ralgan uzun sim g'altak. Tok o'tganda o'ramlar maydonlari qo'shilib, g'altak ichida deyarli bir jinsli kuchli maydon hosil qiladi; tashqarida maydon kuchsiz. G'altakning bir uchi shimoliy, ikkinchisi janubiy qutb vazifasini bajaradi: u doimiy magnitga o'xshaydi. Qutblarni o'ng qo'l qoidasi bilan topish mumkin. Maydon kuchi o'ramlar soni va tok kuchiga bog'liq: B ~ N·I.`,
(g,t,K)=>{const n=Math.round(8+4*Math.sin(t*.6)),x0=190,x1=410;g.strokeStyle=K.h;g.lineWidth=3;for(let i=0;i<n;i++){const x=x0+i*(x1-x0)/(n-1);g.beginPath();g.ellipse(x,100,10,34,0,0,7);g.stroke()}g.fillStyle=K.a;for(let i=0;i<6;i++){const x=150+((i*70+t*60)%300);g.beginPath();g.arc(x,100,4,0,7);g.fill()}g.strokeStyle=K.m;g.lineWidth=1;g.beginPath();g.ellipse(300,100,200,70,0,0,7);g.stroke();g.fillStyle=K.c;g.font='14px sans-serif';g.textAlign='center';g.fillText(`o'ramlar soni N = `+n+`: ichida maydon bir jinsli, B ~ N·I`,300,185)}],
[`Tokli to'g'ri o'tkazgich maydonining magnit induksiyasi B = μ₀I/(2πr) formulasi bilan topiladi, bunda r — simdan masofa, μ₀ = 4π·10⁻⁷ T·m/A. Tok oshsa, maydon ham ortadi; masofa oshsa, maydon kamayadi. Masalan, I = 10 A tokli simdan 1 sm masofada B = 2·10⁻⁷·10/0,01 = 2·10⁻⁴ T = 0,2 mT. Magnit induksiya birligi — tesla (T).`,
(g,t,K)=>{const X=r=>60+(r-1)/9*480,Y=r=>170-(1/r)*150;g.strokeStyle=K.m;g.lineWidth=1;g.beginPath();g.moveTo(60,10);g.lineTo(60,170);g.lineTo(560,170);g.stroke();g.strokeStyle=K.a;g.lineWidth=3;g.beginPath();for(let r=1;r<=10;r+=.1)g.lineTo(X(r),Y(r));g.stroke();const r=1+((t*1.2)%9);g.fillStyle=K.h;g.beginPath();g.arc(X(r),Y(r),7,0,7);g.fill();g.fillStyle=K.c;g.font='13px sans-serif';g.textAlign='center';g.fillText('r (sm)',530,190);g.fillText('B',44,20);g.fillText('I = 10 A:  r = '+r.toFixed(1)+' sm,  B = '+(.2/r).toFixed(3)+' mT',330,40)}]]});
Object.assign(B,{53:[
[`Magnit maydonda joylashgan tokli o'tkazgichga kuch ta'sir qiladi: bu kuch Amper kuchi deyiladi. Uni fransuz fizigi Andre Mari Amper o'rgangan. Kuch o'tkazgichni siljitadi: shu hodisa elektr dvigatellar ishining asosi. Tok bo'lmasa, o'tkazgich magnit maydonda bo'lsa ham unga kuch ta'sir qilmaydi. Animatsiyada magnit qutblari orasidagi relslarda sterjen tok ta'sirida siljiydi.`,
(g,t,K)=>{g.fillStyle='#e03131';g.fillRect(200,28,200,18);g.fillStyle='#1c7ed6';g.fillRect(200,160,200,18);g.fillStyle='#fff';g.font='bold 13px sans-serif';g.textAlign='center';g.fillText('N',300,42);g.fillText('S',300,174);g.strokeStyle=K.m;g.lineWidth=4;g.beginPath();g.moveTo(60,70);g.lineTo(540,70);g.moveTo(60,150);g.lineTo(540,150);g.stroke();const x=100+((t*60)%380);g.strokeStyle=K.h;g.lineWidth=8;g.beginPath();g.moveTo(x,70);g.lineTo(x,150);g.stroke();ar(g,x+12,110,1,50,K.c);g.fillStyle=K.c;g.font='14px sans-serif';g.fillText(`tokli sterjenga Amper kuchi ta'sir qiladi`,300,196)}],
[`Amper kuchining yo'nalishi chap qo'l qoidasi bilan aniqlanadi: chap qo'lni shunday tutingki, magnit induksiya chiziqlari kaftga kirsin, to'rt barmoq tok yo'nalishini ko'rsatsin; unda 90° ga egilgan bosh barmoq kuch yo'nalishini ko'rsatadi. Tok yo'nalishi yoki magnit maydon yo'nalishi teskari bo'lsa, kuch ham teskari bo'ladi. Ikkalasi bir vaqtda o'zgarsa, kuch yo'nalishi o'zgarmaydi.`,
(g,t,K)=>{const ph=t%4,dir=Math.floor(t/4)%2?-1:1,x=300-dir*80+dir*ph*40;g.fillStyle='#e03131';g.fillRect(200,28,200,18);g.fillStyle='#1c7ed6';g.fillRect(200,160,200,18);g.strokeStyle=K.m;g.lineWidth=4;g.beginPath();g.moveTo(120,70);g.lineTo(480,70);g.moveTo(120,150);g.lineTo(480,150);g.stroke();g.strokeStyle=K.h;g.lineWidth=8;g.beginPath();g.moveTo(x,70);g.lineTo(x,150);g.stroke();ar(g,x,110,dir,45,K.c);g.fillStyle=K.c;g.font='14px sans-serif';g.textAlign='center';g.fillText(dir>0?`tok bir yo'nalishda: kuch o'ngga`:`tok teskari: kuch ham teskari (chapga)`,300,196)}],
[`Amper kuchining moduli F = B·I·l·sinα formulasi bilan topiladi, bunda B — magnit induksiya, I — tok kuchi, l — maydondagi o'tkazgich uzunligi, α — tok bilan maydon chiziqlari orasidagi burchak. O'tkazgich maydonga perpendikulyar (α = 90°) bo'lsa, kuch eng katta: F = B·I·l. Parallel (α = 0°) bo'lsa, kuch nolga teng. Masalan, B = 2 T, I = 3 A, l = 0,5 m, α = 90° bo'lsa, F = 3 N.`,
(g,t,K)=>{const a=(t*.8)%Math.PI,F=3*Math.sin(a);g.strokeStyle=K.m;g.lineWidth=1;for(let y=30;y<170;y+=28){g.beginPath();g.moveTo(60,y);g.lineTo(480,y);g.stroke()}g.fillStyle=K.c;g.font='13px sans-serif';g.textAlign='center';g.fillText('B →',510,40);g.strokeStyle=K.h;g.lineWidth=6;g.beginPath();g.moveTo(270-70*Math.cos(a),100+70*Math.sin(a));g.lineTo(270+70*Math.cos(a),100-70*Math.sin(a));g.stroke();g.fillStyle=K.a;g.fillRect(520,170-F*40,16,F*40);g.fillStyle=K.c;g.fillText('F',528,186);g.fillText('α = '+Math.round(a*57.3)+'°,  F = B·I·l·sinα = '+F.toFixed(2)+' N',270,196)}],
[`Amper kuchi qo'llaniladigan qurilmalar ko'p. Elektr dvigatellarda tokli ramka magnit maydonda aylanadi. Elektr o'lchov asboblarida (ampermetr, voltmetr) tokli g'altak strelkani buradi. Dinamik karnayda o'zgaruvchan tok o'tgan g'altak magnit maydonda tebranib, konusni harakatga keltiradi va tovush hosil qiladi. Kuch qancha katta bo'lsa, tebranish shuncha kuchli bo'ladi.`,
(g,t,K)=>{const off=10*Math.sin(t*9);g.fillStyle='#e03131';g.fillRect(180,70,40,60);g.fillStyle='#1c7ed6';g.fillRect(140,85,40,30);g.fillStyle=K.a;g.fillRect(220+off,90,30,20);g.fillStyle=K.h;g.beginPath();g.moveTo(250+off,90);g.lineTo(330+off,40);g.lineTo(330+off,160);g.lineTo(250+off,110);g.closePath();g.fill();g.strokeStyle=K.m;g.lineWidth=2;for(let k=0;k<3;k++){const r=((t*60+k*45)%135);g.globalAlpha=1-r/135;g.beginPath();g.arc(330,100,r,-.9,.9);g.stroke()}g.globalAlpha=1;g.fillStyle=K.c;g.font='14px sans-serif';g.textAlign='center';g.fillText(`dinamik: g'altak Amper kuchi bilan tebranadi`,300,192)}]],
56:[
[`Magnit maydonda harakatlanayotgan zaryadli zarraga kuch ta'sir qiladi: bu Lorens kuchi (gollandiyalik fizik X. Lorens nomi bilan). Uning moduli F = q·v·B·sinα, bunda q — zaryad, v — tezlik, B — magnit induksiya, α — tezlik va maydon orasidagi burchak. Kuch tezlikka ham, magnit induksiyaga ham perpendikulyar. Yo'nalishi chap qo'l qoidasi bilan topiladi (musbat zaryad uchun; manfiyda teskari). Tinch turgan zaryadga magnit maydon ta'sir qilmaydi.`,
(g,t,K)=>{g.fillStyle=K.m;g.font='16px sans-serif';g.textAlign='center';for(let x=40;x<600;x+=50)for(let y=25;y<200;y+=38)g.fillText('×',x,y);const a=t*1.1,x=300+70*Math.cos(a),y=100+70*Math.sin(a),tx=-Math.sin(a),ty=Math.cos(a);g.fillStyle=K.a;g.beginPath();g.arc(x,y,7,0,7);g.fill();g.lineWidth=3;g.strokeStyle=K.c;g.beginPath();g.moveTo(x,y);g.lineTo(x+40*tx,y+40*ty);g.stroke();g.strokeStyle=K.h;g.beginPath();g.moveTo(x,y);g.lineTo(x-40*Math.cos(a),y-40*Math.sin(a));g.stroke();g.font='bold 14px sans-serif';g.fillStyle=K.c;g.fillText('v',x+50*tx,y+50*ty);g.fillStyle=K.h;g.fillText('F',x-52*Math.cos(a),y-52*Math.sin(a))}],
[`Lorens kuchi tezlikka perpendikulyar bo'lgani uchun u zarra tezligi modulini o'zgartirmaydi, faqat yo'nalishini buradi va ish bajarmaydi. Shuning uchun maydonga perpendikulyar uchib kirgan zarra aylana bo'ylab tekis harakatlanadi: Lorens kuchi markazga intilma kuch vazifasini bajaradi. Maydon bo'ylab uchayotgan zarraga kuch ta'sir qilmaydi va u to'g'ri chiziqda harakatlanadi. Ikkala holatni animatsiyada solishtiring.`,
(g,t,K)=>{g.fillStyle=K.m;g.font='14px sans-serif';g.textAlign='center';for(let x=40;x<600;x+=50)for(let y=70;y<200;y+=40)g.fillText('×',x,y);const a=t*1.2;for(let i=0;i<30;i++){const b=a-i*.08;g.globalAlpha=1-i/30;g.fillStyle=K.a;g.beginPath();g.arc(300+62*Math.cos(b),125+62*Math.sin(b),5,0,7);g.fill()}g.globalAlpha=1;const sx=60+((t*90)%480);g.fillStyle=K.h;g.beginPath();g.arc(sx,28,6,0,7);g.fill();g.fillStyle=K.c;g.fillText(`v ∥ B: to'g'ri chiziq`,120,50);g.fillText('v ⟂ B: aylana',300,198)}],
[`Lorens kuchi markazga intilma kuchga teng: qvB = mv²/r. Bundan aylana radiusi r = mv/(qB). Tezlik oshsa radius kattalashadi, maydon kuchaysa yoki zaryad oshsa kichrayadi. Aylanish davri T = 2πm/(qB) tezlikka bog'liq emas. Masalan, tezligi 4·10⁶ m/s bo'lgan elektron 3 mT maydonda r = 9,1·10⁻³¹·4·10⁶/(1,6·10⁻¹⁹·3·10⁻³) ≈ 7,6 mm radiusli aylana chizadi.`,
(g,t,K)=>{const B=3+2*Math.sin(t*.5),r=22.8/B,R=r*4,a=(3*t-4*Math.cos(t*.5)+4)*.8;g.strokeStyle=K.a;g.lineWidth=2;g.setLineDash([5,5]);g.beginPath();g.arc(300,100,R,0,7);g.stroke();g.setLineDash([]);g.fillStyle=K.h;g.beginPath();g.arc(300+R*Math.cos(a),100+R*Math.sin(a),7,0,7);g.fill();g.fillStyle=K.c;g.font='14px sans-serif';g.textAlign='center';g.fillText('B = '+B.toFixed(1)+' mT,  v = 4·10⁶ m/s:  r = mv/(eB) = '+r.toFixed(1)+' mm',300,192)}],
[`Lorens kuchi zamonaviy texnikada keng qo'llanadi. Zaryadli zarralar tezlatgichi siklotronda zarralar magnit maydon ta'sirida spiral bo'ylab harakatlanib, elektr maydonda tezlashadi. Massa-spektrometr izotoplarni massasiga ko'ra ajratadi: yengil zarralar kichik radiusli, og'ir zarralar katta radiusli aylana chizadi. Eski kineskoplarda elektron dastasi magnit maydon bilan boshqariladi. Yerning magnit maydoni quyosh zarralarini chetga burib, qutblarda qutb shafaqlarini hosil qiladi.`,
(g,t,K)=>{const T=t%8,a=T*3.2,r=10+T*10;for(let i=0;i<60;i++){const s=Math.max(0,T-i*.04),b=s*3.2,q=10+s*10;g.globalAlpha=1-i/60;g.fillStyle=K.a;g.beginPath();g.arc(300+q*Math.cos(b),100+q*Math.sin(b),3,0,7);g.fill()}g.globalAlpha=1;g.fillStyle=K.h;g.beginPath();g.arc(300+r*Math.cos(a),100+r*Math.sin(a),7,0,7);g.fill();g.fillStyle=K.c;g.font='14px sans-serif';g.textAlign='center';g.fillText(`siklotron: zarra kengayuvchi spiral bo'ylab tezlashadi`,300,192)}]]});
const fr=(g,K,th,L,tx)=>{g.fillStyle='#e03131';g.fillRect(60,60,50,80);g.fillStyle='#1c7ed6';g.fillRect(490,60,50,80);g.fillStyle='#fff';g.font='bold 15px sans-serif';g.textAlign='center';g.fillText('N',85,106);g.fillText('S',515,106);const cx=Math.cos(th)*80,cy=Math.sin(th)*80;g.strokeStyle=K.m;g.lineWidth=1;for(let y=70;y<140;y+=20){g.beginPath();g.moveTo(115,y);g.lineTo(485,y);g.stroke()}g.strokeStyle=K.c;g.lineWidth=6;g.beginPath();g.moveTo(300-cx,100+cy);g.lineTo(300+cx,100-cy);g.stroke();if(L>0){g.lineWidth=3;g.strokeStyle=K.h;g.beginPath();g.moveTo(300+cx,100-cy);g.lineTo(300+cx,100-cy-L);g.stroke();g.beginPath();g.moveTo(300-cx,100+cy);g.lineTo(300-cx,100+cy+L);g.stroke()}g.fillStyle=K.c;g.font='14px sans-serif';g.fillText(tx,300,192)};
Object.assign(B,{55:[
[`Bir jinsli magnit maydonda tokli ramkaning qarama-qarshi tomonlariga yo'nalishi qarama-qarshi, moduli teng Amper kuchlari ta'sir qiladi. Bu kuchlar juft kuch hosil qiladi va ramkani aylantiruvchi moment bilan buradi. Ramkaning boshqa ikki tomoniga ta'sir qiluvchi kuchlar o'q bo'ylab yo'nalgan va ramkani aylantirmaydi. Ramka tekisligi maydonga parallel bo'lganda aylantiruvchi moment eng katta bo'ladi.`,
(g,t,K)=>{const th=Math.min(1.57,(t%4)*.5);fr(g,K,th,45*Math.cos(th)+4,'juft kuchlar ramkani buradi; burilgan sari moment kamayadi')}],
[`Ramka burilganda juft kuchning yelkasi kamayadi, shuning uchun moment ham kamayadi. Ramka tekisligi maydonga perpendikulyar bo'lganda moment nolga teng bo'ladi: bu muvozanat vaziyati. Inersiya tufayli ramka bu vaziyatdan o'tib ketadi va bir necha tebranishdan so'ng unda to'xtaydi. Ramka tekisligiga normal magnit maydon bo'ylab yo'nalgan holat barqaror muvozanatdir.`,
(g,t,K)=>{const s=t%7,th=1.57*(1-Math.exp(-s/1.8)*Math.cos(3.2*s));fr(g,K,th,0,s>5?'muvozanat: ramka maydonga perpendikulyar, moment = 0':'ramka tebranib muvozanatga keladi')}],
[`Ramkaga ta'sir qiluvchi aylantiruvchi moment M = B·I·S·sinα formulasi bilan topiladi, bunda B — magnit induksiya, I — tok kuchi, S — ramka yuzasi, α — ramka normali bilan maydon orasidagi burchak. Ko'p o'ramli ramkada moment o'ramlar soni N ga ko'payadi: M = N·B·I·S·sinα. Masalan, B = 3 T, I = 5 A, S = 100 sm² = 0,01 m² bo'lsa, eng katta moment M = 3·5·0,01 = 0,15 N·m.`,
(g,t,K)=>{const X=a=>60+a/Math.PI*480,Y=a=>170-Math.sin(a)*140;g.strokeStyle=K.m;g.lineWidth=1;g.beginPath();g.moveTo(60,10);g.lineTo(60,170);g.lineTo(560,170);g.stroke();g.strokeStyle=K.a;g.lineWidth=3;g.beginPath();for(let a=0;a<=Math.PI;a+=.05)g.lineTo(X(a),Y(a));g.stroke();const a=(t*.9)%Math.PI;g.fillStyle=K.h;g.beginPath();g.arc(X(a),Y(a),7,0,7);g.fill();g.fillStyle=K.c;g.font='13px sans-serif';g.textAlign='center';g.fillText('α',540,190);g.fillText('M',44,20);g.fillText('B=3 T, I=5 A, S=100 sm²:  α = '+Math.round(a*57.3)+'°,  M = '+(.15*Math.sin(a)).toFixed(3)+' N·m',330,40)}],
[`Ramka muvozanat vaziyatidan o'tgach to'xtab qolmasligi uchun tok yo'nalishini har yarim aylanishda o'zgartirish kerak. Buni kollektor — ikkita yarim halqadan iborat qurilma bajaradi: cho'tkalar yarim halqalarga navbatma-navbat tegib, ramkadagi tokni almashtiradi. Natijada moment doim bir yo'nalishda ta'sir qiladi va ramka tinimsiz aylanadi. Bu elektr dvigatelning ishlash printsipi.`,
(g,t,K)=>{const a=t*2,c=Math.cos(a),w=Math.abs(c)*160;g.fillStyle='#e03131';g.fillRect(60,50,40,100);g.fillStyle='#1c7ed6';g.fillRect(500,50,40,100);g.strokeStyle=c>0?K.a:K.h;g.lineWidth=5;g.strokeRect(300-w/2,45,w,110);g.fillStyle=K.c;g.font='14px sans-serif';g.textAlign='center';g.fillText(c>0?`ramkada tok bir yo'nalishda`:`kollektor tok yo'nalishini almashtirdi`,300,192)}]],
57:[
[`Elektromagnit — temir (yumshoq po'lat) o'zakka o'ralgan tokli g'altak. Tok o'tganda g'altak magnit maydon hosil qiladi, temir o'zak esa uni bir necha o'n va yuz marta kuchaytiradi, chunki o'zak magnitlanadi. Tok o'chirilsa, yumshoq temir deyarli darrov magnitligini yo'qotadi. Animatsiyada o'zaksiz g'altak bitta skrepkani, o'zakli g'altak esa ko'p skrepkani tortishi ko'rsatilgan.`,
(g,t,K)=>{const sol=(x,core,n)=>{if(core){g.fillStyle=K.m;g.fillRect(x-70,92,140,16)}g.strokeStyle=K.h;g.lineWidth=3;for(let i=0;i<8;i++){const xx=x-56+i*16;g.beginPath();g.moveTo(xx,84);g.lineTo(xx+6,116);g.stroke()}g.fillStyle=K.c;for(let j=0;j<n;j++){g.fillRect(x-50+j*20,124+Math.sin(t*3+j)*2,10,16)}g.font='14px sans-serif';g.textAlign='center';g.fillText(core?`temir o'zak bilan`:`o'zaksiz`,x,175)};sol(170,0,1);sol(430,1,5)}],
[`Elektromagnitning kuchi uchta omilga bog'liq: g'altakdagi o'ramlar soniga, tok kuchiga va o'zakning borligiga (materialiga). Tok yoki o'ramlar soni oshsa, magnit maydon B ~ N·I qonuniga ko'ra kuchayadi. Qutblar tok yo'nalishiga bog'liq: yo'nalish o'zgarsa, qutblar ham almashadi. Shu sababli elektromagnitning kuchini tok bilan oson boshqarish mumkin.`,
(g,t,K)=>{const N=60+40*Math.sin(t*.5),I=2+1.5*Math.sin(t*.9),Bv=N*I,bar=(y,l,v,max,c)=>{g.fillStyle=c;g.fillRect(120,y,420*v/max,22);g.fillStyle=K.c;g.textAlign='right';g.font='14px sans-serif';g.fillText(l,110,y+16)};bar(30,'N',N,100,K.a);bar(75,'I',I,3.5,K.m);bar(120,'B ~ N·I',Bv,350,K.h);g.textAlign='left';g.fillText(`o'ramlar soni yoki tok oshsa, maydon kuchayadi`,120,180)}],
[`Elektromagnit rele — kichik tok yordamida katta tok zanjirini ulaydigan va uzadigan qurilma. Boshqaruv zanjiri ulanganda elektromagnit yakorni tortadi, yakor kontaktlarni yopadi va ishchi zanjir ishga tushadi. Tok o'chirilsa, prujina yakorni qaytaradi va kontaktlar ochiladi. Rele boshqaruv zanjirini ishchi zanjirdan ajratadi, shuning uchun kuchli asboblarni xavfsiz boshqarish mumkin.`,
(g,t,K)=>{const on=Math.floor(t/3)%2==1;g.strokeStyle=K.h;g.lineWidth=3;for(let i=0;i<6;i++){g.beginPath();g.moveTo(100+i*14,95);g.lineTo(106+i*14,125);g.stroke()}g.fillStyle=K.m;g.fillRect(95,100,90,14);g.fillStyle=on?K.h:K.c;g.fillRect(200,on?100:84,90,8);g.fillStyle=K.c;g.fillRect(300,108,12,26);g.fillStyle=on?'#ffd43b':K.m;g.globalAlpha=on?1:.3;g.shadowColor='#ffd43b';g.shadowBlur=on?30:0;g.beginPath();g.arc(470,100,26,0,7);g.fill();g.shadowBlur=0;g.globalAlpha=1;g.fillStyle=K.c;g.font='14px sans-serif';g.textAlign='center';g.fillText(on?`kichik tok oqdi: yakor tortildi, kontakt ulandi, lampa yondi`:`tok yo'q: kontakt ochiq, lampa o'chiq`,300,180)}],
[`Elektromagnitlar texnikada keng qo'llanadi. Kranlarda temir va po'lat parchalarini ko'tarib tashishda tok yoqilganda ular ushlanadi, o'chirilganda tushiriladi. Elektr qo'ng'iroqda elektromagnit bolg'achani tortib tebratadi. Elektr dvigatellar, generatorlar, transformatorlar, magnitli yozuv qurilmalari va tibbiyotdagi MRT ham elektromagnitlardan foydalanadi.`,
(g,t,K)=>{const on=Math.floor(t/3)%2==0,ph=t%3,fall=Math.min(1,ph/1.1);g.fillStyle=K.m;g.fillRect(240,30,120,24);g.strokeStyle=K.h;g.lineWidth=3;g.beginPath();g.moveTo(300,0);g.lineTo(300,30);g.stroke();g.fillStyle=K.c;[[265,0],[295,8],[325,0],[280,16],[310,16]].forEach(([x,dy],i)=>{const y=on?58+dy:Math.min(170-(i%2)*14,58+dy+fall*fall*120);g.fillRect(x,y,20,12)});g.strokeStyle=K.m;g.lineWidth=2;g.beginPath();g.moveTo(60,182);g.lineTo(540,182);g.stroke();g.fillStyle=K.c;g.font='14px sans-serif';g.textAlign='center';g.fillText(on?`tok yoqilgan: temir parchalari ko'tarildi`:`tok o'chirilgan: parchalar tushdi`,300,198)}]]});
Object.assign(B,{11:[
[`Elektr maydon zaryadni bir nuqtadan ikkinchisiga ko'chirganda ish bajaradi. Bir xil zaryadni ko'chirishda bajarilgan ish zanjirning shu qismida kuchlanish qancha katta bo'lsa, shuncha katta bo'ladi. Shuning uchun kuchlanish maydonning zaryadni ko'chirish qobiliyatini ko'rsatadi. Animatsiyada bir xil zaryad kichik va katta kuchlanishli qismlardan o'tmoqda: ikkinchi holda energiya tezroq ortadi.`,
(g,t,K)=>{[[50,5],[130,15]].forEach(([y,U])=>{g.fillStyle=K.m;g.globalAlpha=.25;g.fillRect(160,y,260,30);g.globalAlpha=1;const p=(t*.4)%1;g.fillStyle=K.h;g.beginPath();g.arc(160+260*p,y+15,8,0,7);g.fill();g.fillStyle=K.a;g.fillRect(160,y+34,260*p*U/15,6);g.fillStyle=K.c;g.font='14px sans-serif';g.textAlign='right';g.fillText('U = '+U+' V',152,y+20);g.textAlign='left';g.fillText('A = '+(U*p).toFixed(1)+' J',432,y+20)});g.textAlign='center';g.fillText('q = 1 C: kuchlanish katta bo\'lsa, ish ham katta',300,196)}],
[`Elektr kuchlanish — zanjir qismida maydon bajargan ishning ko'chirilgan zaryadga nisbati: U = A/q. Birligi — volt (V): 1 V = 1 J/C, ya'ni 1 C zaryad ko'chirilganda 1 J ish bajarilsa, kuchlanish 1 V. Ko'p ishlatiladigan birliklar: millivolt (1 mV = 10⁻³ V), kilovolt (1 kV = 10³ V). Formuladan A = q·U va q = A/U kelib chiqadi. Masalan, A = 60 J, q = 12 C bo'lsa, U = 5 V.`,
(g,t,K)=>{const A=20+15*Math.sin(t*.8),q=2,bar=(y,l,v,max,c)=>{g.fillStyle=c;g.fillRect(120,y,420*v/max,22);g.fillStyle=K.c;g.textAlign='right';g.font='14px sans-serif';g.fillText(l,110,y+16)};bar(30,'A (J)',A,35,K.a);bar(75,'q (C)',q,4,K.m);bar(120,'U (V)',A/q,18,K.h);g.textAlign='left';g.fillText('U = A/q = '+A.toFixed(1)+' / 2 = '+(A/q).toFixed(1)+' V   (1 V = 1 J/C)',120,180)}],
[`Kuchlanishni voltmetr bilan o'lchaydilar. Voltmetr o'lchanayotgan iste'molchining ikki uchiga parallel ulanadi. Uning qarshiligi juda katta bo'lishi kerak, shunda u zanjirdagi tokni deyarli o'zgartirmaydi. Voltmetrning qutblari bor: «+» manbaning musbat qutbi tomonga ulanadi. Asbobni ishlatishdan oldin uning o'lchash chegarasi va bo'linish bahosini aniqlab oling.`,
(g,t,K)=>{const U=12+8*Math.sin(t*.7);g.strokeStyle=K.m;g.lineWidth=2;g.beginPath();g.moveTo(60,150);g.lineTo(240,150);g.moveTo(360,150);g.lineTo(540,150);g.stroke();g.fillStyle=K.a;g.fillRect(240,136,120,28);g.fillStyle=K.c;g.font='13px sans-serif';g.textAlign='center';g.fillText('R',300,155);g.beginPath();g.moveTo(240,150);g.lineTo(240,100);g.lineTo(270,100);g.moveTo(360,150);g.lineTo(360,100);g.lineTo(330,100);g.stroke();g.beginPath();g.arc(300,80,32,0,7);g.stroke();const a=-2.5+U/24*1.9;g.strokeStyle=K.h;g.lineWidth=3;g.beginPath();g.moveTo(300,95);g.lineTo(300+26*Math.cos(a),95+26*Math.sin(a));g.stroke();g.fillStyle=K.c;g.fillText('V',300,112);g.fillText('U = '+U.toFixed(1)+' V',300,28);g.fillText(`voltmetr iste'molchiga parallel ulanadi`,300,190)}],
[`Zanjirda ampermetr va voltmetr turlicha ulanadi: ampermetr iste'molchi bilan ketma-ket (tok shu orqali o'tadi), voltmetr esa parallel (kuchlanish ikki nuqta orasida o'lchanadi). Agar voltmetrni ketma-ket ulasak, juda katta qarshiligi tufayli zanjirdagi tok deyarli nolga tushadi. Agar ampermetrni parallel ulasak, uning kichik qarshiligi qisqa tutashuv hosil qilib, asbobni kuydirishi mumkin.`,
(g,t,K)=>{const U=12+8*Math.sin(t*.7);lp(g,t,K,U/6,[[300,'R = 6 Ω']],'V: '+U.toFixed(1)+' V (parallel),   A: '+(U/6).toFixed(2)+' A (ketma-ket)')}]],
12:[
[`Elektr tokining kuchi — o'tkazgich ko'ndalang kesimidan o'tgan zaryadning shu o'tish vaqtiga nisbati. Kesimdan vaqt birligida qancha ko'p zaryad o'tsa, tok kuchi shuncha katta. Animatsiyada nuqtalar o'tkazgichda harakatlanib, punktir bilan belgilangan kesimdan o'tadi: hisoblagich shu kesimdan o'tgan zaryadlar sonini ko'rsatadi.`,
(g,t,K)=>{const pos=t*70;g.strokeStyle=K.m;g.lineWidth=14;g.globalAlpha=.3;g.beginPath();g.moveTo(40,100);g.lineTo(560,100);g.stroke();g.globalAlpha=1;g.setLineDash([5,5]);g.lineWidth=2;g.beginPath();g.moveTo(300,50);g.lineTo(300,150);g.stroke();g.setLineDash([]);g.fillStyle=K.h;for(let i=0;i<14;i++){g.beginPath();g.arc(40+((i*40+pos)%520),100,5,0,7);g.fill()}g.fillStyle=K.c;g.font='14px sans-serif';g.textAlign='center';g.fillText(`kesimdan o'tgan zaryadlar soni: `+Math.floor(pos/40),300,40);g.fillText(`tok kuchi = vaqt birligida kesimdan o'tgan zaryad`,300,185)}],
[`Tok kuchi I = q/t formulasi bilan hisoblanadi, bunda q — zaryad, t — vaqt. Birligi — amper (A): 1 A = 1 C/s. Mayda tok kuchlari uchun milliamper (1 mA = 10⁻³ A) va mikroamper (1 µA = 10⁻⁶ A) ishlatiladi. Formuladan q = I·t kelib chiqadi. Masalan, q = 10 C zaryad t = 5 s da o'tsa, I = 10/5 = 2 A; 3 A tokda 4 s da 12 C zaryad o'tadi.`,
(g,t,K)=>{const s=.5+(t*1.2)%5.5,q=2*s,bar=(y,l,v,max,c)=>{g.fillStyle=c;g.fillRect(120,y,420*v/max,22);g.fillStyle=K.c;g.textAlign='right';g.font='14px sans-serif';g.fillText(l,110,y+16)};bar(30,'t (s)',s,6,K.a);bar(75,'q (C)',q,12,K.h);g.textAlign='left';g.fillText('I = q/t = '+q.toFixed(1)+' / '+s.toFixed(1)+' = 2 A   (1 A = 1 C/s)',120,140)}],
[`Tok kuchi ampermetr bilan o'lchanadi. Ampermetr o'lchanayotgan zanjirga ketma-ket ulanadi, shunda butun tok u orqali o'tadi. Uning qarshiligi juda kichik bo'ladi, shuning uchun zanjirdagi tok deyarli o'zgarmaydi. Ampermetrning «+» qutbi manbaning musbat qutbi tomonga ulanadi. Asbobni ulashdan oldin o'lchash chegarasini yuqoriroq tanlang, keyin kamaytiring.`,
(g,t,K)=>{const I=2+1.4*Math.sin(t*.7);lp(g,t,K,I,[[300,'R = 6 Ω']],'I = '+I.toFixed(2)+' A');g.fillStyle=K.m;g.globalAlpha=.25;g.beginPath();g.arc(60,100,26,0,7);g.fill();g.globalAlpha=1;g.strokeStyle=K.m;g.lineWidth=2;g.stroke();const a=-2.5+I/4*1.9;g.strokeStyle=K.h;g.lineWidth=3;g.beginPath();g.moveTo(60,112);g.lineTo(60+20*Math.cos(a),112+20*Math.sin(a));g.stroke();g.fillStyle=K.c;g.font='13px sans-serif';g.textAlign='center';g.fillText('A',60,128)}],
[`Ketma-ket ulangan zanjirda zaryadlar to'planmaydi, shuning uchun tok kuchi zanjirning hamma qismida bir xil: I = I₁ = I₂ = I₃. Demak, ampermetrni zanjirning istalgan joyiga ulash mumkin va ko'rsatishi o'zgarmaydi. Tok manbadan chiqqanda ham, iste'molchilardan o'tgandan keyin ham bir xil bo'ladi: u «sarflanib» kamaymaydi, faqat energiya iste'molchilarga beriladi.`,
(g,t,K)=>{const I=(12+6*Math.sin(t*.7))/12;lp(g,t,K,I,[[200,'R₁ = 4 Ω'],[400,'R₂ = 8 Ω']],'A₁ = A₂ = A₃ = '+I.toFixed(2)+' A (ketma-ketda tok bir xil)')}]]});
Object.assign(B,{15:[
[`Metallda tok erkin elektronlarning tartibli harakati. Elektronlar kristall panjara tugunlaridagi musbat ionlar bilan to'qnashadi: har bir to'qnashuvda ular harakat yo'nalishini o'zgartiradi va energiyasining bir qismini ionlarga beradi. Shu sababli tok oqimiga to'siq paydo bo'ladi: bu to'siqni o'tkazgichning elektr qarshiligi deb ataymiz. Qarshilik R harfi bilan belgilanadi, birligi — om (Ω).`,
(g,t,K)=>{for(let i=0;i<9;i++)for(let j=0;j<4;j++){g.fillStyle=K.m;g.beginPath();g.arc(60+i*60+Math.sin(t*9+i*j)*2,40+j*40+Math.cos(t*8+i)*2,9,0,7);g.fill()}const f=x=>100+36*Math.sin(x/17)*Math.cos(x/47);g.fillStyle=K.h;for(let k=0;k<12;k++){const x=40+(((t*90-k*8)%520)+520)%520;g.globalAlpha=1-k/12;g.beginPath();g.arc(x,f(x),5,0,7);g.fill()}g.globalAlpha=1;g.fillStyle=K.c;g.font='14px sans-serif';g.textAlign='center';g.fillText(`elektron ion bilan to'qnashib yo'nalishini o'zgartiradi`,300,196)}],
[`O'tkazgichning qarshiligi uning uzunligiga to'g'ri, ko'ndalang kesim yuziga teskari proporsional va materialga bog'liq: R = ρ·l/S. Bunda ρ — solishtirma qarshilik (birligi Ω·m yoki Ω·mm²/m), l — uzunlik, S — kesim yuzi. Sim 2 marta uzun bo'lsa, qarshilik 2 marta ortadi; 2 marta yo'g'on bo'lsa (yuza 2 marta ortsa), 2 marta kamayadi. Shuning uchun uzoq masofaga tok o'tkazishda yo'g'on simlar ishlatiladi.`,
(g,t,K)=>{const l=300+160*Math.sin(t*.7),h=24+14*Math.sin(t*1.1+1);g.fillStyle=K.a;g.fillRect(300-l/2,100-h/2,l,h);g.fillStyle=K.h;for(let i=0;i<8;i++){g.beginPath();g.arc(300-l/2+((i*l/8+t*40)%l),100,Math.min(5,h/3),0,7);g.fill()}g.fillStyle=K.c;g.font='14px sans-serif';g.textAlign='center';g.fillText('uzunlik l = '+Math.round(l/10)+' sm:  R ~ ρ·l/S = '+(l/h/10).toFixed(2)+' (shartli birlik)',300,175)}],
[`Metallarda harorat oshganda ionlarning tebranishi kuchayadi, elektronlar ko'proq to'qnashadi va qarshilik ortadi. Taxminan R = R₀(1 + α·Δt), bunda α — qarshilikning harorat koeffitsienti (misda ≈ 0,004 1/°C). Shu sababli lampa yonganda cho'g'lanma tolasi sovuq holatidagidan bir necha marta katta qarshilikka ega bo'ladi. Juda past haroratlarda ba'zi metallarning qarshiligi nolga tushadi: bu o'ta o'tkazuvchanlik.`,
(g,t,K)=>{const T=(t*40)%400,amp=1+T/50;for(let i=0;i<9;i++)for(let j=0;j<3;j++){g.fillStyle=T>200?K.h:K.m;g.beginPath();g.arc(60+i*60+Math.sin(t*14+i*j)*amp,40+j*36+Math.cos(t*12+i)*amp,9,0,7);g.fill()}const R=10*(1+.004*T);g.fillStyle=K.a;g.fillRect(60,150,480*R/26,16);g.fillStyle=K.c;g.font='14px sans-serif';g.textAlign='center';g.fillText('t = '+T.toFixed(0)+' °C,  R = R₀(1+αΔt) = '+R.toFixed(1)+' Ω',300,192)}],
[`Solishtirma qarshilik materialning asosiy xarakteristikasi: u 1 m uzunlikdagi, 1 mm² kesimli simning qarshiligiga teng. Kumush (0,016) va mis (0,017 Ω·mm²/m) eng yaxshi o'tkazgichlar, shuning uchun elektr simlari misdan yasaladi. Alyuminiy (0,028) yengil va arzon, elektr uzatish liniyalarida ishlatiladi. Nixrom (1,1) qarshiligi katta: undan isitgich spirallari yasaladi. Shisha, chinni, rezina — izolyatorlar.`,
(g,t,K)=>{const p=Math.min(1,(t*.5)%1.6);[['Ag',.016],['Cu',.017],['Al',.028],['Fe',.1],['nixrom',1.1]].forEach(([n,r],i)=>{const y=14+i*34,w=Math.max(4,300*r/1.1)*p;g.fillStyle=i>2?K.h:K.a;g.fillRect(100,y,w,22);g.fillStyle=K.c;g.font='14px sans-serif';g.textAlign='right';g.fillText(n,92,y+16);g.textAlign='left';g.fillText('ρ = '+r+' Ω·mm²/m',108+w,y+16)})}]],
34:[
[`Tok o'tganda o'tkazgich qiziydi: bu tokning issiqlik ta'siri. Sababi — elektronlarning panjara ionlari bilan to'qnashuvi: ionlar tebranishi kuchayadi, o'tkazgichning ichki energiyasi va harorati ortadi. Tok o'chirilsa, o'tkazgich atrof-muhitga issiqlik berib soviydi. Animatsiyada tok yoqilganda o'tkazgichning harorati ortishi va rangi o'zgarishi, o'chirilganda soviy boshlashi ko'rsatilgan.`,
(g,t,K)=>{const on=Math.floor(t/4)%2==0,ph=t%4,T=on?20+380*(1-Math.exp(-ph*.8)):20+364*Math.exp(-ph*.8),a=(T-20)/380;g.shadowColor='#ff6b00';g.shadowBlur=40*a;g.fillStyle=`rgb(${100+155*a},${90-60*a},${90-70*a})`;g.fillRect(150,80,240,36);g.shadowBlur=0;if(on){g.fillStyle=K.h;for(let i=0;i<8;i++){g.beginPath();g.arc(60+((i*60+t*120)%480),98,3,0,7);g.fill()}}g.strokeStyle=K.m;g.lineWidth=2;g.strokeRect(500,30,16,130);g.fillStyle=K.h;g.fillRect(500,160-130*a,16,130*a);g.fillStyle=K.c;g.font='14px sans-serif';g.textAlign='center';g.fillText(on?`tok yoqilgan: o'tkazgich qizimoqda, `+T.toFixed(0)+' °C':`tok o'chirilgan: soviyapti, `+T.toFixed(0)+' °C',280,192)}],
[`Ingliz fizigi Dj. Joul va rus fizigi E. Lens bir-biridan mustaqil ravishda aniqladilar: tok o'tganda o'tkazgichda ajralgan issiqlik miqdori tok kuchi kvadratiga, o'tkazgich qarshiligiga va tok o'tish vaqtiga to'g'ri proporsional: Q = I²·R·t. Qarshilikda tok ishi to'liq issiqlikka aylanadi, shuning uchun Q = A = U·I·t. Birligi — joul (J). Tok 2 marta oshsa, issiqlik 4 marta ortadi. Masalan, I = 2 A, R = 10 Ω, t = 5 s bo'lsa, Q = 4·10·5 = 200 J.`,
(g,t,K)=>{const I=2.5+1.5*Math.sin(t*.8),Q=I*I*50,bar=(y,l,v,max,c)=>{g.fillStyle=c;g.fillRect(120,y,420*v/max,22);g.fillStyle=K.c;g.textAlign='right';g.font='14px sans-serif';g.fillText(l,110,y+16)};bar(30,'I (A)',I,4,K.a);bar(75,'R (Ω)',5,10,K.m);bar(120,'Q (J)',Q,800,K.h);g.textAlign='left';g.fillText('Q = I²Rt = '+I.toFixed(1)+'²·5·10 = '+Q.toFixed(0)+' J   (t = 10 s)',120,180)}],
[`Zanjirning ketma-ket ulangan qismlarida tok bir xil, shuning uchun Q = I²Rt ga ko'ra qarshiligi katta qism ko'proq qiziydi. Shu sababli isitgich spirali nixromdan yasaladi, unga ulangan mis simlar esa deyarli qizimaydi. Parallel ulangan qismlarda kuchlanish bir xil bo'ladi, shuning uchun Q = U²t/R ga ko'ra qarshiligi kichik qism ko'proq qiziydi. Formulani qaysi ulanish bo'lsa, shunga mos tanlang.`,
(g,t,K)=>{[[170,2],[430,10]].forEach(([x,R])=>{const a=R/10*(.8+.2*Math.sin(t*5));g.shadowColor='#ff6b00';g.shadowBlur=40*a;g.fillStyle=`rgb(${110+145*a},${90-50*a},${80-60*a})`;g.fillRect(x-60,70,120,40);g.shadowBlur=0;g.fillStyle=K.c;g.font='14px sans-serif';g.textAlign='center';g.fillText('R = '+R+' Ω',x,140);g.fillText('Q = I²Rt ~ '+R,x,162)});g.fillText(`ketma-ketda I bir xil: katta R ko'proq qiziydi`,300,192)}],
[`Tokning issiqlik ta'siri texnikada keng qo'llanadi: cho'g'lanma lampa, elektr isitgich, dazmol, choynak, payvandlash. Biroq u zararli ham: simlar ortiqcha qizib, yong'in chiqarishi mumkin. Shuning uchun zanjirga saqlagich o'rnatiladi: tok ruxsat etilgan qiymatdan oshsa, uning yupqa simi eriydi va zanjirni uzadi. Saqlagich o'rniga tok ruxsat etilganidan katta tok o'tkazadigan sim qo'yish xavfli.`,
(g,t,K)=>{const I=(t*1.5)%10,brk=I>6,a=Math.min(1,I/6);g.strokeStyle=K.m;g.lineWidth=5;g.beginPath();g.moveTo(40,100);g.lineTo(250,100);g.moveTo(350,100);g.lineTo(450,100);g.stroke();g.shadowColor='#ff6b00';g.shadowBlur=brk?0:30*a;g.strokeStyle=`rgb(${120+135*a},${100-70*a},70)`;g.lineWidth=3;g.beginPath();if(!brk){g.moveTo(250,100);g.lineTo(350,100)}else{g.moveTo(250,100);g.lineTo(285,100);g.moveTo(315,100);g.lineTo(350,100)}g.stroke();g.shadowBlur=0;g.fillStyle=brk?K.m:'#ffd43b';g.globalAlpha=brk?.3:1;g.beginPath();g.arc(500,100,24,0,7);g.fill();g.globalAlpha=1;g.fillStyle=K.c;g.font='14px sans-serif';g.textAlign='center';g.fillText('I = '+I.toFixed(1)+' A  (saqlagich 6 A da eriydi)',300,40);g.fillText(brk?'saqlagich eridi: zanjir uzildi':'saqlagich butun: lampa yonmoqda',300,160)}]]});
Object.assign(B,{5:[
[`Elektr zaryadlar bir-biriga masofadan ta'sir qiladi. Bu ta'sir elektr maydon orqali uzatiladi: har bir zaryad o'z atrofida elektr maydon hosil qiladi va u maydonga kiritilgan boshqa zaryadga kuch bilan ta'sir qiladi. Elektr maydon moddaning bir ko'rinishi: u bizning sezgilarimizga bog'liq bo'lmagan holda mavjud. Maydonni tekshirish uchun sinov zaryadidan foydalaniladi.`,
(g,t,K)=>{g.fillStyle=K.h;g.beginPath();g.arc(200,100,14,0,7);g.fill();g.fillStyle='#fff';g.font='bold 16px sans-serif';g.textAlign='center';g.fillText('+',200,106);for(let k=0;k<4;k++){const r=14+((t*50+k*35)%140);g.strokeStyle=K.a;g.globalAlpha=1-(r-14)/140;g.lineWidth=2;g.beginPath();g.arc(200,100,r,0,7);g.stroke()}g.globalAlpha=1;g.fillStyle=K.c;g.beginPath();g.arc(430,100,8,0,7);g.fill();ar(g,430,100,1,50,K.h);g.font='14px sans-serif';g.fillText('sinov zaryadi',430,135);g.fillText(`zaryad atrofida maydon bor: u boshqa zaryadga kuch bilan ta'sir qiladi`,300,190)}],
[`Maydonning kuch xarakteristikasi — elektr maydon kuchlanganligi E. U maydonning berilgan nuqtasiga kiritilgan sinov zaryadiga ta'sir etuvchi kuchning shu zaryad miqdoriga nisbatiga teng: E = F/q. Birligi — N/C (yoki V/m). Nuqtaviy zaryad maydonida E = k·q/r²: zaryaddan uzoqlashgan sari kuchlanganlik kvadrat qonun bo'yicha kamayadi. Kuchlanganlik vektor kattalik: musbat zaryad uchun yo'nalishi zaryaddan tashqariga, manfiy zaryad uchun zaryad tomon.`,
(g,t,K)=>{const r=10+40*((t*.12)%1),E=18000/((r/100)**2)/1000,x=150+r*8;g.fillStyle=K.h;g.beginPath();g.arc(150,100,14,0,7);g.fill();g.fillStyle=K.c;g.beginPath();g.arc(x,100,7,0,7);g.fill();ar(g,x,70,1,Math.min(110,10+E/6),K.h);g.font='14px sans-serif';g.textAlign='center';g.fillText('q = 2 µC,  r = '+r.toFixed(0)+' sm:  E = kq/r² = '+E.toFixed(0)+' kN/C',300,180)}],
[`Elektr maydonni tasvirlash uchun kuch chiziqlaridan foydalaniladi. Ularning har bir nuqtadagi urinmasi kuchlanganlik vektori yo'nalishini ko'rsatadi. Chiziqlar musbat zaryaddan boshlanadi va manfiy zaryadda tugaydi, ular kesishmaydi. Chiziqlar zich joylashgan sohada maydon kuchli, siyrak joyda kuchsiz bo'ladi. Nuqtaviy zaryad chiziqlari radial to'g'ri chiziqlar bo'ladi.`,
(g,t,K)=>{[[180,1],[420,-1]].forEach(([cx,s])=>{for(let i=0;i<12;i++){const a=i*Math.PI/6;g.strokeStyle=K.m;g.lineWidth=1;g.beginPath();g.moveTo(cx+18*Math.cos(a),100+18*Math.sin(a));g.lineTo(cx+80*Math.cos(a),100+80*Math.sin(a));g.stroke();const p=(t*.6+i*.083)%1,r=s>0?18+62*p:80-62*p;g.fillStyle=K.a;g.beginPath();g.arc(cx+r*Math.cos(a),100+r*Math.sin(a),3,0,7);g.fill()}g.fillStyle=s>0?K.h:K.c;g.beginPath();g.arc(cx,100,14,0,7);g.fill();g.fillStyle='#fff';g.font='bold 16px sans-serif';g.textAlign='center';g.fillText(s>0?'+':'−',cx,106)});g.fillStyle=K.c;g.font='14px sans-serif';g.fillText('chiziqlar + dan chiqadi, − ga kiradi; zich joyda maydon kuchli',300,192)}],
[`Bir necha zaryad maydoni superpozitsiya prinsipiga bo'ysunadi: har bir nuqtadagi natijaviy kuchlanganlik alohida zaryadlar yaratgan kuchlanganliklarning vektor yig'indisiga teng: E = E₁ + E₂ + ... Maydonlar bir-biriga halaqit bermaydi: har bir zaryad boshqalar bo'lmagandek o'z maydonini hosil qiladi. Vektorlar bir to'g'ri chiziqda bo'lsa, ularni qo'shish yoki ayirish kerak; aks holda parallelogramm qoidasidan foydalaniladi.`,
(g,t,K)=>{const q2=1.6+.9*Math.sin(t*.8),P=[300,70];let sx=0,sy=0;[[180,150,1],[420,150,q2]].forEach(([x,y,q])=>{g.fillStyle=K.h;g.beginPath();g.arc(x,y,8+q*3,0,7);g.fill();const dx=P[0]-x,dy=P[1]-y,d=Math.hypot(dx,dy),L=50*q,vx=dx/d*L,vy=dy/d*L;sx+=vx;sy+=vy;g.strokeStyle=K.a;g.lineWidth=3;g.beginPath();g.moveTo(P[0],P[1]);g.lineTo(P[0]+vx,P[1]+vy);g.stroke()});g.strokeStyle=K.c;g.lineWidth=4;g.beginPath();g.moveTo(P[0],P[1]);g.lineTo(P[0]+sx,P[1]+sy);g.stroke();g.fillStyle=K.c;g.beginPath();g.arc(P[0],P[1],5,0,7);g.fill();g.font='14px sans-serif';g.textAlign='center';g.fillText(`E = E₁ + E₂ (vektor yig'indi): q₂ = `+q2.toFixed(1)+' q₁',300,192)}]],
40:[
[`Metallarda tashqi elektronlar atomlar bilan kuchsiz bog'langan, shuning uchun ular atomlardan ajralib butun metall bo'ylab erkin harakatlana oladi: ular erkin elektronlar deyiladi. Kristall panjara tugunlarida esa musbat ionlar joylashgan. Tok bo'lmaganda erkin elektronlar issiqlik harakati tufayli tartibsiz harakatlanadi, shuning uchun zaryad ko'chishi (tok) bo'lmaydi.`,
(g,t,K)=>{for(let i=0;i<9;i++)for(let j=0;j<3;j++){g.fillStyle=K.m;g.beginPath();g.arc(60+i*60,40+j*50,10,0,7);g.fill();g.fillStyle=K.c;g.font='11px sans-serif';g.textAlign='center';g.fillText('+',60+i*60,44+j*50)}g.fillStyle=K.h;for(let k=0;k<14;k++){const x=300+250*Math.sin(t*(.6+k*.07)+k)*Math.cos(k),y=100+80*Math.sin(t*(.9+k*.05)+k*2);g.beginPath();g.arc(x,y,4,0,7);g.fill()}g.fillStyle=K.c;g.font='14px sans-serif';g.fillText(`erkin elektronlar tartibsiz harakatlanadi: tok yo'q`,300,192)}],
[`Metall o'tkazgich uchlariga kuchlanish berilsa, ichida elektr maydon hosil bo'ladi. Elektronlar tartibsiz harakatini saqlagan holda maydon ta'sirida bir yo'nalishda (maydonga qarama-qarshi) siljiy boshlaydi: bu tartibli harakat tokni hosil qiladi. Elektronlarning o'rtacha tartibli (dreyf) tezligi juda kichik: mm/s tartibida. Lekin maydon yorug'lik tezligiga yaqin tezlikda tarqaladi, shuning uchun lampa kalit bosilishi bilan darrov yonadi.`,
(g,t,K)=>{for(let i=0;i<9;i++)for(let j=0;j<3;j++){g.fillStyle=K.m;g.beginPath();g.arc(60+i*60,40+j*50,10,0,7);g.fill()}g.fillStyle=K.h;for(let k=0;k<14;k++){const x=40+((k*37+t*28)%520)+6*Math.sin(t*8+k),y=40+(k*13%100)+10*Math.sin(t*6+k*2);g.beginPath();g.arc(x,y,4,0,7);g.fill()}ar(g,320,175,-1,80,K.a);g.fillStyle=K.c;g.font='14px sans-serif';g.textAlign='center';g.fillText('E',340,180);g.fillText(`maydon elektronlarni sekin bir tomonga siljitadi (dreyf)`,300,198)}],
[`Dreyf paytida elektronlar kristall panjara ionlari bilan to'qnashadi. Har bir to'qnashuvda elektron tezligini yo'qotadi va energiyasining bir qismini ionga beradi: ion kuchliroq tebranadi, metall qiziydi. Shu sababli tok o'tganda o'tkazgich qiziydi (Joul–Lens qonuni) va o'tkazgichda elektr qarshilik hosil bo'ladi. Panjara nuqsonlari va qo'shimchalar to'qnashuvlarni ko'paytirib, qarshilikni oshiradi.`,
(g,t,K)=>{const f=x=>100+36*Math.sin(x/17)*Math.cos(x/47),x=40+(t*70)%520,y=f(x);for(let i=0;i<9;i++)for(let j=0;j<4;j++){const ix=60+i*60,iy=40+j*40,hit=Math.hypot(ix-x,iy-y)<16;g.fillStyle=hit?K.h:K.m;g.beginPath();g.arc(ix,iy,hit?13:9,0,7);g.fill()}g.fillStyle=K.a;g.beginPath();g.arc(x,y,6,0,7);g.fill();g.fillStyle=K.c;g.font='14px sans-serif';g.textAlign='center';g.fillText(`to'qnashgan ion qiziydi: tok energiyasi issiqlikka aylanadi`,300,196)}],
[`1911-yilda gollandiyalik fizik Kamerling-Onnes simobning qarshiligi 4,2 K haroratda keskin nolga tushishini aniqladi. Bu hodisa o'ta o'tkazuvchanlik deyiladi. O'ta o'tkazgichda tok yo'qotishsiz oqadi va halqada uzoq vaqt saqlanishi mumkin. Hodisa kvant tabiatli. Hozir o'ta o'tkazgichlar kuchli elektromagnitlarda (MRT, tezlatgichlar) ishlatiladi; ularni sovitish uchun suyuq geliy yoki azot kerak.`,
(g,t,K)=>{const X=T=>60+T/10*480,R=T=>T>4.2?20+8*(T-4.2):0,Y=T=>170-R(T)*2;g.strokeStyle=K.m;g.lineWidth=1;g.beginPath();g.moveTo(60,10);g.lineTo(60,170);g.lineTo(560,170);g.stroke();g.strokeStyle=K.a;g.lineWidth=3;g.beginPath();g.moveTo(X(0),170);g.lineTo(X(4.2),170);g.lineTo(X(4.2),Y(4.21));for(let T=4.2;T<=10;T+=.1)g.lineTo(X(T),Y(T));g.stroke();const T=10-((t*1.1)%10);g.fillStyle=K.h;g.beginPath();g.arc(X(T),Y(T),7,0,7);g.fill();g.fillStyle=K.c;g.font='13px sans-serif';g.textAlign='center';g.fillText('T (K)',530,190);g.fillText('R',44,20);g.fillText('T = '+T.toFixed(1)+' K:  R '+(T>4.2?'> 0':`= 0 (o'ta o'tkazuvchanlik)`),300,40)}]]});
Object.assign(B,{1:[
[`Ba'zi jismlar bir-biriga ishqalanganda ular yengil jismlarni (qog'oz parchalari, mayda tuklar) o'ziga tortish qobiliyatini oladi: bunday jismlar elektrlangan (zaryadlangan) deyiladi. Elektrlanish atomlarning tarkibiy qismlari — elektronlarning bir jismdan boshqasiga o'tishi tufayli yuz beradi. Ishqalanganda jismlar bir-biriga yaqin keladi va elektronlar bog'lanish kuchsizroq bo'lgan jismdan kuchliroq bog'langan jismga o'tadi.`,
(g,t,K)=>{const x=300+80*Math.sin(t*3);g.fillStyle=K.m;g.globalAlpha=.4;g.fillRect(150,130,300,30);g.globalAlpha=1;g.fillStyle=K.a;g.fillRect(x-70,95,140,22);g.fillStyle=K.h;for(let i=0;i<5;i++){const p=(t*1.5+i*.2)%1;g.beginPath();g.arc(x-40+i*20,117+p*18,3,0,7);g.fill()}g.fillStyle=K.c;g.font='14px sans-serif';g.textAlign='center';g.fillText('tayoqcha',x,90);g.fillText('mato',300,178);g.fillText(`ishqalanishda elektronlar tayoqchadan matoga o'tadi`,300,196)}],
[`Ipak matoga ishqalangan shisha tayoqcha musbat, mo'ynaga ishqalangan ebonit tayoqcha manfiy zaryadlangan deb qabul qilingan. Elektron yo'qotgan jism musbat zaryadlanadi (elektronlar yetishmaydi), elektron olgan jism manfiy zaryadlanadi (elektronlar ortiqcha). Ikkala jismning zaryadlari miqdor jihatdan teng, ishorasi qarama-qarshi. Bir xil ishorali zaryadlar itarishadi, har xil ishoralilari tortishadi.`,
(g,t,K)=>{const n=Math.round(1+9*((t*.2)%1));[[170,'shisha tayoqcha',1],[430,'ipak mato',-1]].forEach(([x,l,s])=>{g.fillStyle=K.m;g.globalAlpha=.3;g.fillRect(x-70,70,140,60);g.globalAlpha=1;g.fillStyle=s>0?K.h:K.a;g.font='bold 16px sans-serif';g.textAlign='center';for(let i=0;i<n;i++)g.fillText(s>0?'+':'−',x-60+(i%5)*30,95+Math.floor(i/5)*28);g.fillStyle=K.c;g.font='14px sans-serif';g.fillText(l,x,150)});ar(g,250,100,1,50,K.c);ar(g,350,100,-1,50,K.c);g.fillText(`elektron yo'qotgan jism musbat, olgan jism manfiy zaryadlanadi`,300,190)}],
[`Jismning zaryadlanganligini elektroskop yordamida aniqlash mumkin: u metall sterjen va uning pastki uchidagi ikkita yengil bargdan iborat. Zaryadlangan jism sterjenga tekkizilsa yoki yaqin keltirilsa, barglar bir xil ishorali zaryad olib bir-biridan itarilib ochiladi. Zaryad qancha ko'p bo'lsa, barglar shuncha katta burchakka ochiladi. Elektroskop zaryad ishorasini emas, faqat uning miqdorini taxminan ko'rsatadi.`,
(g,t,K)=>{const s=.5+.5*Math.sin(t*1.2),th=.1+.6*s,by=12+(1-s)*20;g.strokeStyle=K.c;g.lineWidth=3;g.strokeRect(240,80,120,110);g.fillStyle=K.h;g.beginPath();g.arc(300,by,12,0,7);g.fill();g.strokeStyle=K.m;g.lineWidth=4;g.beginPath();g.moveTo(300,50);g.lineTo(300,125);g.stroke();g.fillStyle=K.m;g.beginPath();g.arc(300,50,7,0,7);g.fill();g.strokeStyle=K.a;g.lineWidth=5;[-1,1].forEach(d=>{g.beginPath();g.moveTo(300,125);g.lineTo(300+d*55*Math.sin(th),125+55*Math.cos(th));g.stroke()});g.fillStyle=K.c;g.font='14px sans-serif';g.textAlign='center';g.fillText('zaryadlangan jism yaqinlashgan sari barglar kengroq ochiladi',300,198)}],
[`Elektrlanishda zaryad yo'qolmaydi va yangidan paydo bo'lmaydi: u faqat bir jismdan ikkinchisiga o'tadi. Elektr zaryadining saqlanish qonuni: elektr jihatdan yopiq tizimda hamma zaryadlarning algebraik yig'indisi o'zgarishsiz qoladi. Masalan, shisha tayoqcha +5 nC, mato −5 nC zaryad olsa, yig'indi nolga teng bo'lib qoladi. Bu qonun tabiatning eng asosiy qonunlaridan biri.`,
(g,t,K)=>{const s=3*Math.sin(t*.8),q1=5+s,q2=3-s;g.fillStyle=K.a;g.fillRect(60,50,q1*30,26);g.fillStyle=K.h;g.fillRect(60,100,q2*30,26);g.fillStyle=K.c;g.font='14px sans-serif';g.textAlign='left';g.fillText('q₁ = '+q1.toFixed(1)+' nC',70+q1*30,68);g.fillText('q₂ = '+q2.toFixed(1)+' nC',70+q2*30,118);g.textAlign='center';g.fillText('q₁ + q₂ = '+(q1+q2).toFixed(1)+` nC (o'zgarmaydi)`,300,170)}]],
2:[
[`Elektr zaryad — jismlarning elektr o'zaro ta'sirga kirishish qobiliyatini xarakterlovchi fizik kattalik. Zaryadlangan jismlar bir-biriga kuch bilan ta'sir qiladi, zaryadsiz (neytral) jismlar esa bunday ta'sirga kirishmaydi. Zaryad q harfi bilan belgilanadi, SI da birligi — kulon (C). Zaryadning ikki turi bor: musbat va manfiy. Zaryadlangan jism neytral yengil jismlarni ham o'ziga tortadi, chunki ularda zaryadlar qayta taqsimlanadi.`,
(g,t,K)=>{const on=Math.floor(t/3)%2==1,ph=(t%3)/3;g.fillStyle=on?K.h:K.m;g.beginPath();g.arc(300,50,24,0,7);g.fill();g.fillStyle='#fff';g.font='bold 16px sans-serif';g.textAlign='center';g.fillText(on?'+':'0',300,56);g.fillStyle=K.c;for(let i=0;i<6;i++){const bx=230+i*28,by=on?170-Math.min(1,ph*2.2)*(40+(i%3)*12)+Math.sin(t*10+i)*2:170;g.fillRect(bx,by,12,5)}g.font='14px sans-serif';g.fillText(on?`zaryadlangan jism qog'oz parchalarini tortadi`:`zaryadsiz jism hech narsani tortmaydi`,300,196)}],
[`Tabiatdagi eng kichik zaryad — elementar zaryad. U elektron zaryadiga modul bo'yicha teng: e = 1,6·10⁻¹⁹ C. Proton +e, elektron −e zaryadga ega, neytron neytral. Atom odatda neytral: undagi protonlar soni elektronlar soniga teng. Jism N ta elektron olsa yoki yo'qotsa, uning zaryadi q = N·e bo'ladi. Masalan, 10¹⁰ ta elektron 1,6·10⁻⁹ C = 1,6 nC zaryad hosil qiladi.`,
(g,t,K)=>{const n=1+Math.floor(((t*.7)%1)*10);g.strokeStyle=K.m;g.lineWidth=2;g.strokeRect(150,50,300,100);for(let i=0;i<n;i++){const x=175+(i%5)*55+Math.sin(t*4+i)*3,y=80+Math.floor(i/5)*45+Math.cos(t*3+i)*3;g.fillStyle=K.h;g.beginPath();g.arc(x,y,9,0,7);g.fill();g.fillStyle='#fff';g.font='bold 14px sans-serif';g.textAlign='center';g.fillText('−',x,y+5)}g.fillStyle=K.c;g.font='14px sans-serif';g.textAlign='center';g.fillText('N = '+n+'·10¹⁰ ta elektron:  q = N·e = '+(n*1.6).toFixed(1)+' nC',300,185)}],
[`Yopiq tizimda zaryadlarning algebraik yig'indisi o'zgarmaydi: q₁ + q₂ + ... = const. Masalan, +6 nC va −2 nC zaryadli ikkita bir xil metall sharcha bir-biriga tekkizilsa, zaryadlar qayta taqsimlanadi va har biri +2 nC ga teng bo'ladi: ular yig'indisi +4 nC avvalgidek qoladi. Zaryadning saqlanish qonuni zarralarning o'zgarishlarida ham bajariladi.`,
(g,t,K)=>{const p=t%8,gap=p<2?160:p<4?160*(1-(p-2)/2):p<5?0:Math.min(160,160*(p-5)/2),a=p<4.5,q1=a?6:2,q2=a?-2:2,x1=270-gap/2,x2=330+gap/2;[[x1,q1],[x2,q2]].forEach(([x,q])=>{g.fillStyle=q>0?K.h:K.a;g.beginPath();g.arc(x,100,30,0,7);g.fill();g.fillStyle='#fff';g.font='bold 15px sans-serif';g.textAlign='center';g.fillText((q>0?'+':'−')+Math.abs(q)+' nC',x,106)});g.fillStyle=K.c;g.font='14px sans-serif';g.fillText('q₁ + q₂ = '+(q1+q2)+' nC — tegishdan oldin ham, keyin ham bir xil',300,180)}],
[`Zaryad uzluksiz o'zgarmaydi: har qanday jismning zaryadi elementar zaryadga karrali: q = ±N·e, bunda N — butun son. Zaryadning bunday bo'linuvchanlik chegarasi bo'lishi kvantlanish deyiladi. e ning ulushiga teng zaryadli erkin zarra topilmagan. Makroskopik jismlarda N juda katta, shuning uchun zaryad bizga uzluksiz o'zgaradigandek ko'rinadi.`,
(g,t,K)=>{const n=Math.floor((t*1.2)%9);for(let i=0;i<=8;i++){const x=60+i*58;g.fillStyle=i<=n?K.h:K.m;g.globalAlpha=i<=n?1:.3;g.fillRect(x,170-i*15-6,38,i*15+6);g.globalAlpha=1;g.fillStyle=K.c;g.font='13px sans-serif';g.textAlign='center';g.fillText(i+'e',x+19,188)}g.font='14px sans-serif';g.fillText('zaryad faqat butun sonli e ga karrali: q = '+n+'·e = '+(n*1.6).toFixed(1)+'·10⁻¹⁹ C',300,22)}]]});
Object.assign(B,{6:[
[`Metallarda erkin elektronlar butun hajm bo'ylab erkin harakatlana oladi. Shu sababli metall o'tkazgich tashqi elektr maydonga kiritilsa, erkin zaryadlar maydon ta'sirida siljiydi: elektronlar maydonga qarama-qarshi tomonga o'tadi, boshqa tomonda esa musbat ionlar o'z o'rnida qolib, musbat zaryad ortiqcha bo'ladi. Bu hodisa elektrostatik induksiya deyiladi. Maydon olib tashlansa, zaryadlar yana tekis taqsimlanadi.`,
(g,t,K)=>{const on=Math.floor(t/4)%2==1,r=Math.min(1,(t%4)/1.2),s=on?r:1-r;g.strokeStyle=K.m;g.lineWidth=3;g.strokeRect(200,60,200,80);g.font='12px sans-serif';g.textAlign='center';for(let i=0;i<6;i++)for(let j=0;j<3;j++){const x=225+i*30,y=80+j*22;g.fillStyle=K.c;g.fillText('+',x,y+4);g.fillStyle=K.h;g.beginPath();g.arc(x+10-s*22+Math.sin(t*5+i*j)*1.5,y+(j%2?5:-3),3.5,0,7);g.fill()}if(on){for(let y=75;y<=125;y+=25)ar(g,70,y,1,90,K.a)}g.fillStyle=K.c;g.font='14px sans-serif';g.fillText(on?`maydon: elektronlar chap tomonga siljidi`:`maydon yo'q: zaryadlar tekis taqsimlangan`,300,180)}],
[`O'tkazgichga berilgan ortiqcha zaryadning har bir bo'lagi bir xil ishorali boshqa bo'laklarni itaradi. Shu sababli zaryadlar bir-biridan imkon qadar uzoqlashib, o'tkazgichning tashqi sirtiga joylashadi; ichki hajmda ortiqcha zaryad bo'lmaydi. Shar shaklida zaryad sirtda tekis, uchli qismlarda esa to'planib qoladi (uchlarda maydon kuchli bo'ladi). Shuning uchun ichi bo'sh va to'liq o'tkazgich bir xil zaryadlanadi.`,
(g,t,K)=>{const p=Math.min(1,(t%6)/2.5);g.strokeStyle=K.m;g.lineWidth=3;g.beginPath();g.arc(300,100,72,0,7);g.stroke();g.fillStyle=K.h;for(let i=0;i<16;i++){const a=i*.393+.2,r0=(i*37)%60,r=r0+(70-r0)*p;g.beginPath();g.arc(300+r*Math.cos(a),100+r*Math.sin(a),5,0,7);g.fill()}g.fillStyle=K.c;g.font='14px sans-serif';g.textAlign='center';g.fillText(p<1?`zaryadlar bir-birini itarib sirtga o'tmoqda`:`barcha zaryad sirtda, ichida zaryad yo'q`,300,192)}],
[`Muvozanatdagi o'tkazgich ichida elektr maydon nolga teng bo'ladi: aks holda erkin zaryadlar harakatlanib, maydonni so'ndirar edi. Shu sababli metall g'ilof (Faradey qafasi) ichidagi jismlar tashqi elektr maydondan himoyalangan bo'ladi. Bu elektrostatik himoya deyiladi. Undan sezgir asboblarni ekranlashda va avtomobil, samolyot ichidagi odamlarni chaqmoqdan saqlashda foydalaniladi.`,
(g,t,K)=>{g.lineWidth=1;for(let y=30;y<=170;y+=20){const inb=y>70&&y<130;g.strokeStyle=K.m;g.beginPath();if(inb){g.moveTo(40,y);g.lineTo(240,y);g.moveTo(360,y);g.lineTo(560,y)}else{g.moveTo(40,y);g.lineTo(560,y)}g.stroke();for(let k=0;k<6;k++){const x=40+((k*90+t*80)%520);if(inb&&x>240&&x<360)continue;g.fillStyle=K.a;g.beginPath();g.arc(x,y,3,0,7);g.fill()}}g.strokeStyle=K.c;g.lineWidth=4;g.strokeRect(240,70,120,60);g.fillStyle=K.h;g.font='13px sans-serif';g.textAlign='center';g.fillText(`metall g'ilof`,300,104);g.fillStyle=K.c;g.font='14px sans-serif';g.fillText(`g'ilof ichida maydon yo'q: asboblar himoyalangan`,300,196)}],
[`Dielektriklar (shisha, chinni, rezina, quruq havo) tok o'tkazmaydi, chunki ularda erkin zaryadlar deyarli yo'q: zaryadlar atom va molekulalar ichida mahkam bog'langan. Tashqi maydonda dielektrik molekulalarning musbat va manfiy zaryadlari bir oz siljiydi yoki dipol molekulalar maydon bo'ylab buriladi: bu qutblanish deyiladi. Qutblanish natijasida dielektrik ichidagi maydon ε marta kamayadi: ε — dielektrik singdiruvchanlik.`,
(g,t,K)=>{const on=Math.floor(t/5)%2==1,r=Math.min(1,(t%5)/1.5),s=on?r:1-r;for(let i=0;i<7;i++)for(let j=0;j<3;j++){const x=100+i*66,y=45+j*40,a=Math.sin(i*3+j*5)*2.5*(1-s),dx=Math.cos(a)*14,dy=Math.sin(a)*14;g.strokeStyle=K.m;g.lineWidth=3;g.beginPath();g.moveTo(x-dx,y-dy);g.lineTo(x+dx,y+dy);g.stroke();g.fillStyle=K.h;g.beginPath();g.arc(x+dx,y+dy,4.5,0,7);g.fill();g.fillStyle=K.a;g.beginPath();g.arc(x-dx,y-dy,4.5,0,7);g.fill()}if(on)ar(g,200,166,1,200,K.c);g.fillStyle=K.c;g.font='14px sans-serif';g.textAlign='center';g.fillText(on?`maydonda dipollar maydon bo'ylab burildi (qutblanish)`:`maydon yo'q: dipollar tartibsiz`,300,194)}]],
8:[
[`Atmosfera elektri — bulutlarda va yer sirtida yig'ilgan zaryadlar bilan bog'liq hodisalar. Momaqaldiroq bulutlari ichida kuchli havo oqimlari muz zarralari va suv tomchilarini bir-biriga ishqalaydi va ularning elektrlanishiga olib keladi. Natijada bulutning yuqori qismi musbat, pastki qismi manfiy zaryadlanadi. Pastki qismning manfiy zaryadi tufayli yer sirti induksiya orqali musbat zaryadlanadi.`,
(g,t,K)=>{const n=Math.round(1+7*((t*.15)%1));g.fillStyle=K.m;g.globalAlpha=.35;g.beginPath();g.ellipse(300,70,170,45,0,0,7);g.fill();g.globalAlpha=1;g.font='bold 16px sans-serif';g.textAlign='center';for(let i=0;i<n;i++){g.fillStyle=K.h;g.fillText('+',200+i*28,52+Math.sin(t*3+i)*3);g.fillStyle=K.a;g.fillText('−',200+i*28,95+Math.sin(t*3+i*2)*3)}g.fillStyle=K.c;g.fillRect(40,172,520,6);g.font='14px sans-serif';g.fillText(`bulutda zaryadlar ajraladi: yuqori +, pastki −`,300,140);g.fillText('yer sirti musbat zaryadlanadi',300,196)}],
[`Bulut va yer orasidagi kuchlanish millionlab voltga yetganda havo teshiladi va kuchli elektr razryad — chaqmoq hosil bo'ladi. Chaqmoqdagi tok kuchi o'n minglab amperga yetadi, havo bir lahzada 30 000 °C gacha qiziydi va keskin kengayib, momaqaldiroq tovushini beradi. Yorug'lik tezligi tovushnikidan katta bo'lgani uchun chaqmoqni oldin ko'ramiz, momaqaldiroqni keyin eshitamiz.`,
(g,t,K)=>{const p=t%4,n=Math.min(8,Math.floor(p*2.4));g.fillStyle=K.m;g.globalAlpha=.4;g.beginPath();g.ellipse(300,45,180,32,0,0,7);g.fill();g.globalAlpha=1;g.fillStyle=K.a;g.font='bold 16px sans-serif';g.textAlign='center';for(let i=0;i<n;i++)g.fillText('−',200+i*28,60);g.fillStyle=K.c;g.fillRect(40,175,520,6);if(p>3.4&&p<3.8){g.strokeStyle='#ffd43b';g.lineWidth=4;g.shadowColor='#ffd43b';g.shadowBlur=25;g.beginPath();let x=300;const sd=Math.floor(t);g.moveTo(x,70);for(let y=70;y<175;y+=15){x+=Math.sin(y*7+sd*13)*18;g.lineTo(x,y+15)}g.stroke();g.shadowBlur=0}g.font='14px sans-serif';g.fillStyle=K.c;g.fillText(p>3.4?'chaqmoq: havo teshildi!':`zaryad to'planmoqda...`,300,15)}],
[`Chaqmoqdan binolarni himoya qilish uchun chaqmoq o'tkazgich (yashinqaytargich) ishlatiladi: bino tomidagi baland metall sterjen, yo'g'on o'tkazgich va yerga ko'milgan metall plastinkadan iborat. Chaqmoq eng baland va o'tkazuvchan nuqtaga uriladi: u sterjenga tushib, zaryadni o'tkazgich orqali yerga olib ketadi va binoga zarar yetkazmaydi. Chaqmoq o'tkazgichni 1752-yilda Benjamin Franklin kashf etgan.`,
(g,t,K)=>{const p=t%4,hit=p>3.2&&p<3.7;g.fillStyle=K.m;g.fillRect(220,110,160,65);g.beginPath();g.moveTo(210,110);g.lineTo(300,70);g.lineTo(390,110);g.closePath();g.fill();g.strokeStyle=hit?'#ffd43b':K.c;g.lineWidth=hit?5:3;g.beginPath();g.moveTo(300,70);g.lineTo(300,45);g.moveTo(300,70);g.lineTo(300,110);g.lineTo(240,110);g.lineTo(240,178);g.stroke();g.fillStyle=K.c;g.fillRect(40,178,520,6);if(hit){g.strokeStyle='#ffd43b';g.lineWidth=4;g.shadowColor='#ffd43b';g.shadowBlur=25;g.beginPath();g.moveTo(330,0);let x=330;for(let y=0;y<44;y+=11){x=Math.max(300,x-5-Math.abs(Math.sin(y*5))*5);g.lineTo(x,y+11)}g.lineTo(300,45);g.stroke();g.shadowBlur=0}g.font='14px sans-serif';g.textAlign='center';g.fillStyle=K.c;g.fillText(hit?`zaryad o'tkazgich orqali yerga ketdi, bino zarar ko'rmadi`:`chaqmoq o'tkazgich binoning eng baland nuqtasida`,300,196)}],
[`Momaqaldiroq paytida: ochiq maydonda, yakka daraxt, baland ustun va suv yonida turmang, chunki chaqmoq eng baland jismga uriladi. Xavfsiz joy — bino yoki yopiq metall korpusli avtomobil. Xonada derazalarni yoping, elektr asboblarni o'chiring, telefon va antennadan foydalanmang. Ochiq joyda qolsangiz, cho'nqayib o'tiring va oyoqlaringizni birga qo'ying.`,
(g,t,K)=>{const f=Math.max(0,Math.sin(t*3))**8;g.fillStyle='#ffd43b';g.globalAlpha=f*.35;g.fillRect(0,0,600,200);g.globalAlpha=1;g.fillStyle=K.m;g.fillRect(100,100,16,70);g.beginPath();g.arc(108,80,38,0,7);g.fill();g.fillStyle=K.c;g.beginPath();g.arc(160,150,7,0,7);g.fill();g.fillRect(156,157,8,22);g.fillStyle=K.h;g.font='bold 22px sans-serif';g.textAlign='center';g.fillText('✕',130,40);g.fillStyle=K.a;g.fillRect(380,110,140,65);g.beginPath();g.moveTo(370,110);g.lineTo(450,70);g.lineTo(530,110);g.closePath();g.fill();g.fillText('✓',450,40);g.fillStyle=K.c;g.font='14px sans-serif';g.fillText('yakka daraxt tagida: xavfli',130,194);g.fillText('bino ichida: xavfsiz',450,194)}]]});
Object.assign(B,{9:[
[`Elektr toki — zaryadli zarralarning tartibli (yo'naltirilgan) harakati. Metallarda bu zarralar erkin elektronlar, elektrolitlarda — ionlar, gazlarda — ionlar va elektronlardir. Tok bo'lmaganda zarralar issiqlik ta'sirida tartibsiz harakatlanadi va zaryad hech qayoqqa ko'chmaydi. Tok paydo bo'lganda esa zarralarning tartibsiz harakatiga bir yo'nalishli siljish qo'shiladi. Tok yo'nalishi sifatida musbat zaryadlarning harakat yo'nalishi qabul qilingan.`,
(g,t,K)=>{[[60,0],[140,1]].forEach(([y,o])=>{g.strokeStyle=K.m;g.lineWidth=14;g.globalAlpha=.25;g.beginPath();g.moveTo(40,y);g.lineTo(560,y);g.stroke();g.globalAlpha=1;g.fillStyle=K.h;for(let k=0;k<14;k++){const x=o?40+((k*38+t*70)%520):300+240*Math.sin(t*(.5+k*.06)+k),yy=y+(o?4*Math.sin(t*8+k):10*Math.sin(t*3+k));g.beginPath();g.arc(x,yy,4,0,7);g.fill()}g.fillStyle=K.c;g.font='14px sans-serif';g.textAlign='left';g.fillText(o?'tok bor: zaryadlar tartibli harakatda':`tok yo'q: zaryadlar tartibsiz harakatda`,50,y-18)})}],
[`Tok hosil bo'lishi uchun ikkita shart bajarilishi kerak: birinchidan, muhitda erkin zaryadli zarralar bo'lishi; ikkinchidan, ularni yo'naltiruvchi elektr maydon (ya'ni o'tkazgich uchlari orasida kuchlanish) mavjud bo'lishi. Maydonni tok manbai hosil qiladi va uni doimiy ushlab turadi. Erkin zaryadlar bo'lsa-yu, maydon bo'lmasa, tok bo'lmaydi; maydon bo'lsa-yu, erkin zaryadlar bo'lmasa (masalan, shisha), yana tok bo'lmaydi.`,
