(g,t,K)=>{const L=['manba','kalit','rezistor','ampermetr','voltmetr'],S=['+−','/','R','A','V'],k=Math.min(5,Math.floor((t*.8)%6));L.forEach((n,i)=>{const x=60+i*100;g.globalAlpha=i<k?1:.15;g.fillStyle=[K.h,K.c,K.m,K.a,K.a][i];g.fillRect(x,70,70,60);g.fillStyle='#fff';g.font='bold 20px sans-serif';g.textAlign='center';g.fillText(S[i],x+35,108);g.fillStyle=K.c;g.font='13px sans-serif';g.fillText(n,x+35,150)});g.globalAlpha=1;g.font='14px sans-serif';g.fillText('kerakli asboblar: '+k+' / 5',300,40)}],
[`Avval zanjir sxemasini chizing. Shartli belgilar: manba — ikkita chiziq (uzun — musbat qutb), kalit, rezistor — to'g'ri to'rtburchak, ampermetr — doira ichida A, voltmetr — doira ichida V. Ampermetr iste'molchi bilan ketma-ket, voltmetr esa unga parallel ulanadi. Sxemada tok yo'nalishini musbat qutbdan manfiy qutbga qarab ko'rsatish qabul qilingan. To'g'ri chizilgan sxema ulashni osonlashtiradi.`,
(g,t,K)=>{const k=Math.min(5,Math.floor((t*.8)%6)),al=i=>i<k?1:.12;g.strokeStyle=K.m;g.lineWidth=3;g.beginPath();g.moveTo(60,160);g.lineTo(60,40);g.lineTo(540,40);g.lineTo(540,160);g.lineTo(60,160);g.stroke();g.font='bold 15px sans-serif';g.textAlign='center';g.globalAlpha=al(0);g.fillStyle=K.h;g.fillRect(40,90,40,6);g.fillRect(48,106,24,6);g.globalAlpha=al(1);g.strokeStyle=K.c;g.lineWidth=4;g.beginPath();g.moveTo(150,40);g.lineTo(200,20);g.stroke();g.globalAlpha=al(2);g.fillStyle=K.a;g.fillRect(340,26,80,28);g.fillStyle='#fff';g.fillText('R',380,46);g.globalAlpha=al(3);g.fillStyle=K.a;g.beginPath();g.arc(540,100,20,0,7);g.fill();g.fillStyle='#fff';g.fillText('A',540,106);g.globalAlpha=al(4);g.strokeStyle=K.m;g.lineWidth=2;g.beginPath();g.moveTo(340,40);g.lineTo(340,110);g.lineTo(360,110);g.moveTo(420,40);g.lineTo(420,110);g.lineTo(400,110);g.stroke();g.fillStyle=K.h;g.beginPath();g.arc(380,110,20,0,7);g.fill();g.fillStyle='#fff';g.fillText('V',380,116);g.globalAlpha=1;g.fillStyle=K.c;g.font='14px sans-serif';g.fillText('A — ketma-ket, V — rezistorga parallel',300,192)}],
[`Zanjirni sxema bo'yicha yig'ing: avval manba, kalit, rezistor va ampermetr ketma-ket ulanadi, so'ng voltmetr rezistorga parallel qo'shiladi. Kalit ochiq holatda ulaysiz. Asboblar qutblariga e'tibor bering: tok «+» qutbga kirib, «−» dan chiqishi kerak. Yig'ilgan zanjirni o'qituvchiga ko'rsating va ruxsat olgach kalitni yoping.`,
seq([`Elementlar sxema bo'yicha ulanadi`,`Kalit ochiq holatda ulanadi`,`O'qituvchi tekshiradi`,`Kalit yopiladi: tok oqadi`])],
[`Kalitni yoping va ampermetr (I) hamda voltmetr (U) ko'rsatishlarini yozib oling. Kuchlanishni 2–3 marta o'zgartirib, o'lchashni takrorlang. Har bir o'lchash uchun R = U/I ni hisoblang. Natija har gal bir xil chiqsa (masalan, 5 Ω), rezistor qarshiligi tok va kuchlanishga bog'liq emasligi tasdiqlanadi. Xulosani yozishda o'lchash xatoliklarini ham eslab o'ting.`,
(g,t,K)=>{const k=Math.min(3,Math.floor((t*.7)%4)),D=[[2,.4],[4,.8],[6,1.2]];g.font='bold 15px sans-serif';g.textAlign='center';g.fillStyle=K.c;['U (V)','I (A)','R = U/I (Ω)'].forEach((h,i)=>g.fillText(h,150+i*150,35));D.forEach(([u,i],r)=>{g.globalAlpha=r<k?1:.12;g.fillStyle=K.c;g.fillText(u,150,75+r*38);g.fillText(i,300,75+r*38);g.fillStyle=K.h;g.fillText((u/i).toFixed(1),450,75+r*38)});g.globalAlpha=1;g.fillStyle=K.c;g.font='14px sans-serif';g.fillText(`R = U/I har gal bir xil (5 Ω): qarshilik o'zgarmaydi`,300,192)}]],
19:[
[`Laboratoriya ishining maqsadi — zanjirning bir qismi uchun Om qonunini tajribada tekshirish. Zanjir: manba, kalit, reostat (tokni rostlash uchun), rezistor, ampermetr (ketma-ket) va voltmetr (rezistorga parallel). Zanjirni sxema bo'yicha yig'ing, kalitni ochiq qoldiring va o'qituvchiga ko'rsating. Reostatning qarshiligi ishni boshlashda eng katta bo'lishi kerak, shunda tok kichik bo'ladi.`,
seq(['Manba, kalit, reostat, ampermetr, rezistor: ketma-ket',`Voltmetr: rezistorga parallel`,`Reostat qarshiligi: eng katta`,`O'qituvchi tekshirgach kalit yopiladi`])],
[`Reostat yordamida tok kuchini bir necha qiymatga o'zgartirib, har safar rezistordagi kuchlanish U va tok kuchi I ni o'lchang, masalan: U = 2, 4, 6, 8 V bo'lganda I = 0,4; 0,8; 1,2; 1,6 A. Natijalarni jadvalga yozing. Har bir o'lchashdan keyin ko'rsatishlarni asbob shkalasiga perpendikulyar qarab o'qing, xatolikni kamaytirish uchun.`,
(g,t,K)=>{const U=[2,4,6,8][Math.floor(t/2)%4];lp(g,t,K,U/5*1.2,[[300,'R = 5 Ω']],'U = '+U+' V,   I = '+(U/5).toFixed(1)+' A')}],
[`Jadvaldagi (U; I) juftliklar bo'yicha koordinata tekisligida nuqtalarni belgilang: gorizontal o'qda kuchlanish, vertikal o'qda tok kuchi. Nuqtalardan o'tuvchi chiziqni lineyka bilan chizing. Nuqtalar koordinata boshidan o'tuvchi to'g'ri chiziq atrofida joylashadi: bu I ~ U ekanini bildiradi. Chiziqning og'maligi 1/R ga teng, shuning uchun grafikdan R ni ham topish mumkin.`,
(g,t,K)=>{const k=Math.min(4,Math.floor((t*.7)%5)),X=u=>60+u/10*480,Y=i=>170-i/2*150,P=[[2,.4],[4,.8],[6,1.2],[8,1.6]];g.strokeStyle=K.m;g.lineWidth=1;g.beginPath();g.moveTo(60,10);g.lineTo(60,170);g.lineTo(560,170);g.stroke();if(k>=4){g.strokeStyle=K.a;g.lineWidth=3;g.beginPath();g.moveTo(X(0),Y(0));g.lineTo(X(10),Y(2));g.stroke()}g.fillStyle=K.h;P.slice(0,k).forEach(([u,i])=>{g.beginPath();g.arc(X(u),Y(i),6,0,7);g.fill()});g.fillStyle=K.c;g.font='13px sans-serif';g.textAlign='center';g.fillText('U (V)',540,190);g.fillText('I (A)',40,20);g.font='14px sans-serif';g.fillText(k<4?'tajriba nuqtalari chizilmoqda: '+k+' / 4':`nuqtalar bir to'g'ri chiziqda: I ~ U`,320,40)}],
[`Xulosa: qarshilik o'zgarmaganda zanjir qismidagi tok kuchi kuchlanishga to'g'ri proporsional (I ~ U). Grafik to'g'ri chiziq ekanligi buni tasdiqlaydi. Boshqa qarshilikli rezistor olsak, to'g'ri chiziq og'maligi boshqacha bo'ladi: qarshilik katta bo'lsa chiziq yotiqroq (I = U/R). Shunday qilib, Om qonuni tajribada tasdiqlandi: I = U/R.`,
(g,t,K)=>{const p=Math.min(1,(t*.5)%1.6),X=u=>60+u/10*480,Y=i=>170-i/2*150;g.strokeStyle=K.m;g.lineWidth=1;g.beginPath();g.moveTo(60,10);g.lineTo(60,170);g.lineTo(560,170);g.stroke();[[5,K.a],[10,K.h]].forEach(([R,c])=>{const u=10*p;g.strokeStyle=c;g.lineWidth=3;g.beginPath();g.moveTo(X(0),Y(0));g.lineTo(X(u),Y(u/R));g.stroke();g.fillStyle=c;g.font='13px sans-serif';g.textAlign='left';if(p>.7)g.fillText('R = '+R+' Ω',X(10)-60,Y(10/R)-8)});g.fillStyle=K.c;g.textAlign='center';g.font='14px sans-serif';g.fillText(`I = U/R: qarshilik katta bo'lsa grafik yotiqroq`,300,192)}]]});
Object.assign(B,{20:[
[`Amaliy mashg'ulotning maqsadi — reostat yordamida zanjirdagi tok kuchini rostlashni o'rganish. Zanjir: manba, kalit, reostat, iste'molchi (lampochka) va ampermetr ketma-ket ulanadi. Reostat sirpanuvchi kontaktining holati zanjirga kiritilgan sim uzunligini belgilaydi. Ishni boshlashdan oldin reostat dastasini eng katta qarshilik holatiga qo'ying: bu iste'molchini katta tokdan himoya qiladi.`,
(g,t,K)=>lp(g,t,K,1.2,[[200,'reostat'],[400,'lampa']],`reostat iste'molchi bilan ketma-ket ulanadi`)],
[`Reostat dastasini sekin siljitib, uning qarshiligini o'zgartiring. Kontakt reostatning qarshilikni oshiruvchi tomoniga surilsa, zanjirdagi ishchi sim uzunligi ortadi va reostat qarshiligi oshadi. Zanjirning umumiy qarshiligi R = R₁ + R_reostat bo'lgani uchun tok kuchi I = U/R kamayadi. Siljitishni silliq bajaring va har bir holatda ampermetr ko'rsatishini yozib oling.`,
(g,t,K)=>{const s=.5+.5*Math.sin(t*.8),x=100+400*s,Rr=20*s,I=12/(5+Rr);for(let i=0;i<20;i++){const xx=100+i*20;g.strokeStyle=xx<=x?K.h:K.m;g.lineWidth=3;g.beginPath();g.ellipse(xx,100,5,24,0,0,7);g.stroke()}g.strokeStyle=K.c;g.lineWidth=3;g.beginPath();g.moveTo(x,50);g.lineTo(x,74);g.moveTo(100,50);g.lineTo(500,50);g.stroke();g.fillStyle=K.c;g.beginPath();g.moveTo(x,78);g.lineTo(x-7,64);g.lineTo(x+7,64);g.fill();g.fillStyle=K.a;g.fillRect(100,150,400*I/2.4,14);g.fillStyle=K.c;g.font='14px sans-serif';g.textAlign='center';g.fillText('R(reostat) = '+Rr.toFixed(1)+' Ω,  R(lampa) = 5 Ω:  I = 12/(5+R) = '+I.toFixed(2)+' A',300,190)}],
[`Reostat qarshiligi kamayganda tok kuchi ortadi, lampochka yorqinroq yonadi (P = I²R). Qarshilik oshganda tok kamayadi va lampochka xiralashadi. Shu tarzda tok kuchini istalgan oraliqda silliq rostlash mumkin. Masalan, manba kuchlanishi 12 V, lampochka qarshiligi 5 Ω bo'lsa, reostat 0 Ω da I = 2,4 A, 20 Ω da I = 0,48 A bo'ladi.`,
(g,t,K)=>{const s=.5+.5*Math.sin(t*.8),I=12/(5+20*s),a=Math.min(1,(I/2.4)**2);g.shadowColor='#ffd43b';g.shadowBlur=45*a;g.fillStyle=`rgba(255,212,59,${.2+.8*a})`;g.beginPath();g.arc(300,80,40,0,7);g.fill();g.shadowBlur=0;g.fillStyle=K.c;g.font='14px sans-serif';g.textAlign='center';g.fillText('lampa',300,140);g.fillText('I = '+I.toFixed(2)+' A:  qarshilik oshsa, tok va yorqinlik kamayadi',300,180)}],
[`Xulosa: reostat iste'molchi bilan ketma-ket ulanib, tok kuchini rostlash imkonini beradi. Qarshilik oshsa — tok kamayadi, kamaysa — ortadi. Tok kuchining eng katta qiymati reostat qarshiligi nol bo'lganda bo'ladi: I_maks = U/R₁, eng kichigi esa reostat to'liq kiritilganda. Reostatdan radio, yoritgich va elektr dvigatellar tezligini rostlashda foydalaniladi.`,
seq([`Reostat iste'molchi bilan ketma-ket`,`R oshsa: umumiy R oshadi, I kamayadi`,`R kamaysa: I ortadi`,`I = U / (R₁ + R_reostat)`])]],
23:[
[`Tok manbalarini ketma-ket ulashda bir manbaning manfiy qutbi ikkinchisining musbat qutbiga ulanadi. Natijada umumiy EYUK manbalar EYUK lari yig'indisiga teng bo'ladi: ℰ = ℰ₁ + ℰ₂ + ... Masalan, 1,5 V li uchta batareya ketma-ket ulansa, 4,5 V beradi. Ichki qarshiliklar ham qo'shiladi: r = r₁ + r₂ + ... Ketma-ket ulash zanjirdagi kuchlanishni oshirish kerak bo'lganda qo'llaniladi.`,
(g,t,K)=>{const k=1+Math.floor((t*.6)%3);lp(g,t,K,k*1.2,[[300,'lampa']],'ketma-ket '+k+' ta batareya: ℰ = '+(1.5*k).toFixed(1)+' V')}],
[`Bir xil manbalarni parallel ulashda hamma musbat qutblar bir tugunga, manfiy qutblar ikkinchi tugunga ulanadi. Umumiy EYUK bitta manba EYUK iga teng bo'lib qoladi (ℰ = ℰ₁), lekin ichki qarshilik n marta kamayadi (r = r₁/n) va zanjirga beriladigan tok n ta manba orasida teng taqsimlanadi: har biri I/n beradi. Parallel ulash batareyaning ishlash vaqtini va beradigan toki imkoniyatini oshiradi.`,
(g,t,K)=>{const k=1+Math.floor((t*.6)%3);for(let i=0;i<k;i++){const h=100/k;g.fillStyle=K.a;g.fillRect(100+i*100,150-h,60,h);g.fillStyle=K.c;g.font='13px sans-serif';g.textAlign='center';g.fillText((1/k).toFixed(2)+' A',130+i*100,168);g.fillText('manba '+(i+1),130+i*100,186)}g.font='14px sans-serif';g.textAlign='center';g.fillText('parallel '+k+' ta: ℰ = 1,5 V (o\u2018zgarmaydi), umumiy tok I = 1 A',300,30)}],
[`EYUK ni to'g'ri hisoblash uchun ulanish turini aniqlang. Ketma-ket: ℰ = n·ℰ₁ (bir xil manbalar uchun), r = n·r₁. Parallel: ℰ = ℰ₁, r = r₁/n. Masalan, 3 ta 1,5 V li batareya ketma-ket — 4,5 V, parallel — 1,5 V. Zanjirdagi tok I = ℰ/(R + r) formula bilan topiladi. Manbalarni ulashda qutblarni aralashtirmang: noto'g'ri ulash EYUK ni kamaytiradi yoki qisqa tutashuv hosil qiladi.`,
(g,t,K)=>{const p=Math.min(1,(t*.5)%1.6);g.font='13px sans-serif';[1,2,3].forEach((k,i)=>{const y=20+i*55;g.textAlign='right';g.fillStyle=K.c;g.fillText('k = '+k,70,y+26);g.fillStyle=K.h;g.fillRect(80,y,240*(1.5*k)/4.5*p,18);g.fillStyle=K.a;g.fillRect(80,y+22,240*1.5/4.5*p,18);g.fillStyle=K.c;g.textAlign='left';g.fillText('ketma-ket: '+(1.5*k).toFixed(1)+' V',330,y+14);g.fillText('parallel: 1,5 V',330,y+36)})}],
[`Xulosa: ketma-ket ulashda manbalar EYUK lari qo'shiladi, parallelda EYUK o'zgarmaydi, lekin batareya uzoqroq ishlaydi va katta tok bera oladi. Qo'llanilishi: ketma-ket — fonar, pult va radioga bir necha batareya qo'yishda; parallel — katta sig'imli batareya yig'ishda. Aralash ulashda ikkala ta'sir ham kuzatiladi. Manbalarni bir xil turdagi va bir xil EYUK li tanlang.`,
seq(['Ketma-ket:  ℰ = ℰ₁ + ℰ₂ + ...,  r = r₁ + r₂ + ...','Parallel (bir xil):  ℰ = ℰ₁,  r = r₁/n','Ketma-ket: kuchlanish ortadi',`Parallel: ishlash vaqti (sig'im) ortadi`])]]});
Object.assign(B,{24:[
[`Laboratoriya ishining maqsadi — ketma-ket ulangan o'tkazgichlarda tok va kuchlanishning taqsimlanishini tekshirish. Zanjir: manba, kalit, ikkita rezistor (R₁ = 6 Ω, R₂ = 12 Ω) ketma-ket, ampermetr va voltmetr. Ampermetr istalgan joyda bir xil tok ko'rsatishi, kuchlanishlar yig'indisi manba kuchlanishiga teng bo'lishi kerak: U = U₁ + U₂. Umumiy qarshilik R = U/I formulasi bilan topiladi.`,
(g,t,K)=>lp(g,t,K,.8,[[200,'R₁ = 6 Ω'],[400,'R₂ = 12 Ω']],'A: 0,67 A;   V₁ = 4 V,  V₂ = 8 V')],
[`Endi shu rezistorlarni parallel ulang. Parallel ulashda voltmetr ikkala rezistor uchlarida bir xil kuchlanish ko'rsatadi. Har bir tarmoqdagi tokni va umumiy tokni ampermetr bilan o'lchang: I = I₁ + I₂. Ampermetrni tarmoqqa ketma-ket ulashni unutmang. Misol: U = 12 V da I₁ = 2 A, I₂ = 1 A, umumiy tok I = 3 A.`,
(g,t,K)=>par(g,t,K,6,12,'V = 12 V;  A₁ = 2 A,  A₂ = 1 A,  A = 3 A')],
[`Natijalarni jadvalga yozing: ulanish turi, kuchlanish U, tok kuchi I va hisoblangan qarshilik R = U/I. Ketma-ket ulashda umumiy qarshilik katta (≈ 18 Ω), tok kichik (≈ 0,67 A). Parallel ulashda qarshilik kichik (≈ 4 Ω), tok katta (3 A). Har bir o'lchashni 2–3 marta takrorlab, o'rtachasini oling; asboblar ko'rsatishini shkalaga perpendikulyar qarab o'qing.`,
(g,t,K)=>{const k=Math.min(2,Math.floor((t*.6)%3)),D=[['ketma-ket',12,.67,18],['parallel',12,3,4]];g.font='bold 14px sans-serif';g.textAlign='center';g.fillStyle=K.c;['ulanish','U (V)','I (A)','R = U/I (Ω)'].forEach((h,i)=>g.fillText(h,100+i*135,35));D.forEach(([n,u,i,r],j)=>{g.globalAlpha=j<k?1:.12;g.fillStyle=K.c;g.fillText(n,100,85+j*45);g.fillText(u,235,85+j*45);g.fillText(i.toFixed(2),370,85+j*45);g.fillStyle=K.h;g.fillText(r.toFixed(1),505,85+j*45)});g.globalAlpha=1;g.fillStyle=K.c;g.font='14px sans-serif';g.fillText('R₁ = 6 Ω, R₂ = 12 Ω:  umumiy qarshilik ulanish turiga bog\u2018liq',300,185)}],
[`Tajriba natijalarini nazariy formulalar bilan solishtiring. Ketma-ket: R = R₁ + R₂ = 6 + 12 = 18 Ω. Parallel: R = R₁R₂/(R₁ + R₂) = 72/18 = 4 Ω. O'lchangan qiymatlar shu natijalarga 1–3% xatolik bilan mos keladi (xatolik asboblar aniqligi va o'qish xatoliklaridan). Xulosa: ketma-ket va parallel ulash formulalari tajribada tasdiqlandi.`,
seq(['Ketma-ket:  R = R₁ + R₂ = 6 + 12 = 18 Ω ✓','Parallel:  R = R₁R₂/(R₁+R₂) = 72/18 = 4 Ω ✓',`Xatolik 1–3%: asboblar aniqligi`,'Formulalar tajribada tasdiqlandi'])]],
25:[
[`Aralash ulashda zanjirning bir qismida iste'molchilar ketma-ket, boshqa qismida parallel ulangan bo'ladi. Masalan, R₁ = 4 Ω rezistor R₂ = 6 Ω va R₃ = 3 Ω rezistorlarning parallel guruhiga ketma-ket ulangan. Bunday zanjirni hisoblashda avval sxemani tahlil qilish kerak: qaysi qismlar ketma-ket, qaysilari parallel ekanini aniqlab chiqing. Animatsiyada nuqtalar R₁ dan o'tib, ikki tarmoqqa bo'linadi.`,
(g,t,K)=>{const seg=(x0,y0,x1,y1,I)=>{g.strokeStyle=K.m;g.lineWidth=2;g.beginPath();g.moveTo(x0,y0);g.lineTo(x1,y1);g.stroke();g.fillStyle=K.h;for(let i=0;i<6;i++){const p=(i/6+t*I*.15)%1;g.beginPath();g.arc(x0+(x1-x0)*p,y0+(y1-y0)*p,3.5,0,7);g.fill()}},box=(x,y,l)=>{g.fillStyle=K.a;g.fillRect(x-40,y-14,80,28);g.fillStyle='#fff';g.font='13px sans-serif';g.textAlign='center';g.fillText(l,x,y+5)};seg(40,100,220,100,2);seg(220,100,220,60,.67);seg(220,60,440,60,.67);seg(440,60,440,100,.67);seg(220,100,220,140,1.33);seg(220,140,440,140,1.33);seg(440,140,440,100,1.33);seg(440,100,560,100,2);box(130,100,'R₁ = 4 Ω');box(330,60,'R₂ = 6 Ω');box(330,140,'R₃ = 3 Ω');g.fillStyle=K.c;g.font='14px sans-serif';g.textAlign='center';g.fillText('R₂ va R₃ parallel, R₁ ularga ketma-ket',300,190)}],
[`Hisoblash tartibi: avval parallel guruhni bitta ekvivalent qarshilik bilan almashtiring. Ikki rezistor uchun R₂₃ = R₂R₃/(R₂ + R₃) = 6·3/9 = 2 Ω. Natijada murakkab sxema oddiy ketma-ket zanjirga aylanadi. Almashtirish tok va kuchlanishni o'zgartirmaydi: tashqi zanjir uchun ikki rezistor o'rniga bitta 2 Ω li rezistor turgandek ishlaydi.`,
seq(['R₂ = 6 Ω,  R₃ = 3 Ω  (parallel)','1/R₂₃ = 1/6 + 1/3 = 1/2','R₂₃ = 2 Ω',`R₂ va R₃ o'rniga bitta 2 Ω li rezistor`])],
[`Endi ketma-ket qismlarni qo'shamiz: umumiy qarshilik R = R₁ + R₂₃ = 4 + 2 = 6 Ω. Umumiy tokni Om qonunidan topamiz: I = U/R. Keyin kuchlanishlarni taqsimlaymiz: R₁ dagi U₁ = I·R₁, parallel guruhdagi U₂₃ = I·R₂₃. Parallel tarmoqlarda tok qarshilikka teskari taqsimlanadi: I₂ = U₂₃/R₂, I₃ = U₂₃/R₃.`,
(g,t,K)=>{const p=Math.min(1,(t*.5)%1.6),w=60;g.fillStyle=K.a;g.fillRect(60,60,4*w*p,34);g.fillStyle=K.h;g.fillRect(60+4*w*p,60,2*w*p,34);g.fillStyle=K.c;g.font='14px sans-serif';g.textAlign='left';g.fillText('R₁ = 4 Ω',70,82);g.fillText('R₂₃ = 2 Ω',60+4*w*p+6,82);g.fillStyle=K.m;g.fillRect(60,120,6*w*p,34);g.fillStyle=K.c;g.fillText('R = R₁ + R₂₃ = '+(6*p).toFixed(1)+' Ω',70,142)}],
[`Misol: U = 12 V manbaga yuqoridagi aralash zanjir ulangan. R = 4 + 2 = 6 Ω; umumiy tok I = 12/6 = 2 A (R₁ dan shu tok o'tadi). U₁ = 2·4 = 8 V, parallel guruhda U₂₃ = 12 − 8 = 4 V. Tarmoqlarda I₂ = 4/6 ≈ 0,67 A, I₃ = 4/3 ≈ 1,33 A; yig'indisi 2 A ga teng. Tekshirish: U₁ + U₂₃ = 12 V.`,
seq(['U = 12 V;  R = 4 + 2 = 6 Ω','I = U/R = 12/6 = 2 A  (R₁ dan)','U₁ = 2·4 = 8 V;  U₂₃ = 12 − 8 = 4 V','I₂ = 4/6 ≈ 0,67 A,  I₃ = 4/3 ≈ 1,33 A'])]]});
Object.assign(B,{26:[
[`Masalani yechishdan oldin ulanish turini aniqlang. Agar rezistorlarning boshlari bir tugunga, oxirlari ikkinchi tugunga ulangan bo'lsa — parallel; agar ular ketma-ket zanjir hosil qilsa — ketma-ket. Misol: R₁ = 10 Ω va R₂ = 15 Ω rezistorlar U = 30 V manbaga parallel ulangan. Umumiy qarshilik, har bir tarmoqdagi va umumiy tokni toping.`,
(g,t,K)=>par(g,t,K,10,15,'ikkala rezistor bir xil ikki nuqtaga ulangan: parallel')],
[`Parallel ulashda 1/R = 1/R₁ + 1/R₂ = 1/10 + 1/15 = 3/30 + 2/30 = 5/30, bundan R = 6 Ω. Natija har bir qarshilikdan kichik, ya'ni parallel ulash qoidasiga mos. Ikki rezistor uchun qisqa formula: R = R₁R₂/(R₁ + R₂) = 150/25 = 6 Ω.`,
seq(['1/R = 1/10 + 1/15','1/R = 3/30 + 2/30 = 5/30','R = 6 Ω','R < 10 Ω: eng kichikdan ham kichik ✓'])],
[`Parallel ulashda kuchlanish hamma tarmoqda bir xil: U = 30 V. Tarmoq toklari: I₁ = U/R₁ = 30/10 = 3 A, I₂ = U/R₂ = 30/15 = 2 A. Umumiy tok tarmoqlar toklari yig'indisiga teng: I = I₁ + I₂ = 5 A. Javob: R = 6 Ω, I₁ = 3 A, I₂ = 2 A, I = 5 A.`,

seq(['I = U/R = 30/6 = 5 A ✓','P = 150 W;  P₁ + P₂ = 90 + 60 = 150 W ✓','Kichik R: katta tok ✓','Birlik: V/Ω = A ✓'])]],
29:[
[`Kondensator masalalarida asosiy formulalar: sig'im C = q/U, yassi kondensator uchun C = ε₀εS/d, saqlangan energiya W = CU²/2 = qU/2 = q²/(2C). Birliklar: F, µF = 10⁻⁶ F, pF = 10⁻¹² F; energiya joulda. Ulashlarda: parallel — C = C₁ + C₂, ketma-ket — 1/C = 1/C₁ + 1/C₂.`,
seq(['C = q/U','C = ε₀εS/d','W = CU²/2 = qU/2','Parallel: ΣC;   ketma-ket: Σ(1/C)'])],
[`Misol: C₁ = 4 µF va C₂ = 12 µF kondensatorlar. Parallel ulansa, C = 4 + 12 = 16 µF. Ketma-ket ulansa, 1/C = 1/4 + 1/12 = 4/12, demak C = 3 µF. Parallel ulash sig'imni oshiradi, ketma-ket ulash esa kamaytiradi: ketma-ket sig'im eng kichikdan ham kichik.`,
(g,t,K)=>{const p=Math.min(1,(t*.5)%1.6);[['C₁ = 4 µF',4,K.m],['C₂ = 12 µF',12,K.m],['parallel: 16 µF',16,K.a],['ketma-ket: 3 µF',3,K.h]].forEach(([n,v,c],i)=>{const y=14+i*44;g.fillStyle=c;g.fillRect(150,y,330*v/16*p,26);g.fillStyle=K.c;g.font='13px sans-serif';g.textAlign='right';g.fillText(n,142,y+18)})}],
[`Ikkala ulashni U = 20 V manbaga ulaymiz va energiyani hisoblaymiz. Parallel: W = CU²/2 = 16·10⁻⁶·400/2 = 3,2·10⁻³ J = 3,2 mJ. Ketma-ket: W = 3·10⁻⁶·400/2 = 0,6 mJ. Bir xil kuchlanishda sig'imi katta bo'lgan ulanish ko'proq energiya saqlaydi.`,
